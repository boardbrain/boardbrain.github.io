<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BoardBrain – I3-C final: Ergebnisliste und Korrektur</title>
    <style>
      :root {
        --bg: #231d18;
        --raised: #2d2620;
        --overlay: #383028;
        --border: #4b4036;
        --text: #f4ece1;
        --muted: #b8ab9b;
        --accent: #b45309;
        --accent-text: #f5be5b;
        --on-accent: #fff;
        --shadow: #0000008c;
        --backdrop: #000000b3;
        --error: #fc8585;
        --bg-image: radial-gradient(ellipse at 50% -10%, #4a3420 0%, transparent 60%);
        --red: #ef5359;
        --blue: #4189f5;
        --white: #f1f1f4;
        --orange: #f5852b;
        --res-wood: #74a75a;
        --res-brick: #d0714a;
        --res-wool: #b9dc8a;
        --res-grain: #e6c454;
        --res-ore: #a3acb8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg-image) fixed, var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', roboto, sans-serif;
        line-height: 1.5;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        background: none;
        border: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.25;
      }
      h2 {
        font-size: 1rem;
      }

      /* ---------- picker (not sticky) ---------- */
      .picker {
        display: grid;
        gap: 8px;
        padding: 10px 16px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }
      .picker .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .picker .label {
        min-width: 96px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .chip {
        min-height: 36px;
        padding: 6px 12px;
        font-size: 0.9rem;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .chip[aria-pressed='true'] {
        font-weight: 600;
        color: var(--accent-text);
        background: var(--overlay);
        border-color: var(--accent-text);
      }
      .intro {
        max-width: 1220px;
        margin: 0 auto;
        padding: 12px 16px 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .intro b {
        color: var(--text);
      }
      .stage {
        padding: 16px;
      }
      .jump {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        max-width: 1180px;
        margin: 0 auto 12px;
      }
      .jump .chip {
        min-height: 32px;
        padding: 4px 10px;
        font-size: 0.8rem;
      }

      /* ---------- device frames ---------- */
      .frame {
        position: relative;
        display: flex;
        flex-direction: column;
        margin: 0 auto;
        overflow: hidden;
        background: var(--bg-image), var(--bg);
        border: 1px dashed var(--border);
        border-radius: 24px;
      }
      .frame.phoneS {
        width: min(100%, 360px);
        height: 680px;
      }
      .frame.phoneP {
        width: min(100%, 390px);
        height: 800px;
      }
      .frame.tabletP {
        width: min(100%, 780px);
        height: 1020px;
      }
      .frame.wide {
        width: min(100%, 1180px);
        height: 760px;
      }
      .frame.device {
        position: fixed;
        inset: 0;
        z-index: 50;
        width: auto;
        height: auto;
        border: 0;
        border-radius: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      .exit {
        position: absolute;
        top: 50%;
        left: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        width: 28px;
        height: 56px;
        color: var(--muted);
        background: var(--overlay);
        border: 1px solid var(--border);
        border-left: 0;
        border-radius: 0 12px 12px 0;
        opacity: 0.8;
      }

      /* ---------- app frame (D-3, K-3) ---------- */
      .app {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        container-type: size;
      }
      .a-head {
        display: flex;
        flex: none;
        justify-content: center;
        padding: 10px 14px;
      }
      .logo {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .logo svg {
        color: var(--accent-text);
      }
      .scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .main {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 100%;
        max-width: 40rem;
        min-height: 100%;
        margin: 0 auto;
        padding: 20px 16px 24px;
      }
      .main.fill {
        height: 100%;
      }
      /* PO 10.11.2026: disabled buttons stay in their place, greyed out (as in the app). */
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      /* Page 8 in portrait as wide as the placement before it, so its band keeps its place (PO 10.11.2026). */
      @media (orientation: portrait) {
        .main.resMain {
          max-width: 64rem;
        }
      }
      .main.wideMain {
        max-width: 64rem;
      }
      .handSpace {
        flex: none;
      }
      .hand {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 3;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
        background: linear-gradient(180deg, transparent, var(--bg) 48px);
        pointer-events: none;
      }
      .hand.folded {
        background: linear-gradient(180deg, transparent, var(--bg) 32px);
      }
      .navCard {
        position: relative;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2px;
        width: 86px;
        height: 104px;
        margin: 0 -8px;
        font-size: 0.7rem;
        text-align: center;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 -4px 12px var(--shadow);
        transform-origin: 50% 140%;
        pointer-events: auto;
      }
      .navCard.active {
        font-weight: 700;
        color: var(--accent-text);
        border-color: var(--accent-text);
      }
      .hand.folded .navCard {
        place-items: start center;
        align-content: start;
        padding-top: 5px;
      }

      .pageHead {
        display: flex;
        flex: none;
        gap: 12px;
        align-items: center;
      }
      .pageHead .titles {
        flex: 1;
        min-width: 0;
      }
      .pageHead .sub {
        font-size: 0.85rem;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .iconBtn {
        display: grid;
        flex: none;
        place-items: center;
        width: 44px;
        height: 44px;
        color: var(--text);
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 50%;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 0.85rem;
      }
      .tiny {
        font-size: 0.75rem;
      }
      .card {
        padding: 14px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .primary {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 8px 20px;
        font-weight: 600;
        color: var(--on-accent);
        background: var(--accent);
        border-radius: 10px;
      }
      .primary[disabled] {
        opacity: 0.45;
        cursor: default;
      }
      .secondary {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 8px 16px;
        font-weight: 600;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .danger {
        color: var(--on-accent);
        background: #b42f36;
      }
      .pill {
        position: relative;
        display: inline-flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        padding: 4px 12px;
        font-size: 0.85rem;
        color: var(--accent-text);
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .linkBtn {
        min-height: 44px;
        padding: 0 8px;
        font-size: 0.85rem;
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .ph {
        position: relative;
        outline: 1px dashed var(--accent-text);
        outline-offset: 3px;
        border-radius: 8px;
      }
      .ph-tag {
        position: absolute;
        top: -10px;
        right: 6px;
        z-index: 2;
        padding: 0 6px;
        font-size: 0.65rem;
        color: var(--accent-text);
        background: var(--bg);
        border-radius: 6px;
        white-space: nowrap;
      }

      /* ---------- start ---------- */
      .start {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
        max-width: 620px;
        height: 100%;
        margin: 0 auto;
        padding: 14px 16px 30px;
      }
      .banner {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        font-size: 0.9rem;
        background: var(--raised);
        border: 1px solid var(--accent-text);
        border-radius: 12px;
      }
      .pile {
        display: flex;
        gap: 22px;
        align-items: center;
        width: 100%;
        padding: 14px 18px 14px 22px;
        text-align: left;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .pileStack {
        position: relative;
        flex: none;
        width: 54px;
        height: 74px;
      }
      .back {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          repeating-linear-gradient(45deg, transparent 0 5px, var(--border) 5px 6px),
          repeating-linear-gradient(-45deg, transparent 0 5px, var(--border) 5px 6px),
          var(--raised);
        border: 2px solid var(--overlay);
        border-radius: 8px;
        box-shadow:
          inset 0 0 0 3px var(--raised),
          inset 0 0 0 4px var(--accent-text),
          0 2px 6px var(--shadow);
      }
      .back:nth-child(1) {
        transform: rotate(-9deg) translate(-5px, 2px);
      }
      .back:nth-child(2) {
        transform: rotate(6deg) translate(4px, 1px);
      }
      .backBadge {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        color: var(--on-accent);
        background: var(--accent);
        border: 2px solid var(--overlay);
        border-radius: 50%;
      }
      .fan {
        display: flex;
        justify-content: center;
      }
      .pcard {
        position: relative;
        display: grid;
        gap: 6px;
        place-items: center;
        align-content: center;
        aspect-ratio: 5 / 7;
        padding: 18px 10px;
        text-align: center;
        background: linear-gradient(160deg, var(--overlay), var(--raised));
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 6px 18px var(--shadow);
      }
      .pcard .corner {
        position: absolute;
        top: 8px;
        left: 10px;
        font-weight: 800;
        line-height: 1;
        color: var(--accent-text);
      }
      .pcard .corner.br {
        inset: auto 10px 8px auto;
        transform: rotate(180deg);
      }
      .pcard .ic {
        color: var(--accent-text);
      }
      .fan .pcard {
        width: min(31cqw, 150px, 22cqh);
        margin: 0 -2%;
      }

      /* ---------- game choice ---------- */
      .gameGrid {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        padding-top: 8px;
      }
      .gameGrid .pcard {
        width: min(46%, 180px);
      }

      .gameCard {
        gap: 6px;
        padding: 22px 10px 18px;
        background: linear-gradient(160deg, var(--overlay), var(--raised));
      }
      .gameCard .gameName {
        font-size: 1.15rem;
        line-height: 1.2;
      }
      .gameCard .note {
        font-size: 0.75rem;
        color: var(--muted);
      }
      .emblem {
        display: grid;
        place-items: center;
      }
      /* E2: a window onto the board, like the picture area of a real card. */
      .windowCard {
        padding: 26px 10px 22px;
      }
      /* The picture fades softly into the card, without frame or hard edges. */
      .window {
        display: block;
        width: calc(100% + 20px);
        aspect-ratio: 4 / 3;
        margin: -6px -10px 2px;
        -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 55%, transparent 100%);
        mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 55%, transparent 100%);
      }
      .window svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* K1–K3: built like a development card (title band, framed picture, text field with an arch). */
      .devCard {
        --dc-paper: #efe4c8;
        --dc-paper2: #e6d8b5;
        --dc-ink: #3a2a1a;
        --dc-muted: #6e5940;
        --dc-rib1: #a0703f;
        --dc-rib2: #6c4423;
        --dc-rib-ink: #fbf1dc;
        --dc-frame: #8a6a44;
        --dc-badge: #e5b545;
        --dc-badge-ink: #7a4c12;

        display: flex;
        flex-direction: column;
        gap: 0;
        place-items: stretch;
        aspect-ratio: 5 / 7.4;
        padding: 10px 10px 9px;
        font-family: Georgia, 'Times New Roman', serif;
        color: var(--dc-ink);
        background: linear-gradient(170deg, var(--dc-paper), var(--dc-paper2));
        border: 1px solid #0006;
        border-radius: 14px;
        box-shadow: 0 6px 18px var(--shadow), inset 0 0 0 4px #ffffff22;
      }
      .devCard.k2 {
        --dc-paper: #3d342b;
        --dc-paper2: #2c251f;
        --dc-ink: var(--text);
        --dc-muted: var(--muted);
        --dc-rib1: #d08c2c;
        --dc-rib2: #9a5a12;
        --dc-rib-ink: #fff6e2;
        --dc-frame: #b98a3e;
        --dc-badge: #f5be5b;
        --dc-badge-ink: #6d3f07;

        border-color: var(--border);
      }
      .devCard.k3 {
        --dc-paper: #eee7d6;
        --dc-paper2: #e2d8c2;
        --dc-rib1: #3a7486;
        --dc-rib2: #1c4a5c;
        --dc-rib-ink: #f3efe4;
        --dc-frame: #5d7f8a;
      }
      .dcHead {
        position: relative;
        display: block;
        height: 32px;
      }
      .dcRibbon {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 1.15rem;
        letter-spacing: 0.05em;
        color: var(--dc-rib-ink);
        background: linear-gradient(180deg, var(--dc-rib1), var(--dc-rib2));
        clip-path: polygon(0 0, 100% 0, 95% 50%, 100% 100%, 0 100%, 5% 50%);
        text-shadow: 0 1px 2px #0007;
      }
      .dcArt {
        position: relative;
        flex: 1;
        min-height: 0;
        margin: 0 4px;
        overflow: hidden;
        border: 3px double var(--dc-frame);
        border-top: 0;
        box-shadow: inset 0 0 8px #0007;
      }
      .dcArt svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .dcText {
        position: relative;
        display: grid;
        gap: 1px;
        margin-top: -12px;
        padding: 12px 6px 4px;
        font-size: 0.8rem;
        line-height: 1.3;
        background: linear-gradient(180deg, var(--dc-paper), var(--dc-paper2));
        border-top: 2px solid var(--dc-frame);
        border-radius: 50% 50% 6px 6px / 16px 16px 6px 6px;
      }
      .dcText strong {
        font-size: 0.92rem;
      }
      .dcText > span {
        color: var(--dc-muted);
      }
      /* E6: the picture fills the whole card like a game box; corners and texts sit on it. */
      .coverCard {
        overflow: hidden;
        align-content: space-between;
        padding: 0;
        border-color: #f9c45c66;
      }
      .cover {
        position: absolute;
        inset: 0;
      }
      .cover svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .coverCard .corner {
        z-index: 1;
        color: #fff3cf;
        text-shadow: 0 1px 2px #0009;
      }
      .coverTitle,
      .coverFoot {
        position: relative;
        z-index: 1;
        width: 100%;
        text-align: center;
      }
      .coverTitle {
        padding: 22% 8px 0;
      }
      .coverTitle .gameName {
        font-size: 1.7rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: #fff3cf;
        text-transform: uppercase;
        text-shadow: 0 2px 6px #5a0f12cc;
      }
      .coverFoot {
        padding: 14px 8px 26px;
        font-size: 0.78rem;
        font-weight: 600;
        color: #fff3cf;
        text-shadow: 0 1px 3px #000c;
        background: linear-gradient(180deg, transparent, #1a120866 60%);
      }
      .thumb {
        display: grid;
        flex: none;
        place-items: center;
        width: 52px;
        height: 52px;
        overflow: hidden;
        background: var(--overlay);
        border-radius: 10px;
      }
      .thumb.ic {
        color: var(--accent-text);
      }
      .thumb.window {
        width: 64px;
        height: 52px;
        margin: 0;
        aspect-ratio: auto;
        background: none;
      }
      .gameLine {
        min-height: 72px;
      }
      .gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        justify-content: center;
        max-width: 1180px;
        margin: 22px auto 0;
      }
      .galleryItem {
        display: grid;
        gap: 8px;
        justify-items: center;
        margin: 0;
      }

      /* ---------- preparation ---------- */
      .tables {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr));
        gap: 10px;
      }
      .tableRow {
        display: flex;
        gap: 14px;
        align-items: center;
        width: 100%;
        min-height: 72px;
        padding: 10px 14px;
        text-align: left;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .tableRow[aria-pressed='true'] {
        background: var(--overlay);
        border-color: var(--accent-text);
        box-shadow: inset 0 0 0 1px var(--accent-text);
      }
      .tableRow .names {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .tablesStrip {
        display: flex;
        gap: 10px;
        margin: 0 -16px;
        padding: 2px 16px 6px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tablesStrip .tableRow {
        flex: none;
        width: 15.5rem;
      }
      .mini {
        position: relative;
        display: block;
        flex: none;
      }
      .mini .top {
        position: absolute;
        inset: 22%;
        background: var(--overlay);
        border: 2px solid var(--border);
        border-radius: 50%;
      }
      .mini .seat {
        position: absolute;
        width: 24%;
        aspect-ratio: 1;
        border: 1.5px solid var(--bg);
        border-radius: 22%;
        transform: translate(-50%, -50%);
      }
      .mini .seat.round {
        border-radius: 50%;
      }
      .mini.ghost .top {
        border-style: dashed;
        background: none;
      }
      .roomGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr));
        gap: 12px;
      }
      .roomGrid.bigGrid {
        grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
      }
      .roomCard {
        position: relative;
        display: grid;
        gap: 4px;
        justify-items: center;
        align-content: start;
        min-width: 0;
        padding: 16px 8px;
        text-align: center;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .roomGrid > .roomCard.sub {
        grid-template-rows: auto 1fr auto;
        row-gap: 4px;
        height: 15.25rem;
        padding-bottom: 12px;
        touch-action: manipulation;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .roomCard.sub .tname {
        display: -webkit-box;
        overflow: hidden;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .roomCard.sub .mini {
        margin-bottom: 4px;
      }
      .roomCard.sub .cardText {
        display: grid;
        gap: 2px;
        align-self: start;
        min-width: 0;
      }
      .roomCard.sub .count {
        align-self: end;
        padding-top: 4px;
      }
      .cardFoot {
        display: flex;
        align-self: end;
        justify-content: space-between;
        gap: 6px;
        width: 100%;
        margin-top: 4px;
        padding: 8px 6px 0;
        border-top: 1px solid var(--border);
      }
      .boundText {
        font-weight: 700;
        color: var(--accent-text);
      }
      .boundTag {
        position: absolute;
        top: 7px;
        left: 7px;
        padding: 0 6px;
        font-size: 0.62rem;
        font-weight: 700;
        color: var(--accent-text);

        list-style: none;

      .qStrip li {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        min-width: 0;
        padding: 4px 10px 4px 4px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .qStrip li.now {
        border-color: var(--accent-text);
      }
      .qStrip li.empty {
        padding-right: 4px;
        border-style: dashed;
        background: none;

      .qStrip .qNum {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        font-size: 0.72rem;
        font-weight: 800;
        color: var(--accent-text);
      }
      .qStrip .coin {
        font-size: 0.7rem;
      }
      .qStrip .qName {
        overflow: hidden;
        max-width: 4.5rem;
        font-size: 0.8rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .qRow {
        display: grid;
        flex: 1;
        grid-template-columns: repeat(var(--n), 1fr);
        gap: 8px;
        align-content: center;
        align-items: center;
        min-height: 0;
      }
      .qCard {
        position: relative;
        display: grid;
        gap: 6px;
        justify-items: center;
        align-content: center;

        min-width: 0;
        padding: 30px 4px 14px;

        border: 1px solid var(--border);

        left: 0;

        font-weight: 700;
        color: #fff6e2;
        background: linear-gradient(180deg, #d08c2c, #9a5a12);

      .placement {

      .boardArea {

        place-items: center;

      /* „Platzierung überspringen“ right above the band, without moving the board (PO 10.11.2026). */
      .skipOver {
        position: absolute;
        right: 0;
        bottom: -12px;
        left: 0;
        display: flex;
        justify-content: center;
        pointer-events: none;
      }

        min-height: 34px;
        pointer-events: auto;

      /* Page 8: table, band and buttons as on the placement (PO 10.11.2026). */
      .withBand {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
      }
      .boardArea svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .boardTag {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 2;
