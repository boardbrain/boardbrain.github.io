        gap: 8px;
        align-items: center;
        max-width: calc(100% - 20px);
        padding: 5px 12px 5px 5px;
        font-size: 0.9rem;
        background: color-mix(in srgb, var(--overlay) 88%, transparent);
        border: 1px solid var(--border);
        border-radius: 999px;
        box-shadow: 0 4px 12px var(--shadow);
      }
      .boardTag .coin {
        font-size: 0.75rem;
      }
      .boardArea .boardTag svg {
        flex: none;
        width: 20px;
        height: 20px;
      }
      .boardTag > span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .turnBar {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 14px;
        background: var(--overlay);
        border: 1px solid var(--accent-text);
        border-radius: 14px;
      }
      .turnBar .pNum {
        font-weight: 800;
        color: var(--accent-text);
      }
      .turnBar .tbText {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .turnBand {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 14px;
        color: var(--pc-ink);
        background: linear-gradient(160deg, color-mix(in srgb, var(--pc) 92%, #fff), color-mix(in srgb, var(--pc) 75%, #000));
        border-radius: 14px;
        box-shadow: 0 6px 16px var(--shadow);
      }
      .turnBand .tbPiece {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        background: #231d18cc;
        border-radius: 50%;
      }
      .turnBand.small {
        gap: 10px;
        /* As high as with „Als Nächstes“, so nothing moves when the line appears (PO 10.11.2026). */
        min-height: 50px;
        padding: 5px 10px 5px 5px;
        border-radius: 999px;
        box-shadow: 0 4px 10px var(--shadow);
      }
      .turnBand.small .tbLine {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tbOrder {
        display: inline-flex;
        flex: none;
        gap: 3px;
        padding: 3px;
        background: #231d18cc;
        border-radius: 999px;
      }
      .mCoin {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: 20px;
        height: 20px;
        font-size: 0.62rem;
        font-weight: 800;
        color: #231d18;
        border: 1.5px solid #231d18;
        border-radius: 50%;
        opacity: 0.55;
      }
      .mCoin.cur {
        opacity: 1;
        box-shadow: 0 0 0 2px var(--text);
      }
      .mCoin.done {
        opacity: 0.3;
      }
      .turnRow {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
        justify-content: center;
      }
      .turnRow .mCoin {
        opacity: 0.7;
      }
      .turnRow .mCoin.done {
        opacity: 0.25;
      }
      .turnRow .mCoin.cur {
        opacity: 1;
        transform: scale(1.2);
      }
      .turnBack {
        display: inline-grid;
        color: var(--muted);
      }
      .boardTag.colored {
        padding: 4px 14px 4px 4px;
        color: var(--pc-ink);
        background: linear-gradient(160deg, color-mix(in srgb, var(--pc) 92%, #fff), color-mix(in srgb, var(--pc) 75%, #000));
        border: none;
      }
      .tbPiece.small {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        background: #231d18cc;
        border-radius: 50%;
      }
      .turnBand .tbText {
        display: grid;
        line-height: 1.2;
      }
      .turnBand strong {
        font-size: 1.15rem;
      }
      .personChips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
      }
      .pChip {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        padding: 3px 10px 3px 6px;
        font-size: 0.8rem;
        color: var(--muted);
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .pChip.now {
        font-weight: 700;
        color: var(--text);
        border-color: var(--accent-text);
      }
      .pChip .pNum {
        font-weight: 800;
        color: var(--accent-text);
      }
      .pChip .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .cornerSeat {
        position: absolute;
        z-index: 2;
        display: grid;
        gap: 2px;
        justify-items: center;
        max-width: 26%;
        padding: 4px 8px 5px;
        font-size: 0.72rem;
        background: color-mix(in srgb, var(--overlay) 85%, transparent);
        border: 1px solid var(--border);
        border-radius: 10px;
        opacity: 0.75;
      }
      .cornerSeat.now {
        border-color: var(--accent-text);
        opacity: 1;
        box-shadow: 0 4px 12px var(--shadow);
      }
      .cornerSeat .coin {
        font-size: 0.65rem;
      }
      .cornerSeat .csName {
        max-width: 100%;
        overflow: hidden;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cornerSeat svg {
        width: 14px !important;
        height: 14px !important;
      }
      .cornerSeat.tl { top: 6px; left: 6px; }
      .cornerSeat.tr { top: 6px; right: 6px; }
      .cornerSeat.br { right: 6px; bottom: 6px; }
      .cornerSeat.bl { bottom: 6px; left: 6px; }
      .turnBar svg,
      .pSlots svg {
        flex: none;
      }
      .pStrip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
        grid-auto-flow: column;
        gap: 6px;
      }
      .pPerson {
        display: grid;
        gap: 3px;
        justify-items: center;
        min-width: 0;
        padding: 6px 4px 7px;
        font-size: 0.78rem;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .pPerson.now {
        background: var(--overlay);
        border-color: var(--accent-text);
        box-shadow: 0 6px 14px var(--shadow);
        transform: translateY(-4px);
      }
      .pPerson .pNum {
        font-size: 0.7rem;
        font-weight: 800;
        color: var(--accent-text);
      }
      .pPerson .coin {
        font-size: 0.72rem;
      }
      .pPerson .pName {
        max-width: 100%;
        overflow: hidden;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pSlots {
        display: inline-flex;
        gap: 3px;
        align-items: center;
        height: 16px;
      }
      .pSlots .slot {
        width: 12px;
        height: 12px;
        border: 1.5px dashed var(--border);
        border-radius: 3px;
      }
      .legend {
        display: flex;
        flex: none;
        flex-wrap: wrap;
        gap: 4px 14px;
        justify-content: center;
        font-size: 0.82rem;
      }
      .legend span {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .legend .cur {
        font-weight: 700;
      }
      .legend .dim {
        opacity: 0.55;
      }
      .resGrid {
        display: flex;
        flex: 1;
        flex-wrap: wrap;
        gap: 12px;
        align-content: center;
        justify-content: center;
      }
      .resCard {
        position: relative;
        display: grid;
        gap: 6px;
        place-items: center;
        align-content: center;
        width: min(27cqw, 120px);
        aspect-ratio: 5 / 7;
        padding: 10px 6px;
        font-size: 0.9rem;
        font-weight: 700;
        background: linear-gradient(160deg, var(--overlay), var(--raised));
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 6px 18px var(--shadow);
      }
      .resCard .stripe {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 8px;
        border-radius: 11px 11px 0 0;
      }
      .resCard4 {
        position: relative;
        display: grid;
        gap: 6px;
        justify-items: center;
        width: min(28cqw, 124px);
      }
      .resGrid.few .resCard4 {
        width: min(38cqw, 23cqh, 170px);
      }
      .resGrid.many .resCard4 {
        width: min(22cqw, 96px);
      }
      .rc4svg {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45));
      }
      .rc4Name {
        font-size: 0.85rem;
        font-weight: 700;
      }
      .resStack > .behind .rc4Name {
        visibility: hidden;
      }
      .rcGallery {
        max-width: 1000px;
        margin: 28px auto 0;
        text-align: center;
      }
      .rcRow4 {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        justify-content: center;
        margin-top: 12px;
      }
      .rcRow4 .resCard4 {
        width: 170px;
      }
      .resGrid.many .resCard {
        width: min(22cqw, 96px);
      }
      .resGrid.many .resCard.full .rcName {
        font-size: 0.72rem;
      }
      .resGrid.many .resCard .resIcon {
        width: 48px !important;
        height: 48px !important;
      }
      .resCard .resIcon,
      .resDev .resIcon {
        box-shadow: 0 3px 8px #0006;
      }
      .resCard.full {
        gap: 10px;
        padding: 14px 6px 12px;
        font-size: 0.95rem;
        color: #231d18;
        background: linear-gradient(160deg, color-mix(in srgb, var(--rc) 82%, #fff), color-mix(in srgb, var(--rc) 82%, #000));
        border: 4px solid #f1e6cf;
        box-shadow: 0 6px 18px var(--shadow), inset 0 0 0 1px #0003;
      }
      .resCard.full .resIcon {
        background: #f1e6cf !important;
      }
      .resCard.full .rcName {
        max-width: 100%;
        padding: 2px 8px;
        font-size: 0.85rem;
        font-weight: 800;
        background: #f1e6cf;
        border-radius: 999px;
      }
      .resDev {
        width: min(30cqw, 128px);
      }
      .resDev .dcRibbon strong {
        font-size: 0.85rem;
      }
      .resDev .dcArt {
        display: grid;
        place-items: center;
        border-bottom: 3px double var(--dc-frame);
      }
      .resCount {
        position: absolute;
        top: -10px;
        right: -10px;
        z-index: 3;
        display: grid;
        place-items: center;
        min-width: 36px;
        height: 36px;
        padding: 0 6px;
        font-size: 0.95rem;
        font-weight: 900;
        color: var(--on-accent);
        background: var(--accent);
        border: 3px solid var(--bg);
        border-radius: 999px;
      }
      .resStack {
        position: relative;
      }
      .resStack {
        display: grid;
      }
      .resStack > * {
        grid-area: 1 / 1;
      }
      .resStack > .behind {
        filter: brightness(0.7);
        transform: translate(8px, 6px) rotate(5deg);
      }
      .resList {
        display: grid;
        flex: 1;
        gap: 8px;
        align-content: center;
        width: 100%;
        max-width: 24rem;
        margin: 0 auto;
      }
      .resItem {
        display: flex;
        gap: 12px;
        align-items: center;
        min-height: 52px;
        padding: 8px 14px;
        font-weight: 600;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .resIcon {
        display: grid;
        flex: none;
        place-items: center;
        width: 36px;
        height: 36px;
        color: #231d18;
        border-radius: 50%;
      }
      .progWrap {
        display: grid;
        flex: none;
        gap: 10px;
      }
      .progWrap {
        position: relative;
      }
      /* The look-back note floats over the free space below the progress and only takes room (inflow)
         when it would cover content (PO). */
      .lookBack {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        left: 0;
        z-index: 3;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 4px 4px 4px 12px;
        font-size: 0.85rem;
        color: var(--accent-text);
        background: var(--overlay);
        border: 1px solid var(--accent-text);
        border-radius: 999px;
      }
      .lookBack.inflow {
        position: static;
      }
      .lookBack .pill {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        margin-left: auto;
        font-size: 0.8rem;
      }
      .actions {
        display: flex;
        flex: none;
        gap: 10px;
        align-items: center;
      }
      /* one line, so the buttons keep their height and the cards above do not change size (PO 09.11.) */
      .actions button {
        white-space: nowrap;
      }
      .actions .primary {
        flex: 1;
      }
      .actionsCol {
        display: grid;
        flex: none;
        gap: 4px;
        justify-items: center;
      }
      .actionsCol .actions {
        width: 100%;
      }
      .skipNote {
        font-size: 0.78rem;
        color: var(--muted);
        text-align: center;
      }

      /* Phones: the board as large as possible, edge to edge (PO). */
      @container (max-width: 719px) {
        .placement .boardArea {
          margin: 0 -8px;
        }
        .placement .boardArea.ph {
          padding: 0;
          border-right: 0;
          border-left: 0;
          border-radius: 0;
        }
      }

      /* Wide: board left, information right – only in landscape; a portrait tablet stacks like a phone (PO). */
      @container (min-width: 720px) and (orientation: landscape) {
        .placement.split {
          display: grid;
          grid-template-columns: minmax(0, 1.6fr) minmax(16rem, 1fr);
          grid-template-rows: auto minmax(0, 1fr) auto auto;
          column-gap: 28px;
        }
        .placement.split .boardArea {
          grid-row: 1 / -1;
          grid-column: 1;
        }
        .placement.split > :not(.boardArea) {
          grid-column: 2;
        }
        .placement.split .legend {
          flex-direction: column;
          align-items: flex-start;
          align-self: start;
          font-size: 0.9rem;
        }
      }

      /* Placement order list for landscape W2/W3; hidden everywhere else. */
      .wOrder {
        display: none;
        gap: 8px;
        align-content: start;
      }
      .wOrder h2 {
        font-size: 0.95rem;
      }
      .wRow {
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 50px;
        padding: 6px 12px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .wRow.now {
        border-color: var(--pc);
        box-shadow: inset 4px 0 0 var(--pc), 0 6px 14px var(--shadow);
      }
      .wRow .pNum {
        width: 1rem;
        font-weight: 800;
        color: var(--accent-text);
      }
      .wRow .wName {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .wSlots {
        display: inline-flex;
        flex: none;
        gap: 6px;
        align-items: center;
      }
      .wSlots .wMark {
        flex: none;
      }
      .wSlots .wMark.faded {
        opacity: 0.22;
      }

      /* Tablet landscape and PC: the board takes the full height; title, progress, band and buttons
         beside it, buttons level with the bottom of the board (PO). W2 adds the order list on the
         right, W3 puts it on the left with the board in the middle. */
      @container (min-width: 720px) and (orientation: landscape) {
        .main.placeMain {
          display: grid;
          grid-template-columns: minmax(0, 1.7fr) minmax(17rem, 1fr);
          grid-template-rows: auto auto auto minmax(0, 1fr) auto;
          grid-template-areas: 'board head' 'board prog' 'board band' 'board .' 'board act';
          column-gap: 32px;
          row-gap: 16px;
          max-width: 80rem;
        }
        .main.placeMain.pwW2 {
          grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
          grid-template-areas: 'board head' 'board prog' 'board band' 'board list' 'board .' 'board act';
        }
        .main.placeMain.pwW3 {
          grid-template-columns: minmax(16rem, 0.9fr) minmax(0, 2fr) minmax(16rem, 0.95fr);
          grid-template-areas: 'list board head' 'list board prog' 'list board band' 'list board .' 'list board act';
          column-gap: 24px;
          max-width: none;
        }
        .main.placeMain > .stepBody,
        .main.placeMain .placement.split {
          display: contents;
        }
        .main.placeMain .pageHead {
          grid-area: head;
        }
        .main.placeMain .progWrap {
          grid-area: prog;
        }
        .main.placeMain .turnBand {
          grid-area: band;
        }
        .main.placeMain .boardArea {
          grid-area: board;
        }
        .main.placeMain .wOrder {
          grid-area: list;
        }
        .main.placeMain .actionsCol {
          grid-area: act;
        }
        .main.placeMain.pwW2 .wOrder,
        .main.placeMain.pwW3 .wOrder {
          display: grid;
        }
        .main.placeMain.pwW2 .tbOrder,
        .main.placeMain.pwW3 .tbOrder {
          display: none;
        }
      }

      /* ---------- overview ---------- */
      .ovBoard {
        height: min(62cqw, 46cqh, 420px);
        flex: none;
      }
      /* Board tab: the board takes all the room, the buttons sit at the bottom (PO). */
      .ovBoardTab .ovBoard {
        flex: 1 1 0;
        height: auto;
        min-height: 9rem;
      }
      .ovBoardTab .ovEnd {
        margin-top: auto;
      }
      /* Phones: no scrolling on this tab (PO); the board takes the height that is left, edge to edge. */
      .main.ovBoardTab {
        gap: 12px;
      }
      /* The tab bar keeps its place when switching tabs (PO, 03.11.2026): 12 px below the title on both tabs. */
      .main:not(.ovBoardTab) > .tabs {
        margin-top: -8px;
      }
      @container (max-width: 719px) {
        .ovBoardTab .ovBoard {
          margin: 0 -8px;
        }
      }
      .lines {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        overflow: hidden;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .lines > * + * {
        border-top: 1px solid var(--border);
      }
      .line {
        display: flex;
        gap: 12px;
        align-items: center;
        width: 100%;
        min-height: 52px;
        padding: 8px 14px;
        text-align: left;
      }
      .line .lbl {
        flex: 1;
        min-width: 0;
      }
      .line .lbl small {
        display: block;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .line .again {
        flex: none;
        color: var(--muted);
      }
      .line:has(.who) .lbl {
        flex: 1 0 auto;
      }
      .line .who {
        display: inline-flex;
        flex: 0 1 auto;
        min-width: 0;
        max-width: 55%;
        gap: 8px;
        align-items: center;
      }
      .ellipsis {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .line .lbl {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pieceBtns {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
        max-width: 60%;
      }
      .ovNames {
        display: flex;
        flex: none;
        flex-wrap: wrap;
        gap: 8px 16px;
        justify-content: center;
        font-size: 0.9rem;
      }
      .ovNames > span {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        min-width: 0;
      }
      .ovNames b {
        font-weight: 800;
        color: var(--accent-text);
      }
      .ovNames .nm {
        overflow: hidden;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ovNames.n1 .coin {
        font-size: 0.75rem;
      }
      .ovNames.n2 {
        gap: 8px;
      }
      .ovNames.n2 > span {
        padding: 4px 12px 4px 10px;
        border-radius: 999px;
        box-shadow: inset 0 0 0 1px #0004;
      }
      .ovNames.n2 b,
      .ovNames.n3 b {
        color: inherit;
        opacity: 0.75;
      }
      .ovNames.n3 {
        display: grid;
        grid-auto-columns: minmax(0, 1fr);
        grid-auto-flow: column;
        gap: 0;
        overflow: hidden;
        border-radius: 999px;
        box-shadow: inset 0 0 0 1px #0004;
      }
      .ovNames.n3 > span {
        justify-content: center;
        padding: 6px 8px;
      }
      .pieceBtn {
        position: relative;
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .pieceBtn .pbAgain {
        position: absolute;
        right: 2px;
        bottom: 1px;
        display: grid;
        color: var(--muted);
      }
      .resInline {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .resInline .resIcon {
        width: 26px;
        height: 26px;
      }
      .tabs {
        display: flex;
        padding: 3px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .tabs button {
        flex: 1;
        min-height: 40px;
        font-size: 0.92rem;
        border-radius: 9px;
      }
      .tabs button[aria-selected='true'] {
        font-weight: 600;
        background: var(--overlay);
        box-shadow: inset 0 0 0 1px var(--accent-text);
        color: var(--accent-text);
      }
      .skippedBox {
        display: grid;
        gap: 4px;
        place-items: center;
        padding: 18px;
        text-align: center;
        border: 1px dashed var(--border);
        border-radius: 14px;
      }
      @container (min-width: 720px) {
        .ovSplit {
          display: grid;
          grid-template-columns: minmax(0, 1.3fr) minmax(18rem, 1fr);
          gap: 24px;
          align-items: start;
        }
        .ovSplit .ovBoard {
          position: sticky;
          top: 0;
          height: min(70cqh, 560px);
        }
      }

      /* ---------- dialog ---------- */
      .backdrop {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--backdrop);
      }
      .dialog {
        display: grid;
        gap: 14px;
        width: min(100%, 25rem);
        padding: 20px;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 30px var(--shadow);
      }
      .detailHead {
        display: grid;
        gap: 4px;
        justify-items: center;
        text-align: center;
      }
      .detailHead h2 {
        margin-top: 6px;
        overflow-wrap: anywhere;
        hyphens: auto;
      }
      .dialog .detailPeople {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
        gap: 6px 12px;
        max-height: 11rem;
        overflow-y: auto;
        padding: 0;
        color: var(--text);
        list-style: none;
      }
      .detailPeople li {
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .detailPeople .dot {
        flex: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .dialog h2 {
        font-size: 1.15rem;
      }
      .dialog ul {
        margin: 0;
        padding-left: 20px;
        color: var(--muted);
      }
      .dialog .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .dialog .buttons > * {
        flex: 1 1 8rem;
      }
      .rcCompare {
        display: grid;
        gap: 14px;
        max-width: 760px;
        margin: 28px auto 0;
        padding: 16px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .rcRow {
        display: grid;
        gap: 8px;
      }
      .rcCells {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      .rcCell {
        display: grid;
        gap: 8px;
        justify-items: center;
      }
      .rcChip {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        background: #f1f1f4;
        border: 2px solid #000;
        border-radius: 50%;
      }
      /* ---------- I2-G: more room ---------- */
      /* Start L1: logo and name large in the free room above the pile; it shrinks and finally goes
         when the room is too small, the cards never move. */
      .startTop {
        display: grid;
        flex: 1;
        min-height: 0;
        place-items: center;
        overflow: hidden;
        container-type: size;
      }
      .bigLogo {
        display: grid;
        gap: 6px;
        justify-items: center;
        font-size: clamp(1.2rem, 9cqh, 1.9rem);
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .bigLogo svg {
        width: clamp(40px, 34cqh, 96px);
        height: auto;
        color: var(--accent-text);
      }
      @container (height < 96px) {
        .bigLogo {
          display: none;
        }
      }
      /* Start L4/L5: at the top in the middle, small (as the bar of today) or medium; L6 large in the
         free room with the name beside the mark. */
      .topLogo {
        display: inline-flex;
        flex: none;
        gap: 8px;
        align-items: center;
        align-self: center;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .topLogo svg {
        color: var(--accent-text);
      }
      .topLogo.medium {
        gap: 12px;
        font-size: 1.45rem;
      }
      .rowLogo {
        display: flex;
        gap: 14px;
        align-items: center;
        font-size: clamp(1.3rem, 16cqh, 2.1rem);
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .rowLogo svg {
        width: clamp(40px, 46cqh, 72px);
        height: auto;
        color: var(--accent-text);
      }
      @container (height < 64px) {
        .rowLogo {
          display: none;
        }
      }
      /* Start L2: small, top left, only on the start. */
      .smallLogo {
        display: inline-flex;
        flex: none;
        gap: 8px;
        align-items: center;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .smallLogo svg {
        color: var(--accent-text);
      }
      /* U1: every page but the start has the same width, up to 64rem, in both orientations; the
         placement keeps its own landscape layout. So the back button sits in the same place on
         every page. */
      .uniform .main,
      .uniform .main.placeMain {
        max-width: 64rem;
      }
      /* U2: the same, up to 80rem (1280 px): an iPad in landscape is used edge to edge everywhere. */
      .uniform.u2 .main,
      .uniform.u2 .main.placeMain {
        max-width: 80rem;
      }
      /* Every head is as high as one with a subtitle (52 px): buttons and title stay centred on one
         level as today, and the buttons sit at the same height on every page. */
      .uniform .pageHead {
        min-height: 52px;
      }
      /* Placement in landscape: the head over both columns, so the back button keeps its place. */
      @container (min-width: 720px) and (orientation: landscape) {
        .uniform .main.placeMain.pwW2 {
          grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
          grid-template-areas: 'head head' 'board prog' 'board band' 'board list' 'board .' 'board act';
        }
      }
      /* Management as built today (for comparison): 24 px at the top, games 40rem, persons 64rem. */
      .main.mgToday {
        padding-top: 24px;
      }
      .main.mgNarrow {
        max-width: 40rem;
      }
      .mgList {
        display: grid;
        gap: 10px;
      }
      .mgRow {
        display: flex;
        gap: 12px;
        align-items: center;
        min-height: 56px;
        padding: 10px 14px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .mgGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .notes {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr));
        gap: 14px;
        max-width: 1180px;
        margin: 24px auto 0;
      }
      .notes ul {
        margin: 8px 0 0;
        padding-left: 18px;
      }
      /* ---------- I2-D proposal: states before drawing ---------- */
      .devCard.cardBack,
      .rcBack {
        display: grid;
        place-items: center;
        background:
          repeating-linear-gradient(45deg, transparent 0 7px, var(--border) 7px 8px),
          repeating-linear-gradient(-45deg, transparent 0 7px, var(--border) 7px 8px),
          var(--raised);
        border: 2px solid var(--overlay);
        box-shadow:
          inset 0 0 0 5px var(--raised),
          inset 0 0 0 6px var(--accent-text),
          0 6px 18px var(--shadow);
      }
      .rcBack {
        width: 100%;
        aspect-ratio: 100 / 150;
        border-radius: 10px;
      }
      .cardBack .backBadge {
        width: 52px;
        height: 52px;
      }
      /* The back lies exactly where the front will appear (same size, same place); the note hangs below
         it without moving the card. */
      .backWrap {
        position: relative;
        display: grid;
        justify-items: center;
      }
      .backWrap > .backCap {
        position: absolute;
        top: calc(100% + 12px);
        left: 50%;
        width: max-content;
        transform: translateX(-50%);
      }
      .backCap {
        display: grid;
        gap: 2px;
        justify-items: center;
        text-align: center;
      }
      .backCap strong {
        font-size: 1.05rem;
      }
      .coin.unknown {
        color: var(--accent-text);
        background: var(--overlay) !important;
        border: 1.5px dashed var(--accent-text);
        box-shadow: none;
      }
      .svgBack {
        position: relative;
        overflow: hidden;
        padding: 0 !important;
        background: #28211b !important;
      }
      .svgBack > svg {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      .dcArt.dim svg {
        filter: saturate(0.5) brightness(0.62);
      }
      .dcWho.cands {
        gap: 4px;
      }
      .dcWho.cands .coin {
        width: 22px;
        height: 22px;
        font-family: system-ui, -apple-system, 'Segoe UI', roboto, sans-serif;
        font-size: 0.7rem;
      }
      .nameSlot {
        display: inline-block;
        width: 5.5em;
        height: 1.25em;
        border: 1.5px dashed var(--accent-text);
        border-radius: 999px;
        opacity: 0.8;
      }
      .backGallery {
        display: grid;
        gap: 14px;
        max-width: 1000px;
        margin: 28px auto 0;
      }
      .backGallery h2 {
        margin: 8px 0 0;
        font-size: 1.05rem;
      }
      .bgRow {
        display: grid;
        gap: 8px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .bgRow.sel,
      .bgPh.sel {
        border-color: var(--accent-text);
      }
      .bgCards {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: end;
      }
      .bgCards .qCard,
      .bgCards .rcBack,
      .bgCards .resCard4,
      .bgCards .devCard {
        width: 100%;
      }
      .bgCards .qCard {
        padding-top: 24px;
      }
      .bgPh {
        display: grid;
        gap: 8px;
        justify-items: center;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .qBack.next {
        opacity: 1;
        box-shadow:
          0 0 0 2px var(--accent-text),
          inset 0 0 0 3px var(--raised),
          inset 0 0 0 4px var(--accent-text),
          0 10px 22px var(--shadow);
        transform: translateY(-10px);
      }
      .qBack.soon {
        box-shadow:
          0 0 0 1px var(--accent-text),
          inset 0 0 0 3px var(--raised),
          inset 0 0 0 4px var(--accent-text),
          0 4px 12px var(--shadow);
      }
      .nextCap {
        flex: none;
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
        text-align: center;
      }
      .tbNext {
        display: block;
        font-size: 0.68rem;
        line-height: 1.1;
        opacity: 0.85;
      }
      .turnBand.doneBand {
        color: var(--text);
        background: var(--raised);
        border: 1px solid var(--border);
      }
      .tapRow {
        font-size: 0.85rem;
      }
      /* ---------- I2-D: table editor as in the app (reference i1f-edit-final-preview.html) ---------- */
      .lbl {
        font-weight: 700;
      }
      .field {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 0 12px;
        color: var(--text);
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .edDialog {
        width: 100%;
        max-width: 62rem;
        padding: 16px;
      }
      .edHead {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
      }
      .edHead h2 {
        font-size: 1.5rem;
      }
      .squareBtn {
        display: grid;
        flex: none;
        place-items: center;
        width: 44px;
        height: 44px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .edForm {
        display: grid;
        gap: 16px;
      }
      .edSection {
        display: grid;
        gap: 12px;
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      .edHeadRow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: baseline;
        justify-content: space-between;
      }
      .lockNote {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        font-size: 0.85rem;
        color: var(--muted);
        background: var(--raised);
        border: 1px dashed var(--border);
        border-radius: 8px;
      }
      .segment {
        display: grid;
        grid-auto-columns: minmax(0, 1fr);
        grid-auto-flow: column;
        gap: 4px;
        padding: 4px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .segment button {
        min-height: 44px;
        padding: 4px 8px;
        text-align: center;
        border-radius: 8px;
      }
      .segment .on {
        font-weight: 600;
        color: var(--on-accent);
        background: var(--accent);
      }
      .segment .more {
        font-weight: 600;
        color: var(--accent-text);
      }
      .switchRow {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: 44px;
        padding: 8px 16px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .edSwitch {
        position: relative;
        flex: none;
        width: 3.25rem;
        height: 1.875rem;
        background: var(--border);
        border-radius: 1rem;
      }
      .edSwitch::after {
        position: absolute;
        top: 0.1875rem;
        left: 0.1875rem;
        width: 1.5rem;
        height: 1.5rem;
        content: '';
        background: var(--text);
        border-radius: 50%;
      }
      .saveBar {
        position: sticky;
        bottom: 0;
        padding: 12px 0 4px;
      }
      .saveBar .primary {
        width: 100%;
        min-height: 3.25rem;
        font-size: 1.05rem;
        font-weight: 700;
      }
      /* the lock: the binding is shown, but faded and not changeable */
      .edOff {
        opacity: 0.45;
      }
      .edLock {
        color: var(--text);
        border-style: solid;
        border-color: var(--accent-text);
      }
      .edLegend {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 0;
        margin-bottom: 12px;
      }
      .edLegend .lockTag {
        margin-left: auto;
      }
      .edHint {
        padding: 18px 12px;
        font-size: 0.8rem;
        color: var(--muted);
        text-align: center;
        border: 1px dashed var(--border);
        border-radius: 12px;
      }
      /* new match while one is running, Q2 inline */
      .nmWrap {
        display: grid;
        gap: 12px;
      }
      .nmWrap > .banner {
        margin: 12px 16px 0;
      }
      .nmDim {
        pointer-events: none;
        opacity: 0.45;
      }
      .nmEnd {
        display: grid;
        justify-items: center;
      }
      .dangerText {
        color: #f08a8f;
      }
      /* ---------- card draw proposal ---------- */
      .drawTable {
        position: relative;
        flex: 1;
        min-height: 0;
        perspective: 1100px;
      }
      .pc {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 50% 50%;
      }
      .pcIn {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
      }
      .pcFace {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 10px;
        box-shadow: 0 4px 12px var(--shadow);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .pcFront {
        display: grid;
        gap: 6px;
        place-items: center;
        align-content: center;
        padding: 4px 4px 10px;
        background: linear-gradient(160deg, var(--overlay), var(--raised));
        border: 1px solid var(--border);
      }
      .pcFront strong {
        max-width: 94%;
        overflow: hidden;
        font-size: 0.8rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pcFront .stripe {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 7px;
      }
      .pcBack {
        background: #28211b;
        transform: rotateY(180deg);
      }
      .pcBack svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .slot {
        position: absolute;
        display: grid;
        place-items: center;
        font-weight: 800;
        color: var(--accent-text);
        border: 1.5px dashed var(--accent-text);
        border-radius: 10px;
        opacity: 0.55;
      }
      /* PO 09.11.: once a card lies on the place the dashed line goes, so it does not show at the edge */
      .slot.filled {
        color: transparent;
        border-color: transparent;
      }
      .slot b {
        position: absolute;
        top: -20px;
        right: -10px;
        left: -10px;
        font-size: 0.72rem;
        text-align: center;
      }
      /* The result card of the flow at its own width, scaled as a whole (design unchanged). */
      .resultCard.taskCard {
        position: absolute;
        display: block;
        transform-origin: 0 0;
      }
      .resultCard.taskCard .drawDev {
        width: 240px;
      }
      /* order scene: the front is the order card of the flow; without a place it has no band yet */
      .pcFace.qCard {
        position: absolute;
        aspect-ratio: auto;
      }
      .pcFace.qCard.noBand {
        padding-top: 14px;
      }
      /* resource cards: the S4 card of the flow as front, the back with the same rounded corners */
      .pc.res .pcFace {
        border-radius: 5px;
      }
      .pcFace.rcFace {
        overflow: visible;
        box-shadow: none;
      }
      .rcFace .rc4svg {
        width: 100%;
        height: 100%;
      }
      .slotName {
        position: absolute;
        text-align: center;
      }
      .turnBand.bandAbs {
        position: absolute;
        right: 0;
        left: 0;
      }
      .wheelBox {
        position: absolute;
        overflow: visible;
      }

      /* ---------- I3 round 1: additions (base: docs/design/i2g-more-room-final-preview.html) ---------- */
      .picker .desc {
        flex-basis: 100%;
        padding-left: 102px;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .picker .qrow + .qrow {
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .chip .star {
        color: var(--accent-text);
      }
      @media (width < 640px) {
        .picker .label {
          flex-basis: 100%;
        }
        .picker .desc {
          padding-left: 0;
        }
      }
      .fan.four .pcard {
        width: min(23cqw, 130px, 20cqh);
        margin: 0 -0.5%;
        padding: 14px 6px;
      }
      .fan.four .pcard strong {
        font-size: 0.85rem;
      }
      .askGrid .dcRibbon {
        font-size: 1rem;
      }
      .playGrid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .playGrid .pcard {
        width: 100%;
        padding: 16px 6px 14px;
      }
      .playGrid .pcard .gname {
        font-size: 0.95rem;
        line-height: 1.2;
      }
      .playGrid .pcard .note {
        font-size: 0.7rem;
        line-height: 1.25;
        color: var(--muted);
      }
      .devGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .devGrid .devCard {
        width: 100%;
      }
      .devGrid .devCard .dcRibbon {
        font-size: 1rem;
      }
      .swipe {
        display: flex;
        gap: 14px;
        margin: 0 -16px;
        padding: 6px 16px 14px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
      }
      .swipe .devCard {
        flex: none;
        width: min(60cqw, 230px);
        scroll-snap-align: center;
      }
      .catanSolo {
        display: flex;
        justify-content: center;
      }
      .catanSolo .devCard {
        width: min(64cqw, 240px);
      }
      .ownArt {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        font: 700 3.2rem Georgia, 'Times New Roman', serif;
        color: var(--accent-text);
        background:
          radial-gradient(circle at 50% 42%, #5a4636 0%, #2c251f 72%),
          #2c251f;
      }
      .ownArt.small {
        font-size: 1.5rem;
      }
      .q3Buttons {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 10px;
      }
      .askGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        align-items: stretch;
      }
      .askGrid > * {
        width: 100%;
      }
      .askCard {
        display: grid;
        gap: 8px;
        place-items: center;
        align-content: center;
        aspect-ratio: 5 / 7.4;
        padding: 14px 10px;
        text-align: center;
        background: linear-gradient(160deg, var(--overlay), var(--raised));
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 6px 18px var(--shadow);
      }
      .askCard .ic {
        color: var(--accent-text);
      }
      .askCard small {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .sheetBack {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: flex-end;
        background: var(--backdrop);
      }
      .sheet {
        display: grid;
        gap: 14px;
        width: 100%;
        padding: 10px 16px calc(20px + var(--hand));
        background: var(--bg);
        border-top: 1px solid var(--border);
        border-radius: 20px 20px 0 0;
      }
      .sheet .grab {
        justify-self: center;
        width: 40px;
        height: 4px;
        background: var(--border);
        border-radius: 2px;
      }
      .sheet .askGrid {
        max-width: 420px;
        margin: 0 auto;
      }
      .pRow {
        min-width: 0;
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 58px;
        padding: 6px 12px;
      }
      .pRow .place {
        width: 1.7rem;
        flex: none;
        font-weight: 800;
        text-align: right;
        color: var(--accent-text);
      }
      .pRow .nm {
        flex: 1;
        min-width: 0;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .num {
        width: 74px;
        min-height: 44px;
        padding: 0 10px;
        font: inherit;
        font-weight: 600;
        text-align: right;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .num.big {
        width: 96px;
        font-size: 1.2rem;
      }
      .crownBtn {
        display: grid;
        flex: none;
        place-items: center;
        width: 44px;
        height: 44px;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: 50%;
      }
      .crownBtn.on {
        color: #231d18;
        background: var(--accent-text);
        border: 1px solid var(--accent-text);
      }
      .crownBtn.rank {
        font-weight: 800;
      }
      .valPill {
        padding: 6px 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .notesField {
        width: 100%;
        min-height: 84px;
        padding: 10px 12px;
        font: inherit;
        color: var(--text);
        resize: vertical;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .formHint {
        margin-top: -4px;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .roundPick {
        position: relative;
        width: min(70cqw, 250px);
        aspect-ratio: 1;
        margin: 4px auto;
      }
      .roundPick .top {
        position: absolute;
        inset: 18%;
        display: grid;
        place-items: center;
        padding: 0 12%;
        font-size: 0.8rem;
        text-align: center;
        color: var(--muted);
        background: radial-gradient(circle at 40% 35%, #5a4636, #3a2d22);
        border: 3px solid #6b5240;
        border-radius: 50%;
      }
      .roundPick .rseat {
        position: absolute;
        display: grid;
        place-items: center;
        width: 21%;
        aspect-ratio: 1;
        font-weight: 800;
        color: #231d18;
        border: 3px solid var(--bg);
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .roundPick .rseat.win {
        box-shadow: 0 0 0 3px var(--accent-text), 0 0 16px var(--accent-text);
      }
      .roundPick .rseat .cr {
        position: absolute;
        top: -20px;
        color: var(--accent-text);
      }
      .toast {
        position: absolute;
        left: 50%;
        bottom: calc(var(--hand) + 16px);
        z-index: 25;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 16px;
        font-size: 0.9rem;
        white-space: nowrap;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 999px;
        box-shadow: 0 8px 24px var(--shadow);
        transform: translateX(-50%);
      }
      .toast .ok {
        color: #4ade80;
      }
      .timerBar {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 6px 6px 6px 14px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .clock {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        font-size: 1.1rem;
      }
      .clock.paused {
        color: var(--muted);
      }
      .cornerClock {
        position: absolute;
        top: 0;
        right: 8px;
        z-index: 2;
      }
      .cornerClock svg {
        width: 16px;
        height: 16px;
      }
      .clockRow {
        display: flex;
        justify-content: flex-end;
        margin: -8px 0 -8px;
      }
      .headClock {
        display: inline-flex;
        flex: none;
        gap: 6px;
        align-items: center;
        padding: 3px 3px 3px 12px;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .headClock button {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        color: var(--accent-text);
        background: var(--overlay);
        border-radius: 50%;
      }
      .celebrate {
        display: grid;
        gap: 10px;
        justify-items: center;
        padding: 28px 16px;
        text-align: center;
      }
      .celebrate .big {
        font-size: 1.5rem;
        font-weight: 800;
      }
      .celebrate .crownBtn {
        width: 72px;
        height: 72px;
      }
      .tableHero {
        display: grid;
        gap: 4px;
        justify-items: center;
      }
      .hlRow {
        box-shadow: inset 0 0 0 2px var(--accent-text);
      }
      .statBar {
        height: 8px;
        background: var(--accent-text);
        border-radius: 4px;
      }
      .chipRow {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .chipRow .pill {
        flex: none;
        color: var(--text);
      }
      .chipRow .pill[aria-pressed='true'] {
        color: var(--accent-text);
        border-color: var(--accent-text);
        background: var(--overlay);
        font-weight: 600;
      }
      .phBox {
        position: relative;
        outline: 1px dashed var(--accent-text);
        outline-offset: 3px;
        border-radius: 14px;
      }

      /* ---------- Q4: two playing cards over the dimmed screen (D-3, K2) ---------- */
      .r-dim {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        background: var(--backdrop);
      }
      .r-fanOut {
        display: flex;
        justify-content: center;
      }
      .pcard.r-playCard {
        width: 150px;
        gap: 14px;
        aspect-ratio: 5 / 7;
      }
      .r-playCard strong {
        font-size: 0.95rem;
        line-height: 1.25;
      }
      .r-playCard .corner {
        font-size: 1rem;
      }
      .r-left {
        z-index: 1;
        margin-right: -12px;
        transform: rotate(-8deg) translateY(6px);
      }
      .r-right {
        transform: rotate(8deg) translateY(6px);
      }
      .r-halfIcon {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        color: var(--on-accent);
        background: var(--accent);
        border-radius: 50%;
      }
      .pcard.r-filled {
        color: var(--on-accent);
        background: var(--accent);
        border-color: var(--accent);
      }
      .r-filled .corner {
        color: var(--on-accent);
      }
      .r-filled .r-halfIcon {
        color: var(--accent);
        background: var(--on-accent);
      }
      .r-fanOut.t4 .r-left {
        transform: rotate(-4deg) translateY(3px);
      }
      .r-fanOut.t4 .r-right {
        transform: rotate(4deg) translateY(3px);
      }
      .r-fanOut.t0 {
        gap: 12px;
      }
      /* stronger than the overlap of Q4 and Q5 */
      .r-fanOut.t0 > .r-left.r-left.r-left {
        margin-right: 0;
        transform: none;
      }
      .r-fanOut.t0 .r-right {
        transform: none;
      }
      .r-fanOut.q5 > * {
        width: min(44cqw, 175px);
      }
      .r-fanOut.q5 .askCard {
        padding: 14px 10px 14px 18px;
      }
      .r-fanOut.q5 .askCard > * {
        max-width: 100%;
      }
      .r-fanOut.q5 .r-left {
        margin-right: -6px;
      }
      .r-fanOut.q5 .dcRibbon {
        font-size: 1rem;
      }
      .seg.sortSeg button {
        white-space: nowrap;
        min-height: 34px;
        padding: 2px 12px;
        font-size: 0.8rem;
      }

      /* ---------- guided round ---------- */
      .guideTop {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        justify-content: space-between;
      }
      .guideDots {
        display: flex;
        gap: 6px;
      }
      .guideDots a {
        width: 22px;
        height: 6px;
        background: var(--border);
        border-radius: 3px;
      }
      .guideDots a.done {
        background: var(--muted);
      }
      .guideDots a.on {
        background: var(--accent-text);
      }
      .guideBox {
        display: grid;
        gap: 8px;
        max-width: 760px;
      }
      .guideBox h1 {
        font-size: 1.25rem;
      }
      .guideOpts {
        display: grid;
        gap: 6px;
        margin-top: 4px;
      }
      .guideOpt {
        display: grid;
        gap: 2px;
        padding: 10px 14px;
        text-align: left;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .guideOpt[aria-pressed='true'] {
        background: var(--overlay);
        border-color: var(--accent-text);
      }
      .guideOpt[aria-pressed='true'] .optHead {
        color: var(--accent-text);
      }
      .guideOpt .star {
        font-size: 0.8rem;
        color: var(--accent-text);
      }
      /* W5: persons as big buttons, points or ranking unfold below */
      .winnerChips {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .winnerChip {
        display: flex;
        gap: 10px;
        align-items: center;
        min-width: 0;
        min-height: 56px;
        padding: 6px 12px;
        text-align: left;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .winnerChip .nm {
        flex: 1;
        min-width: 0;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .winnerChip.on {
        background: var(--overlay);
        border-color: var(--accent-text);
        box-shadow: inset 0 0 0 1px var(--accent-text);
      }
      .winnerChip .wIcon {
        color: var(--accent-text);
      }
      .extraRow {
        display: flex;
        gap: 8px;
      }
      .pill.onPill {
        background: var(--overlay);
        border-color: var(--accent-text);
      }
      /* W6: the best row on top */
      .pRow.topRow {
        background: var(--overlay);
      }
      /* W7: persons as playing cards */
      .personCards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .pcard.personCard {
        gap: 6px;
        padding: 18px 6px 12px;
        cursor: pointer;
      }
      .pcard.personCard.win {
        border-color: var(--accent-text);
        box-shadow: 0 6px 18px var(--shadow), inset 0 0 0 1px var(--accent-text);
      }
      .personCard .pcCoin {
        width: 2.4em;
        height: 2.4em;
        font-size: 1rem;
      }
      .personCard .pcName {
        max-width: 100%;
        font-size: 0.9rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .personCard .pcWin {
        position: absolute;
        top: 7px;
        right: 8px;
        color: var(--accent-text);
      }
      .personCard .num {
        width: 100%;
        max-width: 84px;
        text-align: center;
      }
      /* ---------- result page concepts E1 to E4 ---------- */
      .podium {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        align-items: end;
        padding-top: 4px;
      }
      .podStep {
        display: grid;
        gap: 6px;
        align-content: end;
      }
      .podWho {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: center;
        min-height: 54px;
        align-items: end;
      }
      .podPerson {
        display: grid;
        gap: 2px;
        justify-items: center;
        max-width: 100%;
      }
      .podPerson small {
        max-width: 100%;
        font-size: 0.75rem;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .podPerson .coin {
        width: 2.2em;
        height: 2.2em;
      }
      .podEmpty {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: 50%;
      }
      .podBlock {
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 1.2rem;
        color: var(--muted);
        background: linear-gradient(180deg, #5a4636, #3a2d22);
        border: 1px solid #6b5240;
        border-radius: 10px 10px 4px 4px;
      }
      .podBlock.first {
        color: var(--accent-text);
        border-color: var(--accent-text);
      }
      .podOpen {
        display: grid;
        gap: 8px;
      }
      .pad {
        --pad-ink: #3a2a1a;
        --pad-line: #b9a98a;
        display: grid;
        padding: 14px 16px 12px;
        color: var(--pad-ink);
        font-family: Georgia, 'Times New Roman', serif;
        background: linear-gradient(170deg, #efe4c8, #e6d8b5);
        border-radius: 6px 6px 14px 14px;
        box-shadow: 0 6px 18px var(--shadow);
        transform: rotate(-0.6deg);
      }
      .padHead {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-bottom: 6px;
        border-bottom: 2px solid #b8262f88;
      }
      .padTitle {
        font-size: 1.3rem;
        font-style: italic;
        font-weight: 700;
      }
      .padRow {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 72px 56px;
        gap: 8px;
        align-items: center;
        min-height: 46px;
        border-bottom: 1px solid var(--pad-line);
      }
      .padCols {
        min-height: 30px;
        font-size: 0.78rem;
        font-style: italic;
        color: #6e5940;
      }
      .padName {
        justify-self: start;
        max-width: 100%;
        padding: 3px 10px;
        font: inherit;
        font-size: 1.05rem;
        color: var(--pad-ink);
        border: 2px solid transparent;
        border-radius: 50%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .padName.circled {
        border-color: #b8862a;
        box-shadow: 0 0 0 1px #b8862a55;
      }
      .padCell {
        width: 100%;
        min-height: 36px;
        padding: 0 4px;
        font: inherit;
        font-size: 1.1rem;
        text-align: right;
        color: #1f3f8a;
        background: transparent;
        border: 0;
        border-bottom: 1px dashed #8a6a44;
      }
      .padCell.computed {
        display: grid;
        align-items: center;
        color: #8a6a44;
        border-bottom-color: transparent;
      }
      .padFoot {
        display: flex;
        gap: 8px;
        align-items: center;
        padding-top: 8px;
        font-style: italic;
      }
      .padTrophy {
        color: #b8862a;
      }
      .askQ {
        display: grid;
        gap: 12px;
        border-color: var(--accent-text);
      }
      .card.askQ {
        flex: none;
        place-items: stretch;
        align-content: start;
        text-align: left;
      }

      .placeChip {

        outline: none;

      .placeChip.still {

        color: var(--accent-text);
      }
      .placeChip.win {
        color: #231d18;
        background: var(--accent-text);
        border-color: var(--accent-text);

      .eChooser {

      /* E6: places as numbers in the row, or tapped in order */

      .placeNums .pn {
        display: grid;

      .placeNums .pn.on {

        background: var(--accent-text);

      .pRow.tapRow {

      .tapSlot {

        flex: none;
        place-items: center;

        background: var(--accent-text);
      }

        border-color: var(--error);
      }
      /* E6, PO 17.11.: names flush left (same edge as "Datum"), the place in the round button on the
         right; otherwise the components of the app (options page, round icon buttons) */
      .tapLayer {

        z-index: 1;
        pointer-events: none;
      }
      .tapBtn {
        position: absolute;
        width: 44px;
        height: 44px;
        min-height: 0;
        padding: 0;
        background: none;
        border: 0;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }
      .tapBtn:focus-visible {
        outline: 2px solid var(--accent-text);
        outline-offset: -8px;

      /* Test aid: shows the tap areas and where the finger landed. */
      /* Hint H1 on the sea below the land, H2 as an own line. */
      .tapHint {

        flex: none;
        gap: 6px;
        align-items: center;
        justify-content: center;

      /* ---------- I3-B round 2: look page by page ---------- */
      .pickWrap {

        display: inline-grid;
        cursor: pointer;

      .pickWrap .valPill {

      .pickNative {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        opacity: 0;
        cursor: pointer;
      }
      .hiddenPick {

        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .dateRow {

      }
      .seg.inRow.dateSeg {

      }
      .dateSeg button {

        white-space: nowrap;
      }
      .devGrid .dcText strong {
        font-size: 0.84rem;
        white-space: nowrap;
      }
      .coinTap {

        padding: 0;
        border: 0;

      }
      .coinPen {
        position: absolute;
        right: -5px;
        bottom: -5px;
        display: grid;
        place-items: center;

        height: 17px;

        border: 1px solid var(--border);
        border-radius: 50%;
      }
      .dlgSwatches {
        display: flex;

        justify-content: center;
        padding: 8px 0 2px;
      }
      .coinsRow {
        display: flex;
        gap: 6px;
      }
      .optTag {
        margin-left: 6px;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .optTag.durWarn {
        font-weight: 600;

      .scoreSeg button {

      .newBlock {

      .fieldLabel {

      .newGameCard {

        align-content: center;
        aspect-ratio: 5 / 7.4;
        padding: 12px;
        color: var(--muted);
        text-align: center;
        border: 2px dashed var(--border);
        border-radius: 14px;
      }
      .newGameCard strong {

      }
      .builtIn {

      }
      .toast .gold {

      }
      .toastCard {

        padding: 10px 18px 10px 10px;

      }
      .toastCard .tcIcon {
        display: grid;
        flex: none;
        place-items: center;
        width: 40px;
        height: 40px;
        color: #231d18;
        background: var(--accent-text);
        border-radius: 50%;
      }
      .tcText {
        display: grid;
        line-height: 1.3;
      }
      .tcText small {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .dateCtl,
      .dayArrows,
      .timeCtl {
        display: flex;
        gap: 2px;
        align-items: center;
      }
      .dateCtl {
        gap: 6px;
      }
      .datePill {

        min-width: 8.4rem;
        text-align: center;
      }
      .dayArrow,
      .clearTime {
        display: grid;
        flex: none;
        place-items: center;
        width: 32px;
        height: 36px;
        color: var(--accent-text);
        border-radius: 8px;
      }
      .dayArrow:disabled {
        color: var(--muted);

        opacity: 0.35;

      .clearTime {

        color: var(--muted);
      }
      .clearTime[hidden] {
        display: grid;
        visibility: hidden;
      }
      .timeCtl .valPill {
        display: block;
        min-width: 4.4rem;
        text-align: center;
      }
      .gameRoom {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .gameCard {
        display: grid;
        gap: 6px;
        place-items: center;
        align-content: center;
        min-height: 190px;
        padding: 16px 10px;
        text-align: center;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .gameCard strong {
        font-size: 1.05rem;
      }
      .gameCard small {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .gameCard.newGame {
        color: var(--accent-text);

      }
      .newRing {

        place-items: center;
        width: 96px;
        height: 96px;
        border: 2px dashed var(--accent-text);
        border-radius: 50%;
      }
      .gcArt {
        display: grid;
        place-items: center;
        width: 96px;
        height: 96px;
        overflow: hidden;
        border: 2px solid var(--border);
        border-radius: 50%;
      }
      .gcArt svg {
        width: 100%;
        height: 100%;
      }
      .gcArt .ownArt.small {
        font-size: 2.4rem;
      }
      .newRow {
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 52px;
        padding: 8px 14px;
        font-weight: 600;
        color: var(--accent-text);
        border: 1.5px dashed var(--accent-text);
        border-radius: 12px;
      }
      .gameHead {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .gameCard.mini {
        flex: none;
        width: 120px;
        min-height: 150px;
        padding: 12px 6px;
      }
      .gameCard.mini .gcArt {
        width: 64px;
        height: 64px;
      }
      .gameCard.mini .ownArt.small {
        font-size: 1.7rem;
      }
      .gameFacts {
        display: grid;
        gap: 6px;
        justify-items: start;
        min-width: 0;
      }
      .gameFacts > strong {
        font-size: 1.25rem;
      }
      .factPill {
        padding: 4px 12px;
        font-size: 0.85rem;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .factPill b {
        color: var(--accent-text);
      }
      .iconBtn.square {
        border-radius: 10px;
      }
      .field.bad {
        border-color: var(--error);
      }
      .fieldError {
        color: var(--error);
      }
      .fieldError[hidden] {

      }
      .editorPage .section .field {
        width: 100%;
      }
      /* PO 17.11.: three cards side by side */
      .devGrid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .devGrid.three .devCard {
        padding: 7px 7px 6px;
        border-radius: 11px;
      }
      .devGrid.three .dcHead {
        height: 24px;
      }
      .devGrid.three .devCard .dcRibbon {
        font-size: 0.74rem;
        letter-spacing: 0.02em;
      }
      .devGrid.three .dcRibbon strong {
        overflow: hidden;
        max-width: 86%;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .devGrid.three .ownArt {
        font-size: 2.2rem;
      }
      .devGrid.three .dcText {
        margin-top: -9px;
        padding: 9px 3px 3px;
        font-size: 0.66rem;
        border-radius: 50% 50% 5px 5px / 12px 12px 5px 5px;
      }
      .devGrid.three .dcText strong {
        font-size: 0.72rem;
        white-space: normal;
      }
      .devGrid.three .newGameCard {
        gap: 4px;
        padding: 8px;
        font-size: 0.85rem;
        border-radius: 11px;
      }
      .devMini {
        flex: none;
        width: 120px;
      }
      .devMini .devCard {
        width: 100%;
      }
      .devMini .dcRibbon {
        font-size: 0.85rem;
      }
      .devMini .dcText {
        font-size: 0.68rem;
      }
      .devMini .dcText strong {
        font-size: 0.74rem;
      }
      /* GL4: picture and name only */
      .devGrid.bare .devCard {
        aspect-ratio: 5 / 6.2;
        padding-bottom: 10px;
      }
      .devGrid.bare .dcArt {
        border-bottom: 3px double var(--dc-frame);
        border-radius: 0 0 6px 6px;
      }
      .dcBadge {
        position: absolute;
        right: 10px;
        bottom: 16px;
        left: 10px;
        padding: 2px 6px;
        font: 600 0.7rem system-ui, sans-serif;
        text-align: center;
        color: var(--text);
        background: #000a;
        border-radius: 999px;
      }
      .devGrid.three .dcBadge {
        right: 6px;
        bottom: 10px;
        left: 6px;
        font-size: 0.6rem;
      }
      .devCard {
        position: relative;
      }
      /* GL5: playing cards with the number of matches in the corners */
      .playGrid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .gl5 .pcard {
        min-height: 150px;
      }
      .gl5 .gcArt.small {
        width: 54px;
        height: 54px;
      }
      .gl5 .gcArt .ownArt.small {
        font-size: 1.6rem;
      }
      .gl5 .gname {
        font-size: 0.95rem;
      }
      .gl5 .note {
        font-size: 0.75rem;
        color: var(--muted);
      }
      .newPcard {
        color: var(--accent-text);
        border: 1.5px dashed var(--accent-text);
      }
      .newPcard strong {
        color: var(--accent-text);
      }
      .gl5 .pcard {
        padding-bottom: 24px;
      }
      /* GL5 in the grid of "Partie": playing cards as tall as the development cards */
      .gl5 .pcard {
        width: 100%;
        aspect-ratio: 5 / 7.4;
        padding: 16px 6px 22px;
      }
      .gl5.three .pcard {
        padding: 12px 4px 18px;
        border-radius: 11px;
      }
      .gl5.three .pcard .gname {
        font-size: 0.85rem;
      }
      .gl5.three .gcArt.small {
        width: 44px;
        height: 44px;
      }
      .gl5.three .pcard {
        gap: 4px;
        min-height: 0;
        overflow: hidden;
      }
      .gl5.three .pcard .note {
        overflow: hidden;
        max-width: 100%;
        font-size: 0.64rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .gl5.three .gcArt.small {
        width: 38px;
        height: 38px;
      }
      .gl5.three .gcArt .ownArt.small {
        font-size: 1.3rem;
      }
      .gl5.three .newPcard {
        font-size: 0.85rem;
      }
      /* F2: every measure relative to the card's own width (design size 240 px, as in "Neue Partie"), so a
         small card looks like the big one. The card has no padding (a % padding would refer to the parent,
         e.g. the wider fan of the Catan question); its parts keep their distance with margins in cqi of the
         card. The text never gets smaller than readable. */
      .propCards .devCard {
        container-type: inline-size;
      }
      .propCards .devCard,
      .propCards .devGrid.three .devCard {
        position: relative;
        padding: 0;
        border-radius: 5.83% / 3.94%;
        box-shadow: 0 6px 18px var(--shadow);
      }
      .propCards .devCard::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: '';
        border-radius: inherit;
        box-shadow: inset 0 0 0 max(1px, 1.67cqi) #ffffff22;
      }
      .propCards .devCard .dcHead,
      .propCards .devGrid.three .dcHead {
        height: 13.33cqi;
        margin: 4.17cqi 4.17cqi 0;
      }
      .propCards .devCard .dcRibbon,
      .propCards .devGrid .devCard .dcRibbon,
      .propCards .devGrid.three .devCard .dcRibbon {
        font-size: 7.67cqi;
        letter-spacing: 0.05em;
      }
      .propCards .devCard .dcArt {
        margin: 0 5.84cqi;
        border-width: 0 max(2px, 1.25cqi) max(2px, 1.25cqi);
      }
      .propCards .devCard .dcText,
      .propCards .devGrid.three .dcText {
        margin: -5cqi 4.17cqi 3.75cqi;
        padding: 5cqi 2.5cqi 1.67cqi;
        font-size: max(0.62rem, 5.33cqi);
        border-top-width: max(1px, 0.83cqi);
        border-radius: 50% 50% 2.5cqi 2.5cqi / 6.67cqi 6.67cqi 2.5cqi 2.5cqi;
      }
      .propCards .devCard .dcText strong,
      .propCards .devGrid .dcText strong,
      .propCards .devGrid.three .dcText strong {
        font-size: max(0.7rem, 6.13cqi);
        white-space: nowrap;
      }
      /* Three side by side: one line each, cut with "…" rather than spilling out */
      .propCards .devGrid.three .dcText strong,
      .propCards .devGrid.three .dcText > span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .propCards .devGrid.three .dcText strong {
        font-size: max(0.6rem, 6.69cqi);
      }
      .propCards .devGrid.three .dcText {
        font-size: max(0.55rem, 5.82cqi);
      }
      /* PO 17.11.: two cards side by side on phones; from 600 px (tablet portrait) three or four */
      @container (min-width: 600px) {
        .devGrid,
        .devGrid.three {
          grid-template-columns: repeat(var(--tabCols, 4), minmax(0, 1fr));
        }
      }
      .propCards .devCard .ownArt {
        font-size: 21.3cqi;
      }
      /* R3 with long names: wraps inside the screen, winner at most two lines, the rest cut with "…" */
      .toast.toastCard {
        width: max-content;
        max-width: calc(100% - 32px);
        white-space: normal;
      }
      .tcText {
        min-width: 0;
      }
      .tcText strong {
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .tcText small {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tcText strong {
        -webkit-line-clamp: 3;
      }
      /* Top: in the empty space below the logo, so the cards of the start stay free */
      /* Floats over the page (own layer, nothing moves): starts where the banner of a running match
         starts, so it covers the banner completely while it is shown. */
      .toast.toastCard.atTop {
        top: 72px;
        bottom: auto;
        z-index: 30;
        width: calc(100% - 32px);
        max-width: 38rem;
        border-radius: 12px;
      }
      /* PO 17.11.: "Neues Spiel" like "Neue Person" (PersonsView.module.css .newCard): transparent, thin dashed gold rim */
      .pcard.newPcard,
      .gl5 .pcard.newPcard {
        gap: 3px;
        color: var(--accent-text);
        background: transparent;
        border: 1px dashed var(--accent-text);
        box-shadow: none;
      }
      .pcard.newPcard strong {
        font-size: 0.85rem;
        font-weight: 700;
        line-height: 1.2;
        color: var(--accent-text);
      }
      .pcard.newPcard .ngPlus {
        display: grid;
      }
      /* A person in the group colour, as on the table page (GroupView.module.css .seat) */
      .seatDot {
        display: grid;
        flex: none;
        place-items: center;
        width: 36px;
        height: 36px;
        font-size: 15px;
        font-weight: 800;
        color: var(--bg);

      }
      .stepBtn {

        min-height: 38px;

        font-weight: 700;

        border: 1px solid var(--border);

      }

      .stepVal {

      }

      }

        padding: 8px 14px;
      }
      .e6 .num {
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .e6 .num.optPh::placeholder {
        font-size: 0.75rem;
        font-weight: 400;
      }
      .e6 .colHead {
        display: flex;
        gap: 12px;
        align-items: end;
        margin-bottom: -6px;
        padding: 0 15px;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .e6 .colHead .grow {
        flex: 1;
      }
      .e6 .colHead .cPts {
        width: 74px;
        text-align: center;
      }
      .e6 .colHead .cOr {
        display: flex;
        justify-content: center;
        width: 0;
        margin: 0 -2px 0 -10px;
        white-space: nowrap;
        font-size: 0.7rem;
        font-style: italic;
      }
      .e6 .colHead.a2Head {
        gap: 0;
      }
      .e6 .colHead .cFirst {
        width: 38px;
        text-align: center;
      }
      .e6 .colHead .cRest {
        box-sizing: border-box;
        padding-left: 10px;
        text-align: center;
      }
      .slotEmpty {
        display: grid;
        flex: none;
        place-items: center;
        width: 44px;
        height: 44px;
        font-weight: 700;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: 50%;
      }

        visibility: hidden;
      }
      .headNoteRow {
        display: flex;
        gap: 10px;
        align-items: baseline;
        justify-content: space-between;
      }
      .headNote {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .placeNums.optDash .pn:not(.first):not(.on):not(:disabled) {
        border-style: dashed;
      }
