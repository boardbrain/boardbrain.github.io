        margin-right: 6px;
      }
      .e6 .colHead .cWin {
        width: 44px;
        text-align: center;
      }
      .e6 .num.missing {
        border-color: var(--error);
        box-shadow: inset 0 0 0 1px var(--error);
      }
      .e6 .crownBtn {
        color: var(--muted);
        background: var(--raised);
        border: 1px solid var(--border);
      }
      .e6 .crownBtn.on {
        color: #231d18;
        background: var(--accent-text);
        border-color: var(--accent-text);
      }
      .e6 .crownBtn.placeNo {
        font-weight: 800;
        font-size: 1rem;
        color: var(--text);
      }
      .headToggle {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }
      .miniSwitch {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        min-height: 44px;
        color: var(--muted);
      }
      .miniSwitch[aria-checked='true'] {
        color: var(--text);
      }
      .dualToggle {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 6px 14px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .dualToggle > span:not(.switch) {
        flex: 1;
        color: var(--muted);
      }
      .dualToggle > span:first-child {
        text-align: right;
      }
      .dualToggle > span:last-child {
        text-align: left;
      }
      .dualToggle .act {
        font-weight: 700;
        color: var(--accent-text);
      }
      .radioRow {
        gap: 12px;
      }
      .radio {
        flex: none;
        width: 22px;
        height: 22px;
        border: 2px solid var(--muted);
        border-radius: 50%;
      }
      .radioRow[aria-checked='true'] .radio {
        border-color: var(--accent-text);
        box-shadow: inset 0 0 0 4px var(--raised), inset 0 0 0 11px var(--accent-text);
      }
      .orRow {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .orBtn {
        flex: 1;
        min-height: 44px;
        padding: 6px 10px;
        font-weight: 600;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .orBtn[aria-pressed='true'] {
        color: var(--accent-text);
        border-color: var(--accent-text);
        box-shadow: inset 0 0 0 1px var(--accent-text);
      }
      .orWord {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .wayLink {
        justify-self: start;
        padding: 0 2px;
      }
      .primary.looksOff {
        opacity: 0.45;
      }
      .e6 .crownBtn:disabled {
        cursor: default;
        opacity: 1;
      }
      .e6 .crownBtn.locked:not(.on):not(.placeNo) {
        opacity: 0.55;
      }
      .e6 .placeNums .pn:disabled {
        opacity: 1;
        color: var(--muted);
        background: transparent;
        border-color: transparent;
      }
      .guideSub {
        display: grid;
        gap: 8px;
      }
      .guideNav {
        display: flex;
        gap: 10px;
        justify-content: space-between;
        max-width: 390px;
        margin: 16px auto 0;
      }
      .guideNav a {
        text-decoration: none;
      }
      .guideNav a.secondary {
        color: var(--text);
      }
      .guideSummary {
        display: grid;
        gap: 12px;
        max-width: 560px;
        margin: 0 auto;
      }
      .guideSummary .line {
        color: inherit;
        text-decoration: none;
      }
      .guideCopy {
        margin: 0;
        padding: 12px 14px;
        white-space: pre-wrap;
        font-family: ui-monospace, 'Cascadia Mono', consolas, monospace;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      /* ---------- I3-C round 1 ---------- */
      /* Table page as built (GroupView, GroupTable size "detail", Overview.module.css). */
      .i3Main {
        gap: 20px;
      }
      .i3Hero {
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      .i3Big {
        position: relative;
        flex: none;
        max-width: 100%;
      }
      .i3BigTop {
        position: absolute;
        inset: 17%;
        display: grid;
        gap: 2px;
        align-content: center;
        justify-items: center;
        padding: 8px;
        text-align: center;
        background: radial-gradient(circle at 50% 35%, var(--overlay), var(--raised) 70%);
        border: 6px solid var(--border);
        border-radius: 50%;
        box-shadow: 0 10px 30px var(--shadow);
      }
      .i3BigTop strong {
        font-size: 0.95rem;
      }
      .i3BigTop span {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .i3BigSeat {
        position: absolute;
        display: grid;
        place-items: center;
        width: 17%;
        aspect-ratio: 1;
        min-width: 40px;
        font-size: 1.25rem;
        font-weight: 800;
        color: var(--bg);
        border: 4px solid var(--bg);
        border-radius: 50%;
        box-shadow: 0 4px 10px var(--shadow);
        transform: translate(-50%, -50%);
      }
      .i3Big.small .i3BigTop {
        border-width: 4px;
      }
      .i3Big.small .i3BigSeat {
        width: 24%;
        min-width: 0;
        font-size: 0.8rem;
        border-width: 2px;
      }
      .i3Facts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
      }
      .i3Fact {
        display: inline-flex;
        gap: 6px;
        align-items: baseline;
        padding: 4px 10px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .i3Fact b {
        color: var(--accent-text);
      }
      .i3Fact .lbl {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .i3Fact .txt {
        font-size: 0.85rem;
      }
      .pill.i3Pill {
        min-height: 34px;
        padding: 4px 14px;
        font-size: 0.92rem;
      }
      .i3Compact {
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .i3CompactText {
        display: grid;
        gap: 8px;
        justify-items: start;
      }
      .i3CompactText .i3Facts {
        justify-content: flex-start;
      }
      .i3WideGrid {
        display: grid;
        grid-template-columns: 380px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }
      .i3Right {
        display: grid;
        gap: 16px;
      }
      .i3Panel {
        display: grid;
        gap: 16px;
      }
      .rt2 .i3Panel {
        gap: 20px;
      }
      .tabs.i3Tabs {
        flex: none;
      }
      /* Rows as Overview.module.css .row: 56 px, seat 36 px, name and note, chevron. */
      .i3Rows .i3Row {
        min-height: 56px;
        color: var(--text);
      }
      .i3Rows .i3Row strong,
      .i3Rows .i3Row small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .i3Rows .i3Row small {
        font-size: 0.85rem;
      }
      /* Ties of long names: up to two lines instead of cutting off a winner */
      .i3Rows .i3Res small {
        display: -webkit-box;
        white-space: normal;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .i3Seat {
        display: grid;
        flex: none;
        place-items: center;
        width: 36px;
        height: 36px;
        font-size: 15px;
        font-weight: 800;
        color: var(--bg);
        border-radius: 50%;
      }
      .i3Soon {
        justify-items: center;
      }
      .i3SoonIcon {
        color: var(--muted);
      }
      /* Result list */
      .i3List {
        display: grid;
        gap: 16px;
      }
      .newRow.i3NewRow {
        justify-content: flex-start;
        width: 100%;
        min-height: 56px;
        background: transparent;
        border-width: 1px;
      }
      .i3Day {
        display: grid;
        gap: 8px;
      }
      .i3DayHead {
        margin: 0;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--muted);
      }
      .i3Art {
        display: grid;
        flex: none;
        place-items: center;
      }
      .i3Art .gcArt {
        width: 100%;
        height: 100%;

      }
      .i3Art .gcArt .ownArt.small {
        font-size: 1.1rem;
      }
      .i3Row .i3Win {
        display: flex !important;
        gap: 4px;
        align-items: center;
      }
      .i3Win svg {
        flex: none;
        color: var(--accent-text);
      }
      .i3Time {
        flex: none;
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .i3Date {
        display: grid;
        flex: none;
        width: 4.6rem;
        font-size: 0.85rem;
        line-height: 1.25;
      }
      .i3Coins {
        display: flex;
        flex: none;
        align-items: center;
      }
      .i3Coins .i3Seat {
        font-size: 12px;
        border: 2px solid var(--raised);
      }
      .i3Coins .i3Seat + .i3Seat {
        margin-left: -8px;
      }
      .i3Trophy {
        display: grid;
        margin-right: 4px;
        color: var(--accent-text);
      }
      .i3Rows .i3Res.hlRow,
      .i3Expand.hlRow {
        background: var(--overlay);
      }
      .i3Expand {
        display: grid;
      }
      .i3ExpandBody {
        display: grid;
        gap: 16px;
        padding: 4px 14px 16px;
      }
      .again.turned {
        transform: rotate(180deg);
      }
      /* Detail */
      .i3Places .i3Row {
        cursor: default;
      }
      .i3Slot {
        display: grid;
        flex: none;
        place-items: center;
        width: 30px;
        height: 30px;
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 50%;
      }
      .i3Slot.win {
        color: var(--accent-text);
        border-color: var(--accent-text);
      }
      .i3Slot.none {
        border-color: transparent;
      }
      .i3Places .coin {
        font-size: 15px;
      }
      .i3Other strong {
        font-weight: 600;
        color: var(--muted);
      }
      .i3Pts {
        flex: none;
        min-width: 3ch;
        font-size: 1.05rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .i3Val {
        font-weight: 600;
      }
      .i3Notes {
        margin: 0;
        padding: 12px 14px;
        line-height: 1.45;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .i3Meta {
        margin: 0;
        text-align: center;
      }
      .i3Acts {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .i3Acts.bl1 {
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .linkBtn.i3Delete {
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--error);
        text-decoration: none;
      }
      .pill.i3Danger,
      .iconBtn.i3Danger {
        color: var(--error);
      }
      .i3HeadActs,
      .i3IconActs {
        display: flex;
        gap: 8px;
      }
      .i3IconActs {
        justify-content: center;
      }
      /* Sheet from below, like the clock sheet (ClockSheet.module.css) */
      .backdrop.i3SheetBack {
        place-items: end stretch;
        padding: 0;
      }
      .i3Sheet {
        display: grid;
        gap: 12px;
        max-height: 88%;
        padding: 4px 16px calc(20px + var(--hand));
        overflow: auto;
        background: var(--bg);
        border-top: 1px solid var(--border);
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -10px 30px var(--shadow);
      }
      .i3Grip {
        display: grid;
        place-items: center;
        height: 28px;
      }
      .i3Grip span {
        width: 44px;
        height: 5px;
        background: var(--border);
        border-radius: 3px;
      }
      .i3SheetHead {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .i3SheetHead .titles {
        flex: 1;
        min-width: 0;
      }
      .i3SheetHead h2 {
        margin: 0;
      }
      .i3SheetBody {
        display: grid;
        gap: 20px;
      }
      .num.i3Hm {
        width: 56px;
      }
      /* ---------- I3-C round 2 ---------- */
      .ownArt.sym svg {
        width: 55%;
        height: 55%;
      }
      /* RA1: text on a thin line, the chosen tab golden with a bar below */
      .tabs.i3Tabs.ra1 {
        padding: 0;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
      }
      .tabs.i3Tabs.ra1 button {
        min-height: 44px;
        color: var(--muted);
        border-radius: 0;
      }
      .tabs.i3Tabs.ra1 button[aria-selected='true'] {
        color: var(--accent-text);
        background: transparent;
        box-shadow: inset 0 -3px 0 var(--accent-text);
      }
      /* RA2: symbol above the label */
      .tabs.i3Tabs.ra2 button {
        display: grid;
        gap: 2px;
        place-items: center;
        min-height: 58px;
        font-size: 0.82rem;
      }

      .tabs.i3Tabs.ra3 {
        gap: 8px;
        padding: 0;
        background: transparent;
        border: 0;
      }
      .tabs.i3Tabs.ra3 button {
        flex: none;
        min-height: 38px;
        padding: 0 16px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .tabs.i3Tabs.ra3 button[aria-selected='true'] {
        border-color: var(--accent-text);
        box-shadow: none;
      }
      .i3TabRow {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .i3TabRow .tabs {
        flex: 1;
        min-width: 0;
      }
      .iconBtn.i3PlusBtn {
        color: var(--accent-text);
      }
      /* EM2: small coins with the names */
      .i3Rows .i3Res small.i3WinCoins {
        display: flex;
        gap: 6px;
        align-items: center;
        -webkit-line-clamp: unset;
      }
      .i3Mini {
        display: flex;
        flex: none;
      }
      .i3Mini .i3Seat {
        font-size: 10px;
        border: 1.5px solid var(--raised);
      }
      .i3Mini .i3Seat + .i3Seat {
        margin-left: -6px;
      }
      /* A tie wraps to a second line instead of cutting off a winner */
      .i3WinText {
        display: -webkit-box;
        min-width: 0;
        overflow: hidden;
        white-space: normal;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .i3Rows .i3Res small.i3WinCoins:has(.i3Seat + .i3Seat) {
        align-items: flex-start;
      }
      .i3Rows .i3Res small.i3WinCoins:has(.i3Seat + .i3Seat) .i3Mini {
        margin-top: 1px;
      }
      /* EM3: coins with a small trophy at the edge */

        position: relative;
        display: flex;
        flex: none;
        padding-right: 4px;
      }
      .i3Badged .i3Seat {
        font-size: 13px;
        border: 2px solid var(--raised);
      }
      .i3Badged .i3Seat + .i3Seat {
        margin-left: -10px;
      }
      .i3Badge {
        position: absolute;
        right: -4px;
        bottom: -4px;
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        color: var(--bg);
        background: var(--accent-text);
        border: 2px solid var(--raised);
        border-radius: 50%;

      /* NB: the message card is a button */

        font: inherit;
        color: var(--text);
        text-align: left;
        cursor: pointer;
      }
      .toast.i3TapToast .tcText {
        flex: 1;
      }
      .i3TcChev {
        display: grid;
        flex: none;
        color: var(--muted);
      }
      .pill.i3See {
        flex: none;
      }

      .i3SymHero {
        display: grid;
        justify-items: center;
        margin: -4px 0 -6px;
      }
      .i3SymHero .i3Art .gcArt .ownArt.small {
        font-size: 2.6rem;
      }
      /* SW5: floating button above the hand */
      .i3Fab {
        position: absolute;
        right: 16px;
        bottom: calc(var(--hand) + 16px);
        z-index: 15;
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        color: var(--on-accent);
        background: var(--accent);
        border-radius: 50%;
        box-shadow: 0 8px 20px var(--shadow);
      }
      /* SW6: a card above the list in the style of the message card */
      .i3AddCard {
        display: flex;
        gap: 12px;
        align-items: center;
        width: 100%;
        min-height: 60px;

            'Kopf wie bisher (Zurück 44 px, Name). Rechts im Kopf ein runder Plus-Knopf 44 px (Symbol 22 px, Akzentfarbe) „Ergebnis eintragen“, in allen Reitern an derselben Stelle (SW4).',
            'Reiter direkt unter dem Kopf: „Am Tisch | Ergebnisse | Statistik“, Abstand wie zwischen den Abschnitten (20 px). Nur der große Tisch mit Angaben und „Bearbeiten“ gehört zu „Am Tisch“, darunter die Mitglieder wie bisher (RT2).',
            'Reiter RA1: Text auf einer Linie 1 px in Randfarbe, jeder Reiter gleich breit, 44 px hoch, 0,92rem; gewählt in Akzentfarbe, halbfett, mit 3 px Strich unten (box-shadow inset), sonst gedämpft. Gemeinsame Komponente mit role tablist/tab/tabpanel, aria-selected, aria-controls, Pfeiltasten links/rechts, Pos1/Ende (C-G-10).',
            'Ab 1000 px wie bisher zwei Spalten: links Tisch 380 px mit Angaben und „Bearbeiten“, rechts Reiter und Inhalt; „Am Tisch“ zeigt dort nur die Mitglieder. Tisch 300 px, ab 600 px 360 px.',
            '„Statistik“: Platzhalter, gestrichelte Box mit Diagramm-Symbol 30 px, „Statistik“, „Kommt mit dem nächsten Update“; der Inhalt kommt mit I3-D.',
            'Der zuletzt gewählte Reiter steht in der Adresse (`?reiter=ergebnisse`), damit Zurück aus einem Detail im selben Reiter landet.',
          ]),
          spec('Ergebnisliste (US-ER-04 AK-1, Spezifikation 3.7, EM3)', [
            'Neueste zuerst nach 3.7: Datum, im Tag Uhrzeit absteigend; Partien ohne Uhrzeit stehen im Tag oben (chronologisch nach denen mit Uhrzeit).',
            'Je Tag eine Überschrift 0,85rem, fett, gedämpft: „Heute, 17.11.“, „Gestern, 16.11.“, „Sa, 14.11.“, anderes Jahr „Mi, 31.12.2025“ (Format des Ergebnisformulars, groß beginnend). Darunter die Partien des Tages als Karte mit Zeilen; 16 px zwischen den Tagen, 8 px unter der Überschrift.',
            'Zeile 56 px hoch, Innenabstand 8/14 px: Spielsymbol 40 px rund (Catan Landschaft, eigene Spiele Anfangsbuchstabe), Spielname fett, darunter Uhrzeit 0,85rem gedämpft (ohne Uhrzeit nur der Name), rechts die Münzen der Sieger 32 px in Tischfarbe, überlappend −10 px, höchstens drei, mit Pokal 18 px in Akzentfarbe unten rechts an der letzten Münze; dann Pfeil.',
            'Die Zeile ist ein Link mit Namen, z. B. „Skyjo, 21:40, Clara gewinnt“ bzw. „Unentschieden: Ben und David“ (Namen für Screenreader).',
            'Leer: gestrichelte Box „Noch keine Ergebnisse“; eintragen über das Plus im Kopf.',
          ]),
          spec('Detail (US-ER-04 AK-2, US-ER-02 AK-5, US-ER-06 AK-5, US-ER-03 AK-2, DA1, SY1)', [
            'Eigene Seite `#/verwaltung/gruppen/‹tisch›/ergebnisse/‹ergebnis›`. Kopf: Zurück, Spielsymbol 44 px, Spielname, darunter Datum und Uhrzeit wie in der Liste („heute, 17.11. · 21:40“).',
            '„Ergebnis“ mit Hinweis rechts („Siegpunkte“, „Punkte“, „Punkte · wenigste gewinnen“, „Rangfolge“, ohne beides nichts). Zeilen nach Platz: Kreis 30 px mit Pokal (Sieger, Akzentrand) oder Platzzahl, dann Münze (eigene Spiele Sitz-Münze 36 px in Tischfarbe, Catan Catan-Münze mit Farbname darunter), Name, rechts Punkte 1,05rem fett. Nur Sieger ohne Rangfolge: Sieger mit Pokal, die übrigen gedämpft ohne Kreis.',
            'Catan: Abschnitt „Partie“ mit Spielversion, Modus, Spieldauer („1 h 23 min“, sonst –). Notizen als Karte, wenn vorhanden.',
            'Darunter klein und mittig „eingetragen 17.11.2026, 21:58“, nach einer Änderung zweite Zeile „geändert …“.',
            'BL1: Pille „Bearbeiten“ (Stift 16 px) mittig, 18 px darunter „Ergebnis löschen“ als Text in Fehlerfarbe, halbfett.',
          ]),
          spec('Silber und Bronze (MP2)', [
            'Überall, wo ein Platz im Kreis steht – Formular (fester Platz nach vollständigen Punkten und vorläufiger, gestrichelter Platz), Detail, später Personenseite –, haben Platz 2 und 3 Rand und Zahl in gedämpftem Silber bzw. Bronze, ohne Füllung; der Rand mit 75 % Deckkraft. Neue Tokens `--color-place-silver` (#c4cad3) und `--color-place-bronze` (#cf9468).',
            'Gleicher Platz, gleiche Farbe: 1, 2, 2, 4 ergibt zweimal Silber und kein Bronze. Die Zahl bleibt immer stehen (nicht nur Farbe). Platz 1 bleibt der Pokal, ab Platz 4 grau.',
            'Die Kästchen der Rangfolge im Formular („Sieger oder Rangfolge“) bleiben unverändert: Gold heißt dort „ausgewählt“.',
          ]),
          spec('Bearbeiten und Löschen (US-ER-05)', [
            'Bearbeiten öffnet das Ergebnisformular aus I3-B als „Ergebnis bearbeiten“ mit allen Werten; Spiel und Tisch stehen fest im Untertitel (AK-4). Knopf „Änderungen speichern“.',
            'Ohne Änderung führt Speichern ohne Frage zurück. Mit Änderung fragt die App: „Ergebnis ändern?“ / „Die Statistik ändert sich mit“ / „Zurück“ / „Speichern“ (AK-1). Danach Detail mit „geändert …“.',
            'Löschen fragt immer: „Ergebnis löschen?“ / „Skyjo · heute, 17.11.“ / „Lässt sich nicht rückgängig machen“ / „Abbrechen“ / „Löschen“ (Fehlerfarbe). Danach Tischseite im Reiter „Ergebnisse“. Sicherungspunkt folgt mit I4 (Variante A).',
          ]),
          spec('Ergebnis vom Tisch und nach dem Speichern (US-ER-01 AK-1, NM3, NB1)', [
            'Plus im Kopf: Spielwahl „Ergebnis eintragen“ / „‹Tisch› · zuletzt gespielt“ (bzw. „A–Z“) mit den Spielkarten der Spielliste, nur Spiele dieses Tischs, Sortierknopf wie dort, ohne Suche (sonst bricht der Titel um); Catan ohne Catan-Frage. Spielt der Tisch nur ein Spiel, gleich das Formular.',
            'Vom Tisch aus gespeichert: zurück zur Tischseite im Reiter „Ergebnisse“. Der neue Eintrag hellt einmal golden auf (Hintergrund Akzentfarbe 20 %, nach 0,44 s am hellsten) und verblasst in 2,2 s; danach sieht er aus wie alle anderen (HL1). Liegt er außer Sicht, wird er vorher ins Bild gescrollt (ein Drittel von oben).',
            'Aus der Spielliste oder der laufenden Partie gespeichert: Start mit der Meldungskarte aus I3-B oben (R3), jetzt ein Knopf mit Pfeil rechts; antippen öffnet die Tischseite im Reiter „Ergebnisse“, der Eintrag hellt auf wie oben. Sie verschwindet wie bisher von selbst, sobald sie lesbar war: mindestens 5 Sekunden, bei langen Namen länger.',
          ]),
          spec('Laufende Partie (UE1, C-G-9)', [
            'Reiter „Brett | Ergebnisse“ mit derselben Komponente und demselben Aussehen RA1. Alles andere wie gebaut: „Partie beenden ohne Ergebnis“ und Uhr in einer Zeile, darunter „Ergebnis eintragen“ (#58).',
            'Der Modus im Untertitel kommt aus der Partie (heute fest „Standard“, C-G-9).',
          ]),
          spec('Mit späteren Funktionen (nur Ausblick, nicht in I3-C)', [
            'Personenseite mit Reitern „Tische | Ergebnisse | Statistik“ (PS1): Ergebnisse der Person an allen Tischen, rechts ihr Platz. Neue Anforderung, in der Planung von I3-D besprechen.',
            'Spielsymbole statt Anfangsbuchstaben (später wählbar); alle Plätze funktionieren mit Symbol.',
          ]));
      }
      // MP2: place circles carry their place, so places 2 and 3 get silver and bronze (CSS).
      function i3cMarkPlaces(frame) {
        frame.querySelectorAll('.crownBtn.placeNo, .slotEmpty.prov, .i3Slot').forEach((el) => {
          const n = el.textContent.trim();
          if (n === '2' || n === '3') el.dataset.place = n;
        });
      }
      // HL1: the new entry is scrolled into view if needed and lights up golden, fading in 2.2 s.
      function i3cLightUp(frame) {
        if (!i3c.pulse) return;
        i3c.pulse = false;
        const el = frame.querySelector('.hlRow');
        const sc = frame.querySelector('.scroll');
        if (!el || !sc) return;
        const er = el.getBoundingClientRect(), sr = sc.getBoundingClientRect();
        if (er.top < sr.top + 60 || er.bottom > sr.bottom - 120) sc.scrollTop += er.top - sr.top - sr.height / 3;
        el.animate([{ backgroundColor: '#f5be5b00' }, { backgroundColor: '#f5be5b33', offset: 0.2 }, { backgroundColor: '#f5be5b00' }], { duration: 2200, easing: 'ease-out' });
      }
      function render() {
        const extra = i3cPage === 'detail'
          ? [chips('Beispiel', [['r3', 'Catan'], ['r1', 'Skyjo'], ['r2', 'Uno'], ['r4', 'Wizard'], ['r5', 'Catan nur Sieger'], ['r10', 'Uno ohne Uhrzeit']], i3c.example || 'r3', (k) => { i3c.example = k; showI3c('detail'); })]
          : [];
        document.getElementById('picker').replaceChildren(
          h('div', { class: 'row' }, h('span', { class: 'label' }, 'Seite'), I3C_FINAL_PAGES.map(([k, l]) => h('button', { class: 'chip', 'aria-pressed': String(k === i3cPage), onclick: () => showI3c(k) }, l))),
          ...extra,
          chips('Umfang', [['now', 'I3-C'], ['later', 'mit späteren Funktionen']], i3cScope.later ? 'later' : 'now', (k) => { i3cScope.later = k === 'later'; showI3c(i3cPage); }),
          chips('Gerät', Object.entries(FRAMES), ui.frame, (k) => { if (k !== 'device') ui.lastFrame = k; ui.frame = k; }),
        );
        document.getElementById('intro').replaceChildren(h('span', {}, h('b', {}, 'I3-C final: Ergebnisliste und Korrektur. '),
          'Verbindlich und pixelgenau für I3-C (Entscheidungen des Product Owners vom 23.11.2026, Runden 1 bis 3). Alles lässt sich durchklicken: Tisch → Ergebnis → Bearbeiten / Löschen; Plus → Spiel → Formular → speichern. Start und laufende Partie wie in der App gebaut.'));
        const oldScroll = document.querySelector('.frame .scroll');
        const keep = oldScroll && i3c.lastScreen === app.screen ? oldScroll.scrollTop : 0;
        i3c.lastScreen = app.screen;
        const frame = h('div', { class: 'frame ' + ui.frame }, appView());
        if (ui.frame === 'device') frame.append(h('button', { class: 'exit', 'aria-label': 'Vollbild verlassen', onclick: () => { ui.frame = ui.lastFrame; render(); } }, icon('close', 16)));
        document.getElementById('stage').replaceChildren(frame, i3cNotes());
        if (keep) frame.querySelector('.scroll').scrollTop = keep;
        fitLookBack(frame);
        layoutTaps(frame);
        const pulse = i3c.pulse;
        i3c.pulse = false;
        i3cAfterRender(frame);
        i3c.pulse = pulse;
        i3cMarkPlaces(frame);
        i3cLightUp(frame);
      }
      ui.frame = 'phoneP';
      ui.lastFrame = 'phoneP';
      app.prep = newPrep();
      app.session = null;
      showI3c('results');
    </script>
  </body>
