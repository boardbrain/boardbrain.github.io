<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BoardBrain – I2-C final: Neue Partie</title>
    <style>
      :root {
        --bg: #231d18;
        --raised: #2d2620;
        --overlay: #383028;
        --border: #4b4036;
        --text: #f4ece1;
        --muted: #b8ab9b;
        --accent: #b45309;
        --accent-text: #f5be5b;
        --on-accent: #fff;
        --shadow: #0000008c;
        --backdrop: #000000b3;
        --error: #fc8585;
        --bg-image: radial-gradient(ellipse at 50% -10%, #4a3420 0%, transparent 60%);
        --red: #ef5359;
        --blue: #4189f5;
        --white: #f1f1f4;
        --orange: #f5852b;
        --res-wood: #74a75a;
        --res-brick: #d0714a;
        --res-wool: #b9dc8a;
        --res-grain: #e6c454;
        --res-ore: #a3acb8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg-image) fixed, var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', roboto, sans-serif;
        line-height: 1.5;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        background: none;
        border: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.25;
      }
      h2 {
        font-size: 1rem;
      }

      /* ---------- picker (not sticky) ---------- */
      .picker {
        display: grid;
        gap: 8px;
        padding: 10px 16px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }
      .picker .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .picker .label {
        min-width: 96px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .chip {
        min-height: 36px;
        padding: 6px 12px;
        font-size: 0.9rem;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .chip[aria-pressed='true'] {
        font-weight: 600;
        color: var(--accent-text);
        background: var(--overlay);
        border-color: var(--accent-text);
      }
      .intro {
        max-width: 1220px;
        margin: 0 auto;
        padding: 12px 16px 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .intro b {
        color: var(--text);
      }
      .stage {
        padding: 16px;
      }
      .jump {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        max-width: 1180px;
        margin: 0 auto 12px;
      }
      .jump .chip {
        min-height: 32px;
        padding: 4px 10px;
        font-size: 0.8rem;
      }

      /* ---------- device frames ---------- */
      .frame {
        position: relative;
        display: flex;
        flex-direction: column;
        margin: 0 auto;
        overflow: hidden;
        background: var(--bg-image), var(--bg);
        border: 1px dashed var(--border);
        border-radius: 24px;
      }
      .frame.phoneS {
        width: min(100%, 360px);
        height: 680px;
      }
      .frame.phoneP {
        width: min(100%, 390px);
        height: 800px;
      }
      .frame.tabletP {
        width: min(100%, 780px);
        height: 1020px;
      }
      .frame.wide {
        width: min(100%, 1180px);
        height: 760px;
      }
      .frame.device {
        position: fixed;
        inset: 0;
        z-index: 50;
        width: auto;
        height: auto;
        border: 0;
        border-radius: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      .exit {
        position: absolute;
        top: 50%;
        left: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        width: 28px;
        height: 56px;
        color: var(--muted);
        background: var(--overlay);
        border: 1px solid var(--border);
        border-left: 0;
        border-radius: 0 12px 12px 0;
        opacity: 0.8;
      }

      /* ---------- app frame (D-3, K-3) ---------- */
      .app {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        container-type: size;
      }
      .a-head {
        display: flex;
        flex: none;
        justify-content: center;
        padding: 10px 14px;
      }
      .logo {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .logo svg {
        color: var(--accent-text);
      }
      .scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .main {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 100%;
        max-width: 40rem;
        min-height: 100%;
        margin: 0 auto;
        padding: 20px 16px 24px;
      }
      .main.fill {
        height: 100%;
      }
      .main.wideMain {
        max-width: 64rem;
      }
      .handSpace {
        flex: none;
      }
      .hand {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 3;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
        background: linear-gradient(180deg, transparent, var(--bg) 48px);
        pointer-events: none;
      }
      .hand.folded {
        background: linear-gradient(180deg, transparent, var(--bg) 32px);
      }
      .navCard {
        position: relative;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2px;
        width: 86px;
        height: 104px;
        margin: 0 -8px;
        font-size: 0.7rem;
        text-align: center;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 -4px 12px var(--shadow);
        transform-origin: 50% 140%;
        pointer-events: auto;
      }
      .navCard.active {
        font-weight: 700;
        color: var(--accent-text);
        border-color: var(--accent-text);
      }
      .hand.folded .navCard {
        place-items: start center;
        align-content: start;
        padding-top: 5px;
      }

      .pageHead {
        display: flex;
        flex: none;
        gap: 12px;
        align-items: center;
      }
      .pageHead .titles {
        flex: 1;
        min-width: 0;
      }
      .pageHead .sub {
        font-size: 0.85rem;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .iconBtn {
        display: grid;
        flex: none;
        place-items: center;
        width: 44px;
        height: 44px;
        color: var(--text);
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 50%;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 0.85rem;
      }
      .tiny {
        font-size: 0.75rem;
      }
      .card {
        padding: 14px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .primary {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 8px 20px;
        font-weight: 600;
        color: var(--on-accent);
        background: var(--accent);
        border-radius: 10px;
      }
      .primary[disabled] {
        opacity: 0.45;
        cursor: default;
      }
      .secondary {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 8px 16px;
        font-weight: 600;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .danger {
        color: var(--on-accent);
        background: #b42f36;
      }
      .pill {
        position: relative;
        display: inline-flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        padding: 4px 12px;
        font-size: 0.85rem;
        color: var(--accent-text);
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .linkBtn {
        min-height: 44px;
        padding: 0 8px;
        font-size: 0.85rem;
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .ph {
        position: relative;
        outline: 1px dashed var(--accent-text);
        outline-offset: 3px;
        border-radius: 8px;
      }
      .ph-tag {
        position: absolute;
        top: -10px;
        right: 6px;
        z-index: 2;
        padding: 0 6px;
        font-size: 0.65rem;
        color: var(--accent-text);
        background: var(--bg);
        border-radius: 6px;
        white-space: nowrap;
      }

      /* ---------- start ---------- */
      .start {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
        max-width: 620px;
        height: 100%;
        margin: 0 auto;
        padding: 14px 16px 30px;
      }
      .banner {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        font-size: 0.9rem;
        background: var(--raised);
        border: 1px solid var(--accent-text);
        border-radius: 12px;
      }
      .pile {
        display: flex;
        gap: 22px;
        align-items: center;
        width: 100%;
        padding: 14px 18px 14px 22px;
        text-align: left;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .pileStack {
        position: relative;
        flex: none;
        width: 54px;
        height: 74px;
      }
      .back {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          repeating-linear-gradient(45deg, transparent 0 5px, var(--border) 5px 6px),
          repeating-linear-gradient(-45deg, transparent 0 5px, var(--border) 5px 6px),
          var(--raised);
        border: 2px solid var(--overlay);
        border-radius: 8px;
        box-shadow:
          inset 0 0 0 3px var(--raised),
          inset 0 0 0 4px var(--accent-text),
          0 2px 6px var(--shadow);
      }
      .back:nth-child(1) {
        transform: rotate(-9deg) translate(-5px, 2px);
      }
      .back:nth-child(2) {
        transform: rotate(6deg) translate(4px, 1px);
      }
      .backBadge {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        color: var(--on-accent);
        background: var(--accent);
        border: 2px solid var(--overlay);
        border-radius: 50%;
      }
      .fan {
        display: flex;
        justify-content: center;
      }
      .pcard {
        position: relative;
        display: grid;
        gap: 6px;
        place-items: center;
        align-content: center;
        aspect-ratio: 5 / 7;
        padding: 18px 10px;
        text-align: center;
        background: linear-gradient(160deg, var(--overlay), var(--raised));
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 6px 18px var(--shadow);
      }
      .pcard .corner {
        position: absolute;
        top: 8px;
        left: 10px;
        font-weight: 800;
        line-height: 1;
        color: var(--accent-text);
      }
      .pcard .corner.br {
        inset: auto 10px 8px auto;
        transform: rotate(180deg);
      }
      .pcard .ic {
        color: var(--accent-text);
      }
      .fan .pcard {
        width: min(31cqw, 150px, 22cqh);
        margin: 0 -2%;
      }

      /* ---------- game choice ---------- */
      .gameGrid {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        padding-top: 8px;
      }
      .gameGrid .pcard {
        width: min(46%, 180px);
      }

      .gameCard {
        gap: 6px;
        padding: 22px 10px 18px;
        background: linear-gradient(160deg, var(--overlay), var(--raised));
      }
      .gameCard .gameName {
        font-size: 1.15rem;
        line-height: 1.2;
      }
      .gameCard .note {
        font-size: 0.75rem;
        color: var(--muted);
      }
      .emblem {
        display: grid;
        place-items: center;
      }
      /* E2: a window onto the board, like the picture area of a real card. */
      .windowCard {
        padding: 26px 10px 22px;
      }
      /* The picture fades softly into the card, without frame or hard edges. */
      .window {
        display: block;
        width: calc(100% + 20px);
        aspect-ratio: 4 / 3;
        margin: -6px -10px 2px;
        -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 55%, transparent 100%);
        mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 55%, transparent 100%);
      }
      .window svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* K1–K3: built like a development card (title band, framed picture, text field with an arch). */
      .devCard {
        --dc-paper: #efe4c8;
        --dc-paper2: #e6d8b5;
        --dc-ink: #3a2a1a;
        --dc-muted: #6e5940;
        --dc-rib1: #a0703f;
        --dc-rib2: #6c4423;
        --dc-rib-ink: #fbf1dc;
        --dc-frame: #8a6a44;
        --dc-badge: #e5b545;
        --dc-badge-ink: #7a4c12;

        display: flex;
        flex-direction: column;
        gap: 0;
        place-items: stretch;
        aspect-ratio: 5 / 7.4;
        padding: 10px 10px 9px;
        font-family: Georgia, 'Times New Roman', serif;
        color: var(--dc-ink);
        background: linear-gradient(170deg, var(--dc-paper), var(--dc-paper2));
        border: 1px solid #0006;
        border-radius: 14px;
        box-shadow: 0 6px 18px var(--shadow), inset 0 0 0 4px #ffffff22;
      }
      .devCard.k2 {
        --dc-paper: #3d342b;
        --dc-paper2: #2c251f;
        --dc-ink: var(--text);
        --dc-muted: var(--muted);
        --dc-rib1: #d08c2c;
        --dc-rib2: #9a5a12;
        --dc-rib-ink: #fff6e2;
        --dc-frame: #b98a3e;
        --dc-badge: #f5be5b;
        --dc-badge-ink: #6d3f07;

        border-color: var(--border);
      }
      .devCard.k3 {
        --dc-paper: #eee7d6;
        --dc-paper2: #e2d8c2;
        --dc-rib1: #3a7486;
        --dc-rib2: #1c4a5c;
        --dc-rib-ink: #f3efe4;
        --dc-frame: #5d7f8a;
      }
      .dcHead {
        position: relative;
        display: block;
        height: 32px;
      }
      .dcRibbon {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 1.15rem;
        letter-spacing: 0.05em;
        color: var(--dc-rib-ink);
        background: linear-gradient(180deg, var(--dc-rib1), var(--dc-rib2));
        clip-path: polygon(0 0, 100% 0, 95% 50%, 100% 100%, 0 100%, 5% 50%);
        text-shadow: 0 1px 2px #0007;
      }
      .dcArt {
        position: relative;
        flex: 1;
        min-height: 0;
        margin: 0 4px;
        overflow: hidden;
        border: 3px double var(--dc-frame);
        border-top: 0;
        box-shadow: inset 0 0 8px #0007;
      }
      .dcArt svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .dcText {
        position: relative;
        display: grid;
        gap: 1px;
        margin-top: -12px;
        padding: 12px 6px 4px;
        font-size: 0.8rem;
        line-height: 1.3;
        background: linear-gradient(180deg, var(--dc-paper), var(--dc-paper2));
        border-top: 2px solid var(--dc-frame);
        border-radius: 50% 50% 6px 6px / 16px 16px 6px 6px;
      }
      .dcText strong {
        font-size: 0.92rem;
      }
      .dcText > span {
        color: var(--dc-muted);
      }
      /* E6: the picture fills the whole card like a game box; corners and texts sit on it. */
      .coverCard {
        overflow: hidden;
        align-content: space-between;
        padding: 0;
        border-color: #f9c45c66;
      }
      .cover {
        position: absolute;
        inset: 0;
      }
      .cover svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .coverCard .corner {
        z-index: 1;
        color: #fff3cf;
        text-shadow: 0 1px 2px #0009;
      }
      .coverTitle,
      .coverFoot {
        position: relative;
        z-index: 1;
        width: 100%;
        text-align: center;
      }
      .coverTitle {
        padding: 22% 8px 0;
      }
      .coverTitle .gameName {
        font-size: 1.7rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: #fff3cf;
        text-transform: uppercase;
        text-shadow: 0 2px 6px #5a0f12cc;
      }
      .coverFoot {
        padding: 14px 8px 26px;
        font-size: 0.78rem;
        font-weight: 600;
        color: #fff3cf;
        text-shadow: 0 1px 3px #000c;
        background: linear-gradient(180deg, transparent, #1a120866 60%);
      }
      .thumb {
        display: grid;
        flex: none;
        place-items: center;
        width: 52px;
        height: 52px;
        overflow: hidden;
        background: var(--overlay);
        border-radius: 10px;
      }
      .thumb.ic {
        color: var(--accent-text);
      }
      .thumb.window {
        width: 64px;
        height: 52px;
        margin: 0;
        aspect-ratio: auto;
        background: none;
      }
      .gameLine {
        min-height: 72px;
      }
      .gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        justify-content: center;
        max-width: 1180px;
        margin: 22px auto 0;
      }
      .galleryItem {
        display: grid;
        gap: 8px;
        justify-items: center;
        margin: 0;
      }

      /* ---------- preparation ---------- */
      .tables {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr));
        gap: 10px;
      }
      .tableRow {
        display: flex;
        gap: 14px;
        align-items: center;
        width: 100%;
        min-height: 72px;
        padding: 10px 14px;
        text-align: left;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .tableRow[aria-pressed='true'] {
        background: var(--overlay);
        border-color: var(--accent-text);
        box-shadow: inset 0 0 0 1px var(--accent-text);
      }
      .tableRow .names {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .tablesStrip {
        display: flex;
        gap: 10px;
        margin: 0 -16px;
        padding: 2px 16px 6px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tablesStrip .tableRow {
        flex: none;
        width: 15.5rem;
      }
      .mini {
        position: relative;
        display: block;
        flex: none;
      }
      .mini .top {
        position: absolute;
        inset: 22%;
        background: var(--overlay);
        border: 2px solid var(--border);
        border-radius: 50%;
      }
      .mini .seat {
        position: absolute;
        width: 24%;
        aspect-ratio: 1;
        border: 1.5px solid var(--bg);
        border-radius: 22%;
        transform: translate(-50%, -50%);
      }
      .mini .seat.round {
        border-radius: 50%;
      }
      .mini.ghost .top {
        border-style: dashed;
        background: none;
      }
      .roomGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr));
        gap: 12px;
      }
      .roomGrid.bigGrid {
        grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
      }
      .roomCard {
        position: relative;
        display: grid;
        gap: 4px;
        justify-items: center;
        align-content: start;
        min-width: 0;
        padding: 16px 8px;
        text-align: center;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .roomGrid > .roomCard.sub {
        grid-template-rows: auto 1fr auto;
        row-gap: 4px;
        height: 15.25rem;
        padding-bottom: 12px;
        touch-action: manipulation;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .roomCard.sub .tname {
        display: -webkit-box;
        overflow: hidden;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .roomCard.sub .mini {
        margin-bottom: 4px;
      }
      .roomCard.sub .cardText {
        display: grid;
        gap: 2px;
        align-self: start;
        min-width: 0;
      }
      .roomCard.sub .count {
        align-self: end;
        padding-top: 4px;
      }
      .cardFoot {
        display: flex;
        align-self: end;
        justify-content: space-between;
        gap: 6px;
        width: 100%;
        margin-top: 4px;
        padding: 8px 6px 0;
        border-top: 1px solid var(--border);
      }
      .boundText {
        font-weight: 700;
        color: var(--accent-text);
      }
      .boundTag {
        position: absolute;
        top: 7px;
        left: 7px;
        padding: 0 6px;
        font-size: 0.62rem;
        font-weight: 700;
        color: var(--accent-text);
        border: 1px solid var(--accent-text);
        border-radius: 999px;
        max-width: calc(50% - 18px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .boundTag.wide {
        z-index: 2;
        max-width: calc(100% - 14px);
        background: color-mix(in srgb, var(--raised) 45%, transparent);
        backdrop-filter: blur(2px);
      }

      .turnBar {

      .turnRow {

      .boardTag.colored {

        background: var(--raised);
        border: 1px solid var(--border);

      }
      .cornerSeat.now {

      }
      .cornerSeat .coin {
        font-size: 0.65rem;
      }
      .cornerSeat .csName {
        max-width: 100%;
        overflow: hidden;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cornerSeat svg {
        width: 14px !important;
        height: 14px !important;
      }
      .cornerSeat.tl { top: 6px; left: 6px; }
      .cornerSeat.tr { top: 6px; right: 6px; }
      .cornerSeat.br { right: 6px; bottom: 6px; }
      .cornerSeat.bl { bottom: 6px; left: 6px; }
      .turnBar svg,
      .pSlots svg {
        flex: none;
      }
      .pStrip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
        grid-auto-flow: column;
        gap: 6px;
      }
      .pPerson {
        display: grid;
        gap: 3px;
        justify-items: center;
        min-width: 0;

        border-radius: 10px;
      }
      .pPerson.now {
        background: var(--overlay);
        border-color: var(--accent-text);
        box-shadow: 0 6px 14px var(--shadow);
        transform: translateY(-4px);
      }
      .pPerson .pNum {
        font-size: 0.7rem;
        font-weight: 800;
        color: var(--accent-text);
      }

        font-size: 0.72rem;
      }
      .pPerson .pName {
        max-width: 100%;
        overflow: hidden;
        font-weight: 600;
        text-overflow: ellipsis;

      }

      }
      .legend {
        display: flex;
        flex: none;
        flex-wrap: wrap;
        gap: 4px 14px;
        justify-content: center;
        font-size: 0.82rem;
      }
      .legend span {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .legend .cur {
        font-weight: 700;
      }
      .legend .dim {
        opacity: 0.55;
      }
      .resGrid {
        display: flex;
        flex: 1;
        flex-wrap: wrap;
        gap: 12px;
        align-content: center;
        justify-content: center;
      }
      .resCard {
        position: relative;
        display: grid;
        gap: 6px;
        place-items: center;
        align-content: center;
        width: min(27cqw, 120px);
        aspect-ratio: 5 / 7;
        padding: 10px 6px;
        font-size: 0.9rem;
        font-weight: 700;
        background: linear-gradient(160deg, var(--overlay), var(--raised));
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 6px 18px var(--shadow);
      }
      .resCard .stripe {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 8px;
        border-radius: 11px 11px 0 0;
      }
      .resCard4 {
        position: relative;
        display: grid;
        gap: 6px;
        justify-items: center;
        width: min(28cqw, 124px);
      }
      .resGrid.few .resCard4 {
        width: min(38cqw, 23cqh, 170px);
      }
      .resGrid.many .resCard4 {
        width: min(22cqw, 96px);
      }
      .rc4svg {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45));
      }
      .rc4Name {
        font-size: 0.85rem;
        font-weight: 700;
      }
      .resStack > .behind .rc4Name {
        visibility: hidden;
      }
      .rcGallery {
        max-width: 1000px;
        margin: 28px auto 0;
        text-align: center;
      }
      .rcRow4 {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        justify-content: center;
        margin-top: 12px;
      }
      .rcRow4 .resCard4 {
        width: 170px;
      }
      .resGrid.many .resCard {
        width: min(22cqw, 96px);
      }
      .resGrid.many .resCard.full .rcName {
        font-size: 0.72rem;
      }
      .resGrid.many .resCard .resIcon {
        width: 48px !important;
        height: 48px !important;
      }
      .resCard .resIcon,
      .resDev .resIcon {
        box-shadow: 0 3px 8px #0006;
      }
      .resCard.full {
        gap: 10px;
        padding: 14px 6px 12px;
        font-size: 0.95rem;
        color: #231d18;
        background: linear-gradient(160deg, color-mix(in srgb, var(--rc) 82%, #fff), color-mix(in srgb, var(--rc) 82%, #000));
        border: 4px solid #f1e6cf;
        box-shadow: 0 6px 18px var(--shadow), inset 0 0 0 1px #0003;
      }
      .resCard.full .resIcon {
        background: #f1e6cf !important;
      }
      .resCard.full .rcName {
        max-width: 100%;
        padding: 2px 8px;
        font-size: 0.85rem;
        font-weight: 800;
        background: #f1e6cf;
        border-radius: 999px;
      }
      .resDev {
        width: min(30cqw, 128px);
      }
      .resDev .dcRibbon strong {
        font-size: 0.85rem;
      }
      .resDev .dcArt {
        display: grid;
        place-items: center;
        border-bottom: 3px double var(--dc-frame);
      }
      .resCount {
        position: absolute;
        top: -10px;
        right: -10px;
        z-index: 3;
        display: grid;
        place-items: center;
        min-width: 36px;
        height: 36px;
        padding: 0 6px;
        font-size: 0.95rem;
        font-weight: 900;
        color: var(--on-accent);
        background: var(--accent);
        border: 3px solid var(--bg);
        border-radius: 999px;
      }
      .resStack {
        position: relative;
      }
      .resStack {
        display: grid;
      }
      .resStack > * {
        grid-area: 1 / 1;
      }
      .resStack > .behind {
        filter: brightness(0.7);
        transform: translate(8px, 6px) rotate(5deg);
      }
      .resList {
        display: grid;
        flex: 1;
        gap: 8px;
        align-content: center;
        width: 100%;
        max-width: 24rem;
        margin: 0 auto;
      }
      .resItem {
        display: flex;
        gap: 12px;
        align-items: center;
        min-height: 52px;
        padding: 8px 14px;
        font-weight: 600;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .resIcon {
        display: grid;
        flex: none;
        place-items: center;
        width: 36px;
        height: 36px;
        color: #231d18;
        border-radius: 50%;
      }
      .progWrap {
        display: grid;
        flex: none;
        gap: 10px;
      }
      .progWrap {
        position: relative;
      }
      /* The look-back note floats over the free space below the progress and only takes room (inflow)
         when it would cover content (PO). */
      .lookBack {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        left: 0;
        z-index: 3;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 4px 4px 4px 12px;
        font-size: 0.85rem;
        color: var(--accent-text);
        background: var(--overlay);
        border: 1px solid var(--accent-text);
        border-radius: 999px;
      }
      .lookBack.inflow {
        position: static;
      }
      .lookBack .pill {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        margin-left: auto;
        font-size: 0.8rem;
      }
      .actions {
        display: flex;
        flex: none;
        gap: 10px;
        align-items: center;
      }
      .actions .primary {
        flex: 1;
      }
      .actionsCol {
        display: grid;
        flex: none;
        gap: 4px;
        justify-items: center;
      }
      .actionsCol .actions {
        width: 100%;
      }
      .skipNote {
        font-size: 0.78rem;
        color: var(--muted);
        text-align: center;
      }

      /* Phones: the board as large as possible, edge to edge (PO). */
      @container (max-width: 719px) {
        .placement .boardArea {
          margin: 0 -8px;
        }
        .placement .boardArea.ph {
          padding: 0;
          border-right: 0;
          border-left: 0;
          border-radius: 0;
        }
      }

      /* Wide: board left, information right – only in landscape; a portrait tablet stacks like a phone (PO). */
      @container (min-width: 720px) and (orientation: landscape) {
        .placement.split {
          display: grid;
          grid-template-columns: minmax(0, 1.6fr) minmax(16rem, 1fr);
          grid-template-rows: auto minmax(0, 1fr) auto auto;
          column-gap: 28px;
        }
        .placement.split .boardArea {
          grid-row: 1 / -1;
          grid-column: 1;
        }
        .placement.split > :not(.boardArea) {
          grid-column: 2;
        }
        .placement.split .legend {
          flex-direction: column;
          align-items: flex-start;
          align-self: start;
          font-size: 0.9rem;
        }
      }

      /* Placement order list for landscape W2/W3; hidden everywhere else. */
      .wOrder {
        display: none;
        gap: 8px;
        align-content: start;
      }
      .wOrder h2 {
        font-size: 0.95rem;
      }
      .wRow {
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 50px;
        padding: 6px 12px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .wRow.now {
        border-color: var(--pc);
        box-shadow: inset 4px 0 0 var(--pc), 0 6px 14px var(--shadow);
      }
      .wRow .pNum {
        width: 1rem;
        font-weight: 800;
        color: var(--accent-text);
      }
      .wRow .wName {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .wSlots {
        display: inline-flex;
        flex: none;
        gap: 6px;
        align-items: center;
      }
      .wSlots .wMark {
        flex: none;
      }
      .wSlots .wMark.faded {
        opacity: 0.22;
      }

      /* Tablet landscape and PC: the board takes the full height; title, progress, band and buttons
         beside it, buttons level with the bottom of the board (PO). W2 adds the order list on the
         right, W3 puts it on the left with the board in the middle. */
      @container (min-width: 720px) and (orientation: landscape) {
        .main.placeMain {
          display: grid;
          grid-template-columns: minmax(0, 1.7fr) minmax(17rem, 1fr);
          grid-template-rows: auto auto auto minmax(0, 1fr) auto;
          grid-template-areas: 'board head' 'board prog' 'board band' 'board .' 'board act';
          column-gap: 32px;
          row-gap: 16px;
          max-width: 80rem;
        }
        .main.placeMain.pwW2 {
          grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
          grid-template-areas: 'board head' 'board prog' 'board band' 'board list' 'board .' 'board act';
        }
        .main.placeMain.pwW3 {
          grid-template-columns: minmax(16rem, 0.9fr) minmax(0, 2fr) minmax(16rem, 0.95fr);
          grid-template-areas: 'list board head' 'list board prog' 'list board band' 'list board .' 'list board act';
          column-gap: 24px;
          max-width: none;
        }
        .main.placeMain > .stepBody,
        .main.placeMain .placement.split {
          display: contents;
        }
        .main.placeMain .pageHead {
          grid-area: head;
        }
        .main.placeMain .progWrap {

        while (s.state === 'generation' && !stop(s.revealed)) { s.revealed = null; drawNext(s); }
      }
      function jumps() {
        return h('div', { class: 'jump' },
          h('span', { class: 'small muted', style: { alignSelf: 'center' } }, 'Springen:'),
          quick('Start', () => { app.session = null; app.dialog = null; app.screen = 'start'; }),
          quick('Spielauswahl', () => { app.session = null; app.dialog = null; app.prep = newPrep(); app.screen = 'games'; }),
          quick('Tischwahl', () => { app.session = null; app.dialog = null; app.prep = newPrep(); app.screen = 'prepTable'; }),
          quick('Vorbereitung', () => { app.session = null; app.dialog = null; app.prep = newPrep(); app.prep.tableId = 't1'; app.screen = 'prep'; }),
          quick('Losschritt', () => { prepare('t1', 'base', false); app.screen = 'match'; app.dialog = null; }),
          quick('Letzter Dreh', () => { const s = prepare('t1', 'base', false); runUntil(s, (st) => st.kind === 'spin' && st.i === 2); app.screen = 'match'; app.dialog = null; }),
          quick('Platzierung', () => { const s = prepare('t1', 'ck', false); runUntil(s, (st) => st.kind === 'building' && st.i === 5); app.screen = 'match'; app.dialog = null; }),
          quick('Startrohstoffe', () => { const s = prepare('t3', 'base', true, 'without'); s.res.count = 3; runUntil(s, (st) => st.kind === 'res'); app.screen = 'match'; app.dialog = null; }),
          quick('Übersicht 4 Personen', () => { const s = prepare('t1', 'ck', true); runUntil(s, () => false); app.screen = 'overview'; app.dialog = null; }),
          quick('Übersicht übersprungen', () => { const s = prepare('t2', 'base', true); runUntil(s, (st) => st.kind === 'spin' && st.i === 0); s.revealed = null; s.skipped = true; drawNext(s); runUntil(s, () => false); app.screen = 'overview'; app.dialog = null; }),
          quick('Warnung Gebäude', () => { const s = prepare('t1', 'base', false); runUntil(s, () => false); app.screen = 'overview'; app.dialog = null; askRepeatSilent({ kind: 'building', i: 2 }); }),
        );
      }
      function askRepeatSilent(st) {
        const s = app.session;
        const lines = discarded(s, st);
        app.dialog = { title: `${stepTitle(s, st)} wiederholen?`, body: lines.length ? lines : ['Nur dieser Schritt wird neu gelost'], confirm: 'Wiederholen', danger: false, onConfirm: () => { repeat(s, st); go('match'); } };
      }

      // ---------- picker and render ----------
      function chips(label, entries, current, onPick) {
        return h('div', { class: 'row' }, h('span', { class: 'label' }, label), entries.map(([k, l]) => h('button', { class: 'chip', 'aria-pressed': String(k === current), onclick: () => { onPick(k); render(); } }, l)));
      }
      // Old and new resource symbols side by side, on their discs in three sizes and on a white chip.
      function resCompare() {
        const keep = ui.resSet;
        const row = (set, label) => {
          ui.resSet = set; applyResSet();
          const cells = RES_KEYS.map((k) => h('div', { class: 'rcCell' },
            resIcon(k, 56), resIcon(k, 36), resIcon(k, 24),
            h('span', { class: 'rcChip' }, svgEl('0 0 24 24', RES[k].svg, { width: 26, height: 26, fill: '#231d18' })),
            h('span', { class: 'tiny muted' }, RES[k].name)));
          return h('div', { class: 'rcRow' }, h('strong', { class: 'small' }, label), h('div', { class: 'rcCells' }, cells));
        };
        const el = h('div', { class: 'rcCompare' }, h('h2', {}, 'Rohstoff-Symbole'), row('new', 'neu'), row('old', 'bisher'));
        ui.resSet = keep; applyResSet();
        return el;
      }
      function render() {
        applyResSet();
        const page = FINAL_PAGES.find(([k]) => k === finalPage);
        document.getElementById('picker').replaceChildren(
          h('div', { class: 'row' }, h('span', { class: 'label' }, 'Seite'), FINAL_PAGES.map(([k, l, show]) => h('button', { class: 'chip', 'aria-pressed': String(k === finalPage), onclick: () => { finalPage = k; show(); render(); } }, l))),
          ...Object.entries(PAGE_DATA[finalPage] || {}).map(([k, v]) => chips(v.label, Object.entries(v.options), ui[k], (o) => { ui[k] = o; page[2](); })),
          chips('Umfang', [['i2', 'Jetzt in I2'], ['i3', 'Mit I3 („Ergebnis eintragen“)']], ui.scope, (o) => { ui.scope = o; }),
          chips('Gerät', Object.entries(FRAMES), ui.frame, (k) => { if (k !== 'device') ui.lastFrame = k; ui.frame = k; }),
        );
        document.getElementById('intro').replaceChildren(h('span', {}, h('b', {}, 'I2-C final: Neue Partie vorbereiten und durchlaufen, laufende Partie (I2-D baut danach ohne weitere Runde). '),
          'Verbindlich und pixelgenau für I2-C und I2-D. Oben die neun Seiten mit ihren Datenfällen, darunter je Seite die Festlegungen. Ergebnisse erscheinen mit schlichtem Einblenden; Glücksrad und Aufblinken gestaltet D-2 eigenständig. Farben werden in der App zu Tokens.'));
        const frame = h('div', { class: 'frame ' + ui.frame }, appView());
        if (ui.frame === 'device') frame.append(h('button', { class: 'exit', 'aria-label': 'Vollbild verlassen', onclick: () => { ui.frame = ui.lastFrame; render(); } }, icon('close', 16)));
        document.getElementById('stage').replaceChildren(frame, finalPage === 'res' ? resGallery() : '', notes());
        fitLookBack(frame);
        if (app.justRevealed) {
          app.justRevealed = false;
          // Simple fade-in of the result (I2-C); D-2 replaces it with wheel and highlighting.
          frame.querySelectorAll('[data-reveal]').forEach((el) => el.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'cubic-bezier(0.2, 0, 0, 1)' }));
          frame.querySelectorAll('#newest').forEach((el) => el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 520, easing: 'ease-out' }));
        }
      }
      // Measures whether the floating look-back note covers content; if so it takes its own room. For the
      // board only the drawn area counts, not the whole box around it. The app does this on every resize.
      function fitLookBack(frame) {
        const note = frame.querySelector('.lookBack');
        if (!note) return;
        const n = note.getBoundingClientRect();
        // card rows and grids are as high as the free room; what counts are the cards in them
        const boxes = [...frame.querySelectorAll('.qRow > *, .resultCard > *, .resGrid > *, .turnBand, .wOrder, .sentence, .boardArea svg')].map((el) => {
          const r = el.getBoundingClientRect();
          if (el.tagName.toLowerCase() !== 'svg') return r;
          const vb = el.viewBox.baseVal, k = Math.min(r.width / vb.width, r.height / vb.height);
          const w = vb.width * k, hh = vb.height * k;
          return { top: r.top + (r.height - hh) / 2, bottom: r.top + (r.height + hh) / 2, left: r.left + (r.width - w) / 2, right: r.left + (r.width + w) / 2 };
        });
        const covers = boxes.some((r) => r.top < n.bottom + 4 && r.bottom > n.top && r.left < n.right && r.right > n.left);
        note.classList.toggle('inflow', covers);
      }
      function notes() {
        const spec = (title, rows) => h('div', { class: 'card' }, h('h2', {}, title), h('ul', {}, rows.map((r) => h('li', { class: 'small' }, r))));
        return h('div', { class: 'notes' },
          spec('Für alle Seiten', [
            'Prinzip: Vorbereitung in drei Schritten (Tisch, Optionen, Farben), Ergebnis je Schritt als Karte, Fortschritt in Phasen (Losen, Reihenfolge, Platzierung, Rohstoffe), Startrohstoffe als Karten, Übersicht mit Reitern. Kartenhand wie bisher.',
            'Texte als Stichworte, ohne Punkt am Ende; nichts, was die Überschrift wiederholt; erklärt wird nur, was BoardBrain anders macht als die Spielregeln.',
            'Kopf im Ablauf: Zurück links, Titel mit Tisch · Version, rechts „Partie beenden ohne Ergebnis“ als Tür mit Pfeil. Unten „Wiederholen“ und der Vorwärts-Knopf; Zusatz-Links wie „Platzierung überspringen“ stehen darüber, damit die Knöpfe nie springen.',
            'Der Vorwärts-Knopf sagt, was er tut: „Losen“ auf dem neuesten Schritt, „Blättern“ solange spätere Schritte schon gelost sind (geht genau einen Schritt vor, ohne zu losen – auch nach dem Wiederholen eines älteren Schritts), „Zur Übersicht“ auf dem letzten Schritt. Ändert US-AB-02 AK-1 („Weiter“).',
            'Zurück führt überall zur vorherigen Ansicht. Im Ablauf zeigt es den vorherigen Schritt mit seinem gespeicherten Ergebnis (Rückblick), auf dem ersten Schritt gibt es keinen Zurück-Pfeil. Im Rückblick schwebt unter dem Fortschritt die Leiste „Rückblick“ mit „Zum aktuellen Schritt“ über dem freien Platz; nur wenn sie dort Inhalt verdecken würde (beim Brett zählt die gezeichnete Fläche), nimmt sie eigenen Platz ein und schiebt den Inhalt nach unten. Die App prüft das bei jeder Größenänderung. Neu gegenüber der Spezifikation (Ergänzung zu US-AB-03/US-AB-04).',
            'Ergebnisse erscheinen mit schlichtem Einblenden (I2-C). Glücksrad und Aufblinken gestaltet D-2 eigenständig.',
            'Fortschritt in vier Phasen; jede Phase ist so breit wie ihre längste mögliche Beschriftung („Platzierung 16/16“), fest für die ganze Partie: nichts bricht um, nichts verschiebt sich.',
            'Hoch- und Querformat: zwei Spalten nur im Querformat ab 720 px; Tablet hoch baut sich wie das Handy auf.',
          ]),
          spec('Start', [
            'Stapel „Partie“ wie in D-3. Läuft eine Partie, steht oben das Band „‹Tisch› spielt gerade · Weiter“.',
          ]),
          spec('Seite 1 Spielauswahl (US-SP-01)', [
            'Form A, Karte K2 „Entwicklungskarte dunkel“ mit Landschaft, „2 bis 4 Personen“, „Zufällige Startaufstellung“, ohne Hinweis darunter (entfernt auf Wunsch des Product Owners am 03.11.2026).',
            'E6 (Schachtelbild über die ganze Karte, „CATAN“ oben, „2 bis 4 Personen“, ohne Zahl in den Ecken) ist nicht gewählt und für spätere Entwicklungen aufbewahrt (oben unter „Spielkarte“ zu sehen).',
          ]),
          spec('Seite 2 Tisch (US-SP-04, US-PG-04)', [
            'Spielraum mit Tischen (T2), feste Kartengröße: Tischname und Namen je höchstens zwei Zeilen, Personenzahl immer unten.',
            'Schild oben links über die ganze Breite, erst am Ende gekürzt, halbtransparent, vor dem Tisch (L2).',
            'Antippen führt weiter, Gedrückt halten zeigt die Details. Ohne passenden Tisch nur eine Info und „Tische verwalten“.',
          ]),
          spec('Seite 3 Optionen (US-AB-01, US-LS-02, US-LS-03, US-SR-01, US-PL-05)', [
            'Liste mit Symbolen und Schaltern (O1). Spielversion als kompakte Karten mit kleinen Gebäuden: „2 Siedlungen“ / „Siedlung + Stadt“ (E2).',
            '„Modus: Standard“ mit Info-Symbol; die Info nennt Inlandkreuzungen, zufällige Straßenrichtung, gleich wahrscheinlich.',
            '„Reihenfolge losen“ abschaltbar: dann „Selbst festlegen“ (Personen der Reihe nach antippen, R1) oder „Ohne Platzierung“. Startrohstoffe folgen der Reihenfolge, ohne Reihenfolge der Sitzreihenfolge.',
            '„Weiter zu den Farben“ steht nach allen Einstellungen, nicht angeheftet.',
          ]),
          spec('Seite 4 Farben (US-PL-04)', [
            'Raster C1, oben die Zusammenfassung (Tisch + Version · n Losschritte · Reihenfolge · Startrohstoffe), kein Hinweis. Abweichende Farbe mit „· einmalig“. „Generierung starten“ nach dem Inhalt.',
          ]),
          spec('Seite 5 Losschritt (US-AB-02)', [
            'Ergebnis als Entwicklungskarte D2 (baugleich K2) mit Bild je Losschritt: Landschaftsfelder als gleichmäßige Blume mit Wüste in der Mitte (I1), Häfen als Plättchen (H3: 3:1 in der Mitte, fünf 2:1 ringsum), Zahlenchips auf der Blume (Z1: weiß mit roter Zahl, schwarzer Rand, 6 und 8 nicht benachbart).',
            'Neue Rohstoff-Symbole: Holzstapel, Ziegelstapel, Schaf, Garbe, Erzbrocken. Dieselbe Person darf mehrere Losschritte bekommen (FA-LS-06).',
          ]),
          spec('Seite 6 Reihenfolge (US-PL-02)', [
            'Kartenreihe Q3: offene Plätze verdeckt nur mit Nummer, neue Karte angehoben, goldenes Band „Start“ / „Platz n“, Münze, Name, Farbstreifen. Der letzte Platz ergibt sich ohne Dreh, ohne eigenen Hinweis.',
          ]),
          spec('Seite 7 Platzierung (US-PL-03, US-PL-04, US-PL-05)', [
            'Brett H1 mit Gebäuden G1 und Straßen R1; das neue Stück ohne eigene Markierung.',
            'Handy und Tablet hoch: unter dem Brett ein kleines Band in der Farbe der Person mit Stück, „Name · Siedlung/Stadt/Straße“ und rechts der Reihenfolge als Mini-Münzen, die Person am Zug umrandet (P9). Brett auf dem Handy randlos.',
            'Tablet quer und PC (W2): Brett links über die ganze Höhe; rechts Titel, Fortschritt, Band, darunter „Reihenfolge“ als Liste mit Platz, Münze, Name und den Stücken jeder Person (noch fehlende blass, alle Symbole gleich hoch, Person am Zug in ihrer Farbe umrandet); Knöpfe unten bündig mit dem Brett. Die Mini-Münzen im Band entfallen dort.',
            'Nach dem letzten Dreh zusätzlich „Platzierung überspringen“ mit Rückfrage, über den Knöpfen.',
          ]),
          spec('Seite 8 Startrohstoffe (US-SR-01)', [
            'Je Person ein Schritt. Rohstoffkarten S4 im Aufbau der Spielkarten: heller Rahmen mit Ranken, Symbol in allen vier Ecken (unten auf dem Kopf), in der Mitte eine Landschaft mit dem Rohstoff genau in der Bildmitte, alle fünf gleich groß wirkend, dünner heller Rand am Umriss. Eigene Zeichnung, keine Originalgrafik.',
            'Holz: fünf Stämme (W2). Lehm: loser Haufen aus vier Ziegeln (B2). Getreide mit geradem Feldweg, Erz ohne Bach. Name unter der Karte (AK-5).',
            'Doppelte einzeln nebeneinander (D1). Darunter das Band wie auf Seite 7 mit Rohstoff-Symbol, „Name · n Rohstoffe“ und der Reihenfolge.',
          ]),
          spec('Seite 9 Übersicht (US-AB-03, US-AB-04, US-AB-06, FA-AB-09)', [
            'Kopf „Laufende Partie“ mit Tisch · Version · Modus. Reiter „Brett“ und „Ergebnisse“ (T1).',
            'Brett: ohne Scrollen, auch auf dem kleinen Handy; das Brett nimmt die übrige Höhe, auf dem Handy randlos. Darunter die Namen in Reihenfolge mit Nummer, Münze und Name (N1); keine Zeile mit den Losschritten (steht unter Ergebnisse). Knöpfe am unteren Rand.',
            'Ergebnisse: Aufbau (Symbol, Losschritt, rechts Person), Reihenfolge (Platz, Münze, Name; letzter Platz ohne Wiederholen), Startrohstoffe, Gebäude und Straßen als eine Zeile je Person mit einem Knopf je Stück (G2), Symbole gleich hoch und mittig. Lange Namen mit „…“.',
            'Zurück führt zur vorherigen Ansicht: nach dem letzten Schritt zu diesem, vom Start aus zum Start.',
            'Antippen fragt nach; die Warnung nennt in Stichworten, was verworfen und neu gelost wird. „Partie beenden ohne Ergebnis“ mit Tür-Symbol und Rückfrage. „Ergebnis eintragen“ kommt mit I3 (oben unter „Umfang“).',
          ]),
        );
      }
      // The nine pages; each entry shows its page with the current data case.
      const FINAL_PAGES = [
        ['start', 'Start', () => { app.session = null; app.dialog = null; app.screen = 'start'; }],
        ['games', '1 Spielauswahl', () => { app.session = null; app.dialog = null; app.prep = newPrep(); app.screen = 'games'; }],
        ['prepTable', '2 Tisch', () => { app.session = null; app.dialog = null; app.prep = newPrep(); app.screen = 'prepTable'; }],
        ['prep', '3 Optionen', () => { app.session = null; app.dialog = null; app.prep = newPrep(); app.prep.tableId = 't1'; app.screen = 'prep'; }],
        ['prepColors', '4 Farben', () => { app.session = null; app.dialog = null; app.prep = newPrep(); app.prep.tableId = ui.tableCount; app.screen = 'prepColors'; }],
        ['draw', '5 Losschritt', showDraw],
        ['spin', '6 Reihenfolge', showSpin],
        ['place', '7 Platzierung', () => { showPlace(); if (ui.past === 'back') app.view = doneSteps(app.session).slice(-4)[0]; }],
        ['res', '8 Startrohstoffe', showRes],
        ['overview', '9 Übersicht', () => { app.overTab = 'board'; showOver(); }],
      ];
      let finalPage = 'games';
      app.prep = newPrep();
      FINAL_PAGES[1][2]();
      render();
    </script>
  </body>
