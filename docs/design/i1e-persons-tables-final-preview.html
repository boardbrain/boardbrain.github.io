<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BoardBrain – I1-E final: Personen und Tische</title>
    <style>
      :root {
        --bg: #231d18;
        --raised: #2d2620;
        --overlay: #383028;
        --border: #4b4036;
        --text: #f4ece1;
        --muted: #b8ab9b;
        --accent: #b45309;
        --accent-text: #f5be5b;
        --on-accent: #fff;
        --shadow: #0000008c;
        --backdrop: #000000b3;
        --bg-image: radial-gradient(ellipse at 50% -10%, #4a3420 0%, transparent 60%);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg-image) fixed, var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', roboto, sans-serif;
        line-height: 1.5;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: none;
        border: 0;
        padding: 0;
        text-align: inherit;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.25;
      }
      h2 {
        font-size: 1rem;
      }

      /* ---------- picker ---------- */
      .picker {
        display: grid;
        gap: 8px;
        padding: 10px 16px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }
      .picker .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .picker .label {
        min-width: 80px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .chip {
        min-height: 36px;
        padding: 6px 12px;
        font-size: 0.9rem;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .chip[aria-pressed='true'] {
        font-weight: 600;
        color: var(--accent-text);
        background: var(--overlay);
        border-color: var(--accent-text);
      }
      .intro {
        display: grid;
        gap: 4px;
        max-width: 1220px;
        margin: 0 auto;
        padding: 12px 16px 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .intro b {
        color: var(--text);
      }
      .stage {
        padding: 16px;
      }

      /* ---------- device frames ---------- */
      .frame {
        position: relative;
        display: flex;
        flex-direction: column;
        margin: 0 auto;
        overflow: hidden;
        background: var(--bg-image), var(--bg);
        border: 1px dashed var(--border);
        border-radius: 24px;
      }
      .frame.phoneP {
        width: min(100%, 390px);
        height: 780px;
      }
      .frame.tabletP {
        width: min(100%, 780px);
        height: 1020px;
      }
      .frame.wide {
        width: min(100%, 1180px);
        height: 760px;
      }
      .frame.device {
        position: fixed;
        inset: 0;
        z-index: 50;
        width: auto;
        height: auto;
        border: 0;
        border-radius: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      .exit {
        position: absolute;
        top: 50%;
        left: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        width: 28px;
        height: 56px;
        color: var(--muted);
        background: var(--overlay);
        border: 1px solid var(--border);
        border-left: 0;
        border-radius: 0 12px 12px 0;
        opacity: 0.8;
      }

      /* ---------- app frame (D-3) ---------- */
      .app {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .a-head {
        display: flex;
        justify-content: center;
        padding: 10px 14px;
      }
      .logo {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .logo svg {
        color: var(--accent-text);
      }
      .scroll {
        flex: 1;
        min-height: 0;
        min-width: 0;
        overflow-y: auto;
        scrollbar-width: none;
      }
      .scroll::-webkit-scrollbar {
        display: none;
      }
      .pad {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
        align-content: start;
        padding: 20px 16px 28px;
      }
      .wideContent {
        width: 100%;
        max-width: 1040px;
        margin: 0 auto;
      }
      .e-hand {
        position: relative;
        z-index: 3;
        display: flex;
        flex: none;
        justify-content: center;
        height: 104px;
        background: linear-gradient(180deg, transparent, var(--raised));
      }
      .e-navCard {
        position: relative;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2px;
        width: 86px;
        height: 104px;
        margin: 0 -8px;
        font-size: 0.7rem;
        text-align: center;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 -4px 12px var(--shadow);
        transform-origin: 50% 140%;
      }
      .e-navCard[aria-current='page'] {
        z-index: 2;
        color: var(--accent-text);
        font-weight: 700;
        border-color: var(--accent-text);
      }
      .e-card {
        position: relative;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 6px;
        aspect-ratio: 5 / 7;
        padding: 18px 10px;
        text-align: center;
        background: linear-gradient(160deg, var(--overlay), var(--raised));
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 6px 18px var(--shadow);
      }
      .corner {
        position: absolute;
        top: 8px;
        left: 10px;
        font-weight: 800;
        line-height: 1;
        color: var(--accent-text);
      }
      .corner.br {
        top: auto;
        right: 10px;
        bottom: 8px;
        left: auto;
        transform: rotate(180deg);
      }

      /* ---------- shared pieces ---------- */
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 0.85rem;
      }
      .tiny {
        font-size: 0.75rem;
      }
      .accentText {
        color: var(--accent-text);
      }
      .ellipsis {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .iconBtn {
        display: grid;
        flex: none;
        place-items: center;
        width: 44px;
        height: 44px;
        color: var(--text);
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 50%;
      }
      .primary {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 8px 16px;
        font-weight: 600;
        color: var(--on-accent);
        background: var(--accent);
        border-radius: 8px;
      }
      .card {
        padding: 14px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .pageHead {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .pageHead h1 {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .fieldRow {
        display: flex;
        gap: 8px;
      }
      .field {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 0 12px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .chev {
        flex: none;
        color: var(--muted);
      }
      .listCard {
        overflow: hidden;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .listRow {
        display: flex;
        gap: 12px;
        align-items: center;
        width: 100%;
        min-height: 56px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
      }
      .listRow:last-child {
        border-bottom: 0;
      }
      .rowText {
        display: grid;
        flex: 1;
        min-width: 0;
      }
      .rowText > * {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .initial {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: 36px;
        height: 36px;
        font-weight: 700;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 50%;
      }
      .dot {
        display: inline-block;
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .dots {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: center;
      }
      .moreDots {
        font-size: 0.68rem;
        font-weight: 700;
        line-height: 10px;
        color: var(--muted);
      }
      .mt {
        position: relative;
        flex: none;
      }
      .mt-top {
        position: absolute;
        inset: 22%;
        background: var(--overlay);
        border: 2px solid var(--border);
        border-radius: 50%;
      }
      .mt-seat {
        position: absolute;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .mt-seat.hl {
        z-index: 1;
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
      .mt-seat.dim {
        opacity: 0.3;
      }
      .sectionHead {
        display: flex;
        gap: 8px;
        align-items: baseline;
        justify-content: space-between;
      }

      /* ---------- L1 Spielkarten ---------- */
      .cardGrid {
        display: grid;
        gap: 12px;
      }
      .pCard {
        gap: 3px;
        align-content: start;
        padding: 14px 8px 24px;
      }
      .pCard .ini {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        margin-top: 6px;
        font-size: 1rem;
        font-weight: 800;
        color: var(--accent-text);
        border: 2px solid var(--accent-text);
        border-radius: 50%;
      }
      .pCard.none .ini {
        color: var(--muted);
        border-style: dashed;
        border-color: var(--muted);
      }
      .pCard .nm {
        font-size: 0.85rem;
        font-weight: 700;
        line-height: 1.2;
      }
      .newCard {
        color: var(--accent-text);
        background: none;
        border: 1px dashed var(--accent-text);
        box-shadow: none;
      }

      /* ---------- L2 Spielfiguren ---------- */
      .board {
        display: grid;
        gap: 18px 6px;
        padding: 18px 10px;
        background:
          repeating-linear-gradient(0deg, transparent 0 39px, #ffffff08 39px 40px),
          repeating-linear-gradient(90deg, transparent 0 39px, #ffffff08 39px 40px),
          var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .fig {
        display: grid;
        gap: 2px;
        justify-items: center;
        min-width: 0;
      }
      .fig .meeple {
        color: var(--overlay);
        filter: drop-shadow(0 4px 4px var(--shadow));
      }
      .fig .meeple path {
        fill: var(--overlay);
        stroke: var(--accent-text);
        stroke-width: 1.2;
      }
      .fig.none .meeple path {
        fill: none;
        stroke: var(--muted);
        stroke-dasharray: 2 2;
      }
      .fig .base {
        display: flex;
        align-items: center;
        max-width: 100%;
        gap: 2px;
        min-height: 8px;
        margin-top: -4px;
      }
      .fig .base .dot {
        width: 8px;
        height: 8px;
      }
      .fig .nm {
        max-width: 100%;
        overflow: hidden;
        font-size: 0.8rem;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .figIni {
        position: relative;
        display: grid;
        place-items: center;
      }
      .figIni span {
        position: absolute;
        top: 46%;
        font-size: 0.8rem;
        font-weight: 800;
        color: var(--accent-text);
        transform: translateY(-50%);
      }
      .fig.none .figIni span {
        color: var(--muted);
      }

      /* ---------- L3 Karteikasten ---------- */
      .register {
        position: relative;
        display: grid;
        gap: 14px;
        padding-right: 30px;
      }
      .letter {
        display: grid;
        place-items: center;
        width: 34px;
        height: 30px;
        font-weight: 800;
        color: var(--bg);
        background: var(--accent-text);
        border-radius: 8px 8px 0 0;
      }
      .regBox {
        display: grid;
      }
      .regBox .listCard {
        border-top-left-radius: 0;
      }
      .rail {
        position: absolute;
        top: 0;
        right: 0;
        display: grid;
        gap: 0;
        font-size: 0.7rem;
        font-weight: 700;
        text-align: center;
      }
      .rail button {
        display: grid;
        place-items: center;
        width: 24px;
        height: 22px;
        color: var(--accent-text);
      }
      .rail button[disabled] {
        color: var(--border);
        cursor: default;
      }

      /* ---------- L4 Spielsteine ---------- */
      .tokens {
        display: grid;
        gap: 16px 8px;
      }
      .token {
        display: grid;
        gap: 4px;
        justify-items: center;
        min-width: 0;
      }
      .tokenDisc {
        display: grid;
        place-items: center;
        width: 60px;
        height: 60px;
        padding: 5px;
        border-radius: 50%;
      }
      .tokenDisc span {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        font-size: 1.2rem;
        font-weight: 800;
        background: radial-gradient(circle at 35% 30%, var(--overlay), var(--raised));
        border-radius: 50%;
        box-shadow: inset 0 -3px 6px var(--shadow);
      }
      .token.none .tokenDisc {
        border: 2px dashed var(--border);
      }
      .token .nm {
        font-size: 0.8rem;
        font-weight: 600;
      }

      /* ---------- L5 Spielblock ---------- */
      .pad5 {
        overflow: hidden;
        color: #2b2219;
        background: #f3e9d2;
        border-radius: 6px;
        box-shadow: 0 8px 20px var(--shadow);
      }
      .pad5Head {
        padding: 8px 12px;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-align: center;
        text-transform: uppercase;
        color: #f3e9d2;
        background: #8a3b12;
      }
      .pad5Scroll {
        overflow-x: auto;
        scrollbar-width: none;
        mask-image: linear-gradient(90deg, #000 88%, transparent);
      }
      .pad5Scroll::-webkit-scrollbar {
        display: none;
      }
      .pad5 table {
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      .pad5 th,
      .pad5 td {
        height: 40px;
        padding: 0 6px;
        text-align: center;
        border-right: 1px solid #c9b48c;
        border-bottom: 1px solid #c9b48c;
      }
      .pad5 th.nameCol,
      .pad5 td.nameCol {
        position: sticky;
        left: 0;
        z-index: 1;
        min-width: 110px;
        max-width: 130px;
        padding: 0 10px;
        overflow: hidden;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
        background: #f3e9d2;
        border-right: 2px solid #8a3b12;
      }
      .pad5 td.nameCol button {
        width: 100%;
        min-height: 40px;
        font-weight: 700;
        text-align: left;
      }
      .pad5 th.tbl {
        height: 112px;
        min-width: 38px;
        vertical-align: bottom;
        padding-bottom: 6px;
      }
      .pad5 th.tbl span {
        display: inline-block;
        font-size: 0.75rem;
        white-space: nowrap;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
      }
      .pad5 .cellDot {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #2b2219;
        border-radius: 50%;
      }
      .pad5 .sum {
        font-weight: 800;
        color: #8a3b12;
      }

      /* ---------- L6 Namenschips ---------- */
      .chipCloud {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .nChip {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        min-height: 44px;
        padding: 4px 14px 4px 6px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .nChip .initial {
        width: 32px;
        height: 32px;
        font-size: 0.85rem;
      }
      .nChip.none {
        padding-left: 14px;
        background: none;
        border-style: dashed;
      }

      /* ---------- D1 Spielerpass ---------- */
      .pass {
        position: relative;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 14px;
        align-items: center;
        width: min(100%, 420px);
        aspect-ratio: 85.6 / 54;
        margin: 0 auto;
        padding: 18px;
        overflow: hidden;
        background:
          repeating-linear-gradient(135deg, #ffffff06 0 8px, transparent 8px 16px),
          linear-gradient(160deg, var(--overlay), var(--raised));
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 24px var(--shadow);
      }
      .passTop {
        position: absolute;
        top: 12px;
        right: 16px;
        left: 16px;
        display: flex;
        justify-content: space-between;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent-text);
      }
      .passPhoto {
        display: grid;
        place-items: center;
        width: 84px;
        height: 104px;
        margin-top: 14px;
        font-size: 2.4rem;
        font-weight: 800;
        color: var(--accent-text);
        background: var(--bg);
        border: 2px solid var(--border);
        border-radius: 10px;
      }
      .passName {
        font-size: 1.35rem;
        font-weight: 800;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }
      .stamps {
        display: grid;
        gap: 14px;
      }
      .stamp {
        display: grid;
        gap: 2px;
        justify-items: center;
        padding: 12px 6px;
        text-align: center;
        border: 2px dashed var(--accent-text);
        border-radius: 14px;
      }
      .stamp strong {
        color: var(--accent-text);
      }

      /* ---------- D2 Netz ---------- */
      .net {
        position: relative;
        margin: 0 auto;
      }
      .net svg.lines {
        position: absolute;
        inset: 0;
      }
      .netHub {
        position: absolute;
        top: 50%;
        left: 50%;
        display: grid;
        place-items: center;
        width: 96px;
        height: 96px;
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--accent-text);
        background: radial-gradient(circle at 35% 30%, var(--overlay), var(--raised));
        border: 3px solid var(--accent-text);
        border-radius: 50%;
        box-shadow: 0 8px 20px var(--shadow);
        transform: translate(-50%, -50%);
      }
      .netNode {
        position: absolute;
        display: grid;
        gap: 2px;
        justify-items: center;
        width: 110px;
        text-align: center;
        transform: translate(-50%, -50%);
      }
      .netNode strong {
        max-width: 100%;
        overflow: hidden;
        font-size: 0.8rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ---------- D3 Blatt ---------- */
      .sheetBackdrop {
        position: absolute;
        inset: 0;
        z-index: 4;
        background: var(--backdrop);
      }
      .sheet {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 5;
        display: grid;
        gap: 16px;
        align-content: start;
        max-height: 78%;
        padding: 10px 16px 24px;
        overflow-y: auto;
        background: var(--raised);
        border: 1px solid var(--border);
        border-bottom: 0;
        border-radius: 22px 22px 0 0;
        box-shadow: 0 -10px 30px var(--shadow);
        scrollbar-width: none;
      }
      .sheet.side {
        top: 0;
        bottom: 0;
        left: auto;
        width: 420px;
        max-height: none;
        padding-top: 20px;
        border-bottom: 1px solid var(--border);
        border-radius: 22px 0 0 22px;
      }
      .grip {
        justify-self: center;
        width: 44px;
        height: 5px;
        background: var(--border);
        border-radius: 999px;
      }

      /* ---------- D4 Steckbrief ---------- */
      .hero {
        display: grid;
        gap: 8px;
        justify-items: center;
        padding: 24px 16px 18px;
        text-align: center;
        background:
          radial-gradient(circle at 50% 0%, #f5be5b22, transparent 70%),
          var(--raised);
        border: 1px solid var(--border);
        border-radius: 20px;
      }
      .hero .big {
        display: grid;
        place-items: center;
        width: 88px;
        height: 88px;
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--accent-text);
        background: var(--bg);
        border: 3px solid var(--accent-text);
        border-radius: 50%;
      }
      .statRow {
        display: grid;
        grid-auto-columns: 1fr;
        grid-auto-flow: column;
        gap: 8px;
        width: 100%;
        max-width: 360px;
      }
      .stat {
        display: grid;
        padding: 8px 4px;
        background: var(--bg);
        border-radius: 12px;
      }
      .stat b {
        font-size: 1.2rem;
        color: var(--accent-text);
      }
      .tabs {
        display: flex;
        gap: 4px;
        padding: 4px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .tab {
        flex: 1;
        min-height: 40px;
        font-size: 0.9rem;
        text-align: center;
        border-radius: 999px;
      }
      .tab[aria-selected='true'] {
        font-weight: 700;
        color: var(--on-accent);
        background: var(--accent);
      }
      .tab.ghost {
        color: var(--muted);
        opacity: 0.6;
      }

      /* ---------- D5 Kartenrückseite ---------- */
      .flipWrap {
        width: min(78%, 300px);
        margin: 0 auto;
        perspective: 1200px;
      }
      .flipInner {
        position: relative;
        aspect-ratio: 5 / 7;
        transition: transform 700ms cubic-bezier(0.2, 0, 0, 1);
        transform-style: preserve-3d;
      }
      .flipInner.flipped {
        transform: rotateY(180deg);
      }
      /* Both faces keep the size of the card; content never makes the card longer. */
      .face {
        position: absolute;
        inset: 0;
        height: 100%;
        min-height: 0;
        aspect-ratio: auto;
        overflow: hidden;
        backface-visibility: hidden;
      }
      .backList {
        display: grid;
        gap: 6px;
        align-content: start;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: none;
        padding-bottom: 14px;
      }
      /* Only while more entries follow below: a soft edge and a hint; at the end both vanish. */
      .backList.moreBelow {
        mask-image: linear-gradient(180deg, #000 calc(100% - 40px), transparent);
      }
      .moreHint {
        position: absolute;
        bottom: 8px;
        left: 50%;
        z-index: 2;
        display: inline-flex;
        gap: 4px;
        align-items: center;
        min-height: 28px;
        padding: 2px 12px;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--accent-text);
        white-space: nowrap;
        background: var(--overlay);
        border: 1px solid var(--accent-text);
        border-radius: 999px;
        transform: translateX(-50%);
      }
      .moreHint[hidden] {
        display: none;
      }
      .backList::-webkit-scrollbar {
        display: none;
      }
      .backChips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-content: start;
      }
      .backChip {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        max-width: 100%;
        min-height: 36px;
        padding: 2px 10px;
        font-size: 0.8rem;
        font-weight: 600;
        background: var(--bg);
        border-radius: 999px;
      }
      .face.backFace {
        display: grid;
        gap: 8px;
        align-content: start;
        grid-template-rows: auto minmax(0, 1fr);
        padding: 30px 16px 32px;
        text-align: left;
        place-items: stretch;
        transform: rotateY(180deg);
      }
      .backRow {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        min-height: 48px;
        padding: 4px 8px;
        background: var(--bg);
        border-radius: 10px;
      }

      /* ---------- D6 Mitspieler ---------- */
      .withRow {
        display: grid;
        gap: 10px;
        padding: 14px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .withHead {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
      }
      .mates {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .mate {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        min-height: 40px;
        padding: 3px 12px 3px 3px;
        font-size: 0.85rem;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .mate .c {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        font-size: 0.8rem;
        font-weight: 800;
        color: var(--bg);
        border-radius: 50%;
      }
      .mate.me {
        font-weight: 700;
        border-color: var(--accent-text);
      }

      /* ---------- D7 Sammelkarte ---------- */
      .tcg {
        display: grid;
        gap: 10px;
        width: min(100%, 340px);
        margin: 0 auto;
        padding: 12px;
        background: linear-gradient(160deg, var(--accent-text), var(--accent));
        border-radius: 18px;
        box-shadow: 0 10px 24px var(--shadow);
      }
      .tcg > * {
        background: var(--raised);
      }
      .tcgHead {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        min-width: 0;
        padding: 6px 12px;
        font-size: 1.2rem;
        border-radius: 10px;
      }
      .tcgHp {
        display: grid;
        flex: none;
        place-items: center;
        align-content: center;
        width: 52px;
        height: 52px;
        font-size: 1.15rem;
        font-weight: 800;
        line-height: 1;
        color: var(--accent-text);
        border: 2px solid var(--accent-text);
        border-radius: 50%;
      }
      .tcgHp small {
        font-size: 0.55rem;
        font-weight: 600;
        color: var(--muted);
      }
      .tcgArt {
        display: grid;
        place-items: center;
        aspect-ratio: 4 / 3;
        background: repeating-conic-gradient(var(--overlay) 0 25%, var(--raised) 0 50%) 0 0 / 28px 28px;
        border: 3px solid var(--border);
        border-radius: 8px;
      }
      .tcgArt span {
        display: grid;
        place-items: center;
        width: 110px;
        height: 110px;
        font-size: 3.4rem;
        font-weight: 800;
        color: var(--accent-text);
        background: var(--bg);
        border: 3px solid var(--accent-text);
        border-radius: 50%;
        box-shadow: 0 8px 18px var(--shadow);
      }
      .tcgType {
        padding: 4px 12px;
        font-size: 0.8rem;
        font-style: italic;
        color: var(--muted);
        border-radius: 6px;
      }
      .tcgStats {
        display: grid;
        grid-auto-columns: 1fr;
        grid-auto-flow: column;
        gap: 6px;
        padding: 6px;
        border-radius: 10px;
      }
      .tcgStat {
        display: grid;
        justify-items: center;
        padding: 6px 2px;
        font-size: 0.72rem;
        color: var(--muted);
        background: var(--bg);
        border-radius: 8px;
      }
      .tcgStat b {
        font-size: 1.2rem;
        color: var(--accent-text);
      }
      .laterStat {
        opacity: 0.55;
        outline: 1px dashed var(--muted);
      }
      .tcgFlavor {
        position: relative;
        padding: 8px 12px;
        font-size: 0.85rem;
        font-style: italic;
        border-radius: 8px;
      }
      .linkBtn {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--accent-text);
      }

      /* ---------- D8 Quartett ---------- */
      .quartet {
        width: min(100%, 340px);
        margin: 0 auto;
        overflow: hidden;
        background: var(--raised);
        border: 2px solid var(--accent-text);
        border-radius: 16px;
        box-shadow: 0 10px 24px var(--shadow);
      }
      .qTop {
        position: relative;
        display: grid;
        gap: 6px;
        justify-items: center;
        padding: 18px 12px 12px;
        background: radial-gradient(circle at 50% 30%, #f5be5b33, transparent 70%), var(--overlay);
        border-bottom: 2px solid var(--accent-text);
      }
      .qCode {
        position: absolute;
        top: 8px;
        left: 10px;
        padding: 0 8px;
        font-size: 0.8rem;
        font-weight: 800;
        color: var(--bg);
        background: var(--accent-text);
        border-radius: 6px;
      }
      .qBig {
        display: grid;
        place-items: center;
        width: 84px;
        height: 84px;
        font-size: 2.4rem;
        font-weight: 800;
        color: var(--accent-text);
        background: var(--bg);
        border-radius: 50%;
      }
      .qName {
        font-size: 1.3rem;
      }
      .qRow {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
      }
      .qRow:nth-child(odd) {
        background: #ffffff06;
      }
      .qRow:last-child {
        border-bottom: 0;
      }
      .qRow strong {
        color: var(--accent-text);
      }
      .qRow.later {
        opacity: 0.55;
      }

      /* ---------- D9 Karte und Steckbrief ---------- */
      .factGrid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .factLine {
        display: inline-flex;
        gap: 6px;
        align-items: baseline;
        padding: 4px 10px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .factLine b {
        color: var(--accent-text);
      }

      /* ---------- D10 Kartenreihe ---------- */
      .cardRow {
        display: flex;
        gap: 10px;
        margin: 0 -16px;
        padding: 4px 16px 12px;
        overflow-x: auto;
        scrollbar-width: none;
        mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
      }
      .cardRow::-webkit-scrollbar {
        display: none;
      }
      .tCard {
        flex: none;
        width: 112px;
        gap: 4px;
        padding: 12px 6px;
      }
      .tCard strong {
        max-width: 100%;
        overflow-wrap: anywhere;
      }

      /* ---------- D11 Spielerbogen ---------- */
      .sheet5 {
        overflow: hidden;
        color: #2b2219;
        background: #f3e9d2;
        border-radius: 6px;
        box-shadow: 0 8px 20px var(--shadow);
      }
      .sheet5Body {
        display: grid;
        gap: 4px;
        padding: 12px 16px 16px;
      }
      .sheet5Label {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8a3b12;
      }
      .sheet5Name {
        display: grid;
        padding-bottom: 6px;
        border-bottom: 2px solid #8a3b12;
      }
      .sheet5Name strong {
        font-size: 1.6rem;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }
      .sheet5Fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(4rem, 1fr));
        gap: 8px;
        padding: 6px 0;
      }
      .field5 {
        display: grid;
        min-width: 0;
        padding: 6px;
        border: 1.5px solid #8a3b12;
        border-radius: 6px;
      }
      .field5 .sheet5Label {
        font-size: 0.62rem;
        letter-spacing: 0.03em;
      }
      .field5.later {
        border-style: dashed;
        opacity: 0.6;
      }
      .field5 strong {
        font-size: 1rem;
        white-space: nowrap;
      }
      .sheet5Row {
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 44px;
        color: #2b2219;
        border-bottom: 1px solid #c9b48c;
      }
      .sheet5Row .cellDot {
        display: inline-block;
        flex: none;
        width: 16px;
        height: 16px;
        border: 2px solid #2b2219;
        border-radius: 50%;
      }
      .sheet5Small {
        flex: none;
        font-size: 0.75rem;
        color: #6b5640;
      }
      .sheet5More {
        justify-self: center;
        min-height: 44px;
        font-weight: 700;
        color: #8a3b12;
      }

      /* ---------- round 3: table pages ---------- */
      .seatToken {
        display: inline-grid;
        flex: none;
        place-items: center;
        font-weight: 800;
        color: var(--bg);
        border-radius: 50%;
      }
      .bt {
        position: relative;
        flex: none;
        margin: 0 auto;
      }
      .bt-top {
        position: absolute;
        inset: 17%;
        display: grid;
        align-content: center;
        justify-items: center;
        padding: 8px;
        text-align: center;
        background: radial-gradient(circle at 40% 35%, var(--overlay), var(--raised));
        border: 6px solid var(--border);
        border-radius: 50%;
        box-shadow: inset 0 0.75rem 2.5rem -0.75rem var(--shadow);
      }
      .bt-seat {
        position: absolute;
        display: grid;
        place-items: center;
        font-weight: 800;
        color: var(--bg);
        border: 3px solid var(--bg);
        border-radius: 50%;
        box-shadow: 0 4px 12px var(--shadow);
        transform: translate(-50%, -50%);
      }
      .bt-name {
        position: absolute;
        max-width: 76px;
        padding: 0 6px;
        overflow: hidden;
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1.6;
        text-overflow: ellipsis;
        white-space: nowrap;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .twoCol {
        display: grid;
        gap: 24px;
        align-items: start;
      }
      .roomGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr));
        gap: 12px;
      }
      .tableCard {
        display: grid;
        gap: 4px;
        justify-items: center;
        align-content: start;
        padding: 16px 8px;
        text-align: center;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .tableCard.new {
        color: var(--accent-text);
        border: 1px dashed var(--accent-text);
      }
      .plusTable {
        display: grid;
        place-items: center;
        width: 96px;
        height: 96px;
        border: 2px dashed var(--accent-text);
        border-radius: 50%;
      }

      .winRow {
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 36px;
        padding: 0 14px;
      }
      .winTrack {
        flex: 1;
        height: 10px;
        overflow: hidden;
        background: var(--bg);
        border-radius: 999px;
      }
      .winBar {
        display: block;
        height: 100%;
        border-radius: 999px;
      }

      .cardTables {
        display: -webkit-box;
        max-width: 100%;
        overflow: hidden;
        font-size: 0.68rem;
        line-height: 1.25;
        color: var(--muted);
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow-wrap: anywhere;
      }

      /* Very narrow phones: one line of table names, so the corner number stays free. */
      @media (width < 370px) {
        .frame.device .cardTables {
          -webkit-line-clamp: 1;
          line-clamp: 1;
        }
      }

      /* later features */
      .ph {
        position: relative;
        opacity: 0.55;
        outline: 2px dashed var(--muted);
        outline-offset: 3px;
        border-radius: 14px;
      }
      .ph-tag {
        position: absolute;
        top: -10px;
        right: 8px;
        z-index: 2;
        padding: 0 7px;
        font-size: 0.68rem;
        font-weight: 600;
        line-height: 18px;
        color: var(--bg);
        background: var(--muted);
        border-radius: 999px;
        white-space: nowrap;
      }
      .ghostBtn {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        min-height: 44px;
        padding: 6px 14px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .spec {
        display: grid;
        gap: 6px;
        align-content: start;
      }
      .spec ul {
        display: grid;
        gap: 4px;
        margin: 0;
        padding-left: 18px;
      }
    </style>
  </head>
  <body>
    <div class="picker">
      <div class="row" id="list-row"></div>
      <div class="row" id="detail-row"></div>
      <div class="row" id="frame-row"></div>
      <div class="row" id="option-row"></div>
    </div>
    <div class="intro" id="intro"></div>
    <div class="stage" id="stage"></div>

    <script>
      // Mockups only, not app code. Colour values mirror src/ui/styles/tokens.css (design Holz).
      const GROUP = {
        red: '#ef5359', blue: '#4189f5', yellow: '#e6cb72', green: '#8fb35a', indigo: '#aeb0f2', orange: '#f5852b',
        teal: '#5fbfb2', magenta: '#d46bc4', brown: '#94643f', pink: '#eba3bf', gray: '#9aa1ab', white: '#f1f1f4',
      };
      const ORDER = ['red', 'blue', 'yellow', 'green', 'indigo', 'orange', 'teal', 'magenta', 'brown', 'pink', 'gray', 'white'];
      const CATAN_ORDER = ['red', 'blue', 'white', 'orange'];
      const COLOR_NAME = {
        red: 'Rot', blue: 'Blau', yellow: 'Gelb', green: 'Moosgrün', indigo: 'Indigo', orange: 'Orange',
        teal: 'Petrol', magenta: 'Magenta', brown: 'Kaffee', pink: 'Rosé', gray: 'Steingrau', white: 'Weiß',
      };
      const FRAMES = { phoneP: 'Handy hoch', tabletP: 'Tablet hoch', wide: 'Tablet quer / PC', device: '⛶ Vollbild auf diesem Gerät' };

      // ---------- data ----------
      const NAMES = [
        'Anna', 'Ben', 'Clara', 'David', 'Eva', 'Finn', 'Greta', 'Hanna', 'Ilias', 'Jonas', 'Katharina', 'Leo',
        'Mia', 'Noah', 'Oskar', 'Paula', 'Mama', 'Papa', 'Oma Hildegard', 'Opa', 'Xenia', 'Yusuf', 'Zoe',
      ];
      const GROUP_DEFS = [
        ['Freitagsrunde', { kind: 'game', game: 'Catan' }, ['Anna', 'Ben', 'Clara', 'David'], 0],
        ['Familie', { kind: 'global' }, ['Mama', 'Papa', 'Anna', 'Eva', 'Finn', 'Greta'], 0],
        ['Studienfreunde', { kind: 'global' }, ['Clara', 'Jonas', 'Katharina', 'Leo'], 2],
        ['Uno-Abend', { kind: 'game', game: 'Uno' }, ['Ben', 'Hanna', 'Ilias'], 4],
        ['Büro-Mittagspause', { kind: 'global', noCatan: true }, ['David', 'Mia', 'Noah'], 6],
        ['Doppelkopf-Runde', { kind: 'game', game: 'Doppelkopf' }, ['Oskar', 'Paula', 'Jonas', 'Anna'], 1],
        ['Kinder', { kind: 'game', game: 'Uno' }, ['Finn', 'Greta'], 3],
        ['Großfamilie Weihnachten', { kind: 'global' }, ['Mama', 'Papa', 'Oma Hildegard', 'Opa', 'Anna', 'Ben', 'Eva', 'Finn', 'Greta', 'Hanna', 'Leo', 'Mia'], 0],
      ];
      const DATA_SETS = {
        full: { names: NAMES, groups: GROUP_DEFS },
        many: {
          names: NAMES,
          groups: [
            ...GROUP_DEFS,
            ['Spieletreff Mittwoch', { kind: 'global' }, ['Anna', 'Hanna', 'Ilias', 'Noah', 'Ben', 'Mia', 'Leo'], 3],
            ['Pärchenabend', { kind: 'game', game: 'Catan' }, ['Anna', 'Jonas', 'Clara', 'Leo'], 1],
            ['Urlaub Ostsee 2026', { kind: 'global' }, ['Anna', 'Ben', 'Clara', 'David', 'Eva', 'Finn', 'Jonas', 'Katharina'], 5],
            ['Wizard-Runde', { kind: 'game', game: 'Wizard' }, ['Anna', 'Ben', 'Oskar', 'Paula', 'David'], 2],
            ['Nachbarn', { kind: 'global', noCatan: true }, ['Anna', 'Eva', 'Mama', 'Papa'], 7],
            // Ben plays everywhere: 14 more tables, so he sits at 20.
            ...[
              ['Skat-Treff', { kind: 'game', game: 'Skat' }, ['Ben', 'Oskar', 'Noah']],
              ['Schach-Club', { kind: 'game', game: 'Schach' }, ['Ben', 'Leo']],
              ['Kniffel-Abend', { kind: 'game', game: 'Kniffel' }, ['Ben', 'Mia', 'Paula', 'Eva']],
              ['Catan-Liga', { kind: 'game', game: 'Catan' }, ['Ben', 'Jonas', 'Katharina', 'Hanna']],
              ['Fußballverein Spieleabend', { kind: 'global' }, ['Ben', 'David', 'Ilias', 'Noah', 'Leo', 'Finn']],
              ['Wichteln 2026', { kind: 'global' }, ['Ben', 'Clara', 'Greta']],
              ['Sonntagsfrühstück', { kind: 'global', noCatan: true }, ['Ben', 'Mama', 'Papa']],
              ['Azul-Runde', { kind: 'game', game: 'Azul' }, ['Ben', 'Clara', 'Hanna', 'Mia']],
              ['Hüttenwochenende', { kind: 'global' }, ['Ben', 'Eva', 'Finn', 'Jonas', 'Katharina', 'Oskar', 'Paula']],
              ['Mau-Mau mit Opa', { kind: 'game', game: 'Mau-Mau' }, ['Ben', 'Opa']],
              ['Brettspielcafé', { kind: 'global' }, ['Ben', 'Ilias', 'Mia', 'Noah']],
              ['Silvester', { kind: 'global' }, ['Ben', 'Greta', 'Clara', 'David', 'Eva']],
              ['Werwolf-Nacht', { kind: 'global', noCatan: true }, ['Ben', 'Greta', 'Hanna', 'Leo', 'Paula', 'Oskar', 'Jonas', 'Mia']],
              ['Rommé bei Oma', { kind: 'game', game: 'Rommé' }, ['Ben', 'Oma Hildegard', 'Opa']],
            ].map(([n, b, m], i) => [n, b, m, i]),
          ],
        },
        few: { names: ['Anna', 'Ben', 'Clara'], groups: [['Freitagsrunde', { kind: 'game', game: 'Catan' }, ['Anna', 'Ben'], 0]] },
        empty: { names: [], groups: [] },
      };
      function hasCatanColors(b, n) {
        return b.kind === 'game' ? b.game === 'Catan' : !b.noCatan && n <= 4;
      }
      function buildData(key) {
        const set = DATA_SETS[key];
        const persons = set.names.map((name, i) => ({ id: 'p' + i, name }));
        const byName = Object.fromEntries(persons.map((p) => [p.name, p]));
        const groups = set.groups.map(([name, binding, members, offset], gi) => {
          const catan = hasCatanColors(binding, members.length);
          const catanOnly = binding.kind === 'game' && binding.game === 'Catan';
          return {
            id: 'g' + gi, name, binding, catan,
            members: members.map((m, i) => {
              const cc = catan ? CATAN_ORDER[(i + offset) % 4] : null;
              return { pid: byName[m].id, gc: catanOnly ? cc : ORDER[(i + offset) % 12], cc };
            }),
          };
        });
        return { persons, groups };
      }
      function bindingShort(g) {
        if (g.binding.kind === 'game') return g.binding.game;
        return g.binding.noCatan ? 'Alle Spiele ohne Catan' : 'Alle Spiele';
      }
      function colorText(g, m) {
        return COLOR_NAME[m.gc];
      }

      // ---------- state ----------
      const state = {
        list: 'L1',
        detail: 'D9',
        table: 'T7',
        tableTab: 'members',
        frame: 'phoneP',
        lastFrame: 'phoneP',
        data: 'full',
        later: false,
        screen: 'personen',
        stack: ['verwaltung'],
        search: false,
        q: '',
        adding: false,
        flipped: false,
        expanded: null,
      };
