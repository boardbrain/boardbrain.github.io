/*
 * Design tokens (Architecture 13.4, ADR-018). The only file with colour values (NFA-GB-05).
 * Colour values from design D-1 (OP-11, E-26). Contrast on every surface of every design:
 * text at least 4.5:1, Catan and group colours at least 3:1.
 */
:root {
  color-scheme: dark;

  /* Catan colours (Specification 3.3): the same in every design */
  --color-catan-red: #ef5359;
  --color-catan-blue: #4189f5;
  --color-catan-white: #f1f1f4;
  --color-catan-orange: #f5852b;

  /* Group colours (Specification 3.3, E-50): 12 colours; red, orange, blue, white = Catan tones (FA-PG-07) */
  --color-group-red: var(--color-catan-red);
  --color-group-orange: var(--color-catan-orange);
  --color-group-yellow: #e6cb72;
  --color-group-green: #8fb35a;
  --color-group-teal: #5fbfb2;
  --color-group-blue: var(--color-catan-blue);
  --color-group-indigo: #9873e8;
  --color-group-pink: #fbb1c6;
  --color-group-magenta: #f77de2;
  --color-group-brown: #94643f;
  --color-group-gray: #9aa1ab;
  --color-group-white: var(--color-catan-white);

  /* Board (US-PL-01, design I1-D, docs/design/i1d-board-final-preview.html): the same in every design */
  --color-board-sea: #1c4a5c;
  --color-board-sea-deep: #123241;
  --color-board-shallow: #2f7480;
  --color-board-wave: #e8f3ef33;
  --color-board-sand: #d9b77e;
  --color-board-wood-top: #b48a5a;
  --color-board-wood-bottom: #93683c;
  --color-board-wood-edge: #d0a877;
  --color-board-highlight: #ffffff2e;
  --color-board-hint: #123241d9;

  /* Pieces on the board and in symbols (US-PL-04 AK-3, design I2-C, G1, R1): dark outline */
  --color-piece-outline: #231d18;

  /* Marked pieces while repeating one is asked (US-AB-03 AK-8, design I2-H, M1): the gold of the app */
  --color-piece-mark: #f5be5b;

  /* Highlighting and tension mode of the placement (design D-2): the dark laid over the board
     (55 % in the style sheet), the bright centre of a dot, the golden switch with its glow */
  --color-board-dark: #0d0a08;
  --color-highlight-core: #fff;
  --color-tension-on: #f5be5b;

  --color-on-catan-strong: #fff;
  --color-band-shade: #231d18cc;
  --color-catan-red-band-light: color-mix(in srgb, var(--color-catan-red) 92%, #fff);
  --color-catan-red-band-dark: color-mix(in srgb, var(--color-catan-red) 75%, #000);
  --color-catan-blue-band-light: color-mix(in srgb, var(--color-catan-blue) 92%, #fff);
  --color-catan-blue-band-dark: color-mix(in srgb, var(--color-catan-blue) 75%, #000);
  --color-catan-white-band-light: color-mix(in srgb, var(--color-catan-white) 92%, #fff);
  --color-catan-white-band-dark: color-mix(in srgb, var(--color-catan-white) 75%, #000);
  --color-catan-orange-band-light: color-mix(in srgb, var(--color-catan-orange) 92%, #fff);
  --color-catan-orange-band-dark: color-mix(in srgb, var(--color-catan-orange) 75%, #000);

  /* Resources (US-SR-01 AK-5, design I2-C): discs of the resource symbols */

  --color-resource-brick: #d0714a;

  /* Design I3-B: the light centre behind the first letter of a custom game. */

  /* Destructive action, e.g. "Beenden" (design I2-C) */

  --color-accent-blue: #2563eb;

  --color-resume: color-mix(in srgb, var(--color-group-green) 70%, #000);
  --color-clock-played: color-mix(in srgb, var(--color-accent) 75%, transparent);
  --color-clock-now: color-mix(in srgb, var(--color-accent-text) 30%, transparent);

  /* Home screen icon of the local acceptance app (build mode "acceptance", E-40): violet instead of
     wood and amber, so it can be told apart from the published app; only read by npm run icons */
  --color-acceptance-icon-surface: #211a2e;
  --color-acceptance-icon-raised: #2c2340;
  --color-acceptance-icon-overlay: #3a2e52;
  --color-acceptance-icon-glow: #5a3a8c;
  --color-acceptance-icon-accent: #c4a0ff;

  /* States */
  --color-status-ok: #4ade80;
  --color-status-error: #fc8585;
  --color-status-warning: #fbbf24;
  --color-status-info: #60a5fa;

  /* Typography */
  --font-family-base: system-ui, -apple-system, 'Segoe UI', roboto, sans-serif;
  --font-family-mono: ui-monospace, 'Cascadia Mono', consolas, monospace;
  --font-size-tiny: 0.75rem;
  --font-size-small: 0.875rem;
  --font-size-base: 1rem;
  --font-size-title: 1.5rem;
  --line-height-base: 1.5;

  /* Spacing and radii */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-6: 1.5rem;
  --radius-2: 0.5rem;
  --radius-4: 1rem;
  --touch-target-min: 44px;

  /* Page layout (design I2-G): every view but the start has the same width, padding and head
     height, so the back button sits in the same place on every page. */
  --page-max-width: 80rem;
  --page-padding-top: 20px;
  --page-padding-side: 16px;
  --page-head-height: 52px;

  /* Durations and easings for Motion (Architecture 13.6) */
  --duration-fast: 150ms;
  --duration-base: 250ms;
  --easing-standard: cubic-bezier(0.2, 0, 0, 1);

  /* Pressed state (K-4, NFA-GB-04): cards rise and darken, controls shimmer in their text colour */
  --press-lift: -3px;
  --press-darken: 0.15;
  --press-shimmer: 16%;

/*
 * Designs (NFA-GB-02, NFA-GB-03): surfaces, text, background and default accent.
 * "Holz" is the default; switching via data-theme follows with US-GB-01.
 */
:root,
:root[data-theme='wood'] {
  --color-surface: #231d18;
  --color-surface-raised: #2d2620;
  --color-surface-overlay: #383028;
  --color-border: #4b4036;
  --color-text: #f4ece1;
  --color-text-muted: #b8ab9b;
  --background-image: radial-gradient(ellipse at 50% -10%, #4a3420 0%, transparent 60%);
  --color-accent: var(--color-accent-amber);
  --color-accent-text: var(--color-accent-amber-text);
}

:root[data-theme='ocean'] {
  --color-surface: #10232c;
  --color-surface-raised: #17303b;
  --color-surface-overlay: #1f3c49;
  --color-border: #2d5262;
  --color-text: #e6f4f7;
  --color-text-muted: #98b8c2;
  --background-image: linear-gradient(180deg, #17404e 0%, #10232c 45%);
  --color-accent: var(--color-accent-teal);
  --color-accent-text: var(--color-accent-teal-text);
}

:root[data-theme='forest'] {
  --color-surface: #1b221e;
  --color-surface-raised: #232c27;
  --color-surface-overlay: #2c3731;
  --color-border: #3b4941;
  --color-text: #e9f0ea;
  --color-text-muted: #a5b4aa;
  --background-image: none;
  --color-accent: var(--color-accent-green);
  --color-accent-text: var(--color-accent-green-text);
}

/* Glass: frosted surfaces over a colour gradient; the blur costs performance on older devices. */
:root[data-theme='glass'] {
  --color-surface: #161a2e;
  --color-surface-raised: #232845;
  --color-surface-overlay: #2b3152;
  --color-border: #ffffff26;
  --color-text: #f1f2fa;
  --color-text-muted: #aeb3cf;
  --background-image:
    radial-gradient(circle at 15% 5%, #4338ca80 0%, transparent 40%),
    radial-gradient(circle at 90% 35%, #0e749080 0%, transparent 40%),
    radial-gradient(circle at 40% 100%, #9d174d66 0%, transparent 45%);
  --color-accent: var(--color-accent-indigo);
  --color-accent-text: var(--color-accent-indigo-text);
}

/* Chosen accent overrides the default accent of the design (US-GB-01). */
:root[data-accent='indigo'] {
  --color-accent: var(--color-accent-indigo);
  --color-accent-text: var(--color-accent-indigo-text);
}

:root[data-accent='blue'] {
  --color-accent: var(--color-accent-blue);
  --color-accent-text: var(--color-accent-blue-text);
}

:root[data-accent='teal'] {
  --color-accent: var(--color-accent-teal);
  --color-accent-text: var(--color-accent-teal-text);

:root[data-accent='green'] {

      function summary() {
        const lines = [
          `Personenkarten: ${layout()} ${LAYOUTS[layout()].title}${state.layout ? '' : ' (Empfehlung, nicht gewählt)'}`,
          `Spalten: ${columns()} ${COLUMNS[columns()].title} (${COLUMNS[columns()].text})${state.columns ? '' : ' (Empfehlung, nicht gewählt)'}`,
        ];
        const note = document.getElementById('note')?.value.trim();
        return [...lines, ...(note ? [note] : [])].join('\n');
      }
      function nav() {
        const back = STEP > 1 ? h('a', { class: 'secondary', href: FILES[STEP - 2] }, '‹ Zurück') : h('a', { class: 'secondary', href: 'uebersicht-preview.html' }, '‹ Übersicht');
        const next = STEP < 3 ? h('a', { class: 'primary', href: FILES[STEP] }, 'Weiter ›') : h('a', { class: 'secondary', href: 'uebersicht-preview.html' }, 'Übersicht');
        return h('div', { class: 'guideNav' }, back, next);
      }
      function render() {
        const picker = document.getElementById('picker');
        const stage = document.getElementById('stage');
        if (STEP === 0) {
          picker.replaceChildren(h('div', { class: 'guideBox' },
            h('h1', {}, 'Personenkarten K3 Spielkarte (final)'),
            h('p', { class: 'small muted' }, 'Abgenommen am 22.11.2026: großer Buchstabe und Name in der Mitte, Farbpunkte und Tische unten, Größen wachsen mit der Karte. Spalten wie bisher: Handy 3, iPad hoch 5, iPad quer 7.')));
          stage.replaceChildren(h('div', { class: 'figures' }, DEVICES.map(([id, , , caption]) => h('figure', {}, screen('K3', 'S0', id), h('figcaption', { class: 'small' }, caption)))));
        } else if (STEP === 1) {
          picker.replaceChildren(guideHead(),
            h('div', { class: 'guideBox' },
              h('h1', {}, 'Wie sollen die Personenkarten aufgebaut sein?'),
              h('p', { class: 'small muted' }, 'Auf dem iPad sitzt der Inhalt heute klein oben auf großen Karten. Gleiche Personen, gleiche Daten wie in der App.'),
              options(LAYOUTS, layout(), REC_LAYOUT, (k) => update({ layout: k }))),
            deviceChips(),
            chips('Vergleich', [['one', 'nur gewählte'], ['all', 'alle fünf']], state.all ? 'all' : 'one', (k) => update({ all: k === 'all' })));
          const shown = state.all ? Object.keys(LAYOUTS) : [layout()];
          stage.replaceChildren(h('div', { class: 'figures' }, shown.map((k) => h('figure', { class: k === layout() && state.all ? 'on' : '' },
            screen(k, columns(), state.device), state.all ? h('figcaption', { class: 'small' }, `${k} ${LAYOUTS[k].title}`) : ''))), nav());
        } else if (STEP === 2) {
          picker.replaceChildren(guideHead(),
            h('div', { class: 'guideBox' },
              h('h1', {}, 'Wie viele Karten nebeneinander?'),
              h('p', { class: 'small muted' }, `Mit deinem Aufbau ${layout()} ${LAYOUTS[layout()].title}. Weniger Spalten = größere Karten. Am Handy bleiben es 3.`),
              options(COLUMNS, columns(), REC_COLUMNS, (k) => update({ columns: k }))),
            deviceChips(),
            chips('Vergleich', [['one', 'nur gewählte'], ['all', 'alle drei']], state.all ? 'all' : 'one', (k) => update({ all: k === 'all' })));
          const shown = state.all ? Object.keys(COLUMNS) : [columns()];
          stage.replaceChildren(h('div', { class: 'figures' }, shown.map((k) => h('figure', { class: k === columns() && state.all ? 'on' : '' },
            screen(layout(), k, state.device), state.all ? h('figcaption', { class: 'small' }, `${k} ${COLUMNS[k].title}`) : ''))), nav());
        } else {
          picker.replaceChildren(guideHead(),
            h('div', { class: 'guideBox' },
              h('h1', {}, 'Deine Auswahl'),
              h('p', { class: 'small muted' }, `${layout()} ${LAYOUTS[layout()].title} · ${columns()} ${COLUMNS[columns()].title}. Unten auf allen vier Geräten.`)));
          const out = h('pre', { class: 'copy' }, summary());
          const copy = h('button', { class: 'primary', onclick: async () => {
            try {
              await navigator.clipboard.writeText(summary());
              copy.textContent = 'Kopiert';
            } catch {
              copy.textContent = 'Bitte von Hand kopieren';
            }
          } }, 'Antwort kopieren');
          stage.replaceChildren(
            h('h2', {}, 'Deine Antwort'), out,
            h('label', { class: 'small muted', for: 'note' }, 'Anmerkungen (optional)'),
            h('textarea', { id: 'note', oninput: () => { out.textContent = summary(); } }),
            copy,
            h('div', { class: 'figures' }, DEVICES.map(([id, , , caption]) => h('figure', {}, screen(layout(), columns(), id), h('figcaption', { class: 'small' }, caption)))),
            nav());
        }
        requestAnimationFrame(scaleAll);
      }
      render();

    </script>
  </body>
</html>
