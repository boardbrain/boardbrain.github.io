<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>I1-F Bearbeiten</title>
    <style>
      :root {
        --bg: #231d18;
        --raised: #2d2620;
        --overlay: #383028;
        --border: #4b4036;
        --text: #f4ece1;
        --muted: #b8ab9b;
        --accent: #b45309;
        --accent-text: #f5be5b;
        --on-accent: #fff;
        --shadow: #0000008c;
        --backdrop: #000000b3;
        --bg-image: radial-gradient(ellipse at 50% -10%, #4a3420 0%, transparent 60%);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg-image) fixed, var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', roboto, sans-serif;
        line-height: 1.5;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: none;
        border: 0;
        padding: 0;
        text-align: inherit;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.25;
      }
      h2 {
        font-size: 1rem;
      }

      /* ---------- picker ---------- */
      .picker {
        display: grid;
        gap: 8px;
        padding: 10px 16px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }
      .picker .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .picker .label {
        min-width: 80px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .chip {
        min-height: 36px;
        padding: 6px 12px;
        font-size: 0.9rem;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .chip[aria-pressed='true'] {
        font-weight: 600;
        color: var(--accent-text);
        background: var(--overlay);
        border-color: var(--accent-text);
      }
      .intro {
        display: grid;
        gap: 4px;
        max-width: 1220px;
        margin: 0 auto;
        padding: 12px 16px 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .intro b {
        color: var(--text);
      }
      .stage {
        padding: 16px;
      }

      /* ---------- device frames ---------- */
      .frame {
        position: relative;
        display: flex;
        flex-direction: column;
        margin: 0 auto;
        overflow: hidden;
        background: var(--bg-image), var(--bg);
        border: 1px dashed var(--border);
        border-radius: 24px;
      }
      .frame.phoneP {
        width: min(100%, 390px);
        height: 780px;
      }
      .frame.tabletP {
        width: min(100%, 780px);
        height: 1020px;
      }
      .frame.wide {
        width: min(100%, 1180px);
        height: 760px;
      }
      .frame.device {
        position: fixed;
        inset: 0;
        z-index: 50;
        width: auto;
        height: auto;
        border: 0;
        border-radius: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      .exit {
        position: absolute;
        top: 50%;
        left: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        width: 28px;
        height: 56px;
        color: var(--muted);
        background: var(--overlay);
        border: 1px solid var(--border);
        border-left: 0;
        border-radius: 0 12px 12px 0;
        opacity: 0.8;
      }

      /* ---------- app frame (D-3) ---------- */
      .app {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .a-head {
        display: flex;
        justify-content: center;
        padding: 10px 14px;
      }
      .logo {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .logo svg {
        color: var(--accent-text);
      }
      .scroll {
        flex: 1;
        min-height: 0;
        min-width: 0;
        overflow-y: auto;
        scrollbar-width: none;
      }
      .scroll::-webkit-scrollbar {
        display: none;
      }
      .pad {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
        align-content: start;
        padding: 20px 16px 28px;
      }
      .wideContent {
        width: 100%;
        max-width: 1040px;
        margin: 0 auto;
      }
      .e-hand {
        position: relative;
        z-index: 3;
        display: flex;
        flex: none;
        justify-content: center;
        height: 104px;
        background: linear-gradient(180deg, transparent, var(--raised));
      }
      .e-navCard {
        position: relative;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2px;
        width: 86px;
        height: 104px;
        margin: 0 -8px;
        font-size: 0.7rem;
        text-align: center;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 -4px 12px var(--shadow);
        transform-origin: 50% 140%;
      }
      .e-navCard[aria-current='page'] {
        z-index: 2;
        color: var(--accent-text);
        font-weight: 700;
        border-color: var(--accent-text);
      }
      .e-card {
        position: relative;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 6px;
        aspect-ratio: 5 / 7;
        padding: 18px 10px;
        text-align: center;
        background: linear-gradient(160deg, var(--overlay), var(--raised));
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 6px 18px var(--shadow);
      }
      .corner {
        position: absolute;
        top: 8px;
        left: 10px;
        font-weight: 800;
        line-height: 1;
        color: var(--accent-text);
      }
      .corner.br {
        top: auto;
        right: 10px;
        bottom: 8px;
        left: auto;
        transform: rotate(180deg);
      }

      /* ---------- shared pieces ---------- */
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 0.85rem;
      }
      .tiny {
        font-size: 0.75rem;
      }
      .accentText {
        color: var(--accent-text);
      }
      .ellipsis {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .iconBtn {
        display: grid;
        flex: none;
        place-items: center;
        width: 44px;
        height: 44px;
        color: var(--text);
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 50%;
      }
      .primary {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 8px 16px;
        font-weight: 600;
        color: var(--on-accent);
        background: var(--accent);
        border-radius: 8px;
      }
      .card {
        padding: 14px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .pageHead {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .pageHead h1 {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .fieldRow {
        display: flex;
        gap: 8px;
      }
      .field {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 0 12px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .chev {
        flex: none;
        color: var(--muted);
      }
      .listCard {
        overflow: hidden;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .listRow {
        display: flex;
        gap: 12px;
        align-items: center;
        width: 100%;
        min-height: 56px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
      }
      .listRow:last-child {
        border-bottom: 0;
      }
      .rowText {
        display: grid;
        flex: 1;
        min-width: 0;
      }
      .rowText > * {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .initial {
        display: inline-grid;
        flex: none;
        place-items: center;
        width: 36px;
        height: 36px;
        font-weight: 700;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 50%;
      }
      .dot {
        display: inline-block;
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .dots {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: center;
      }
      .moreDots {
        font-size: 0.68rem;
        font-weight: 700;
        line-height: 10px;
        color: var(--muted);
      }
      .mt {
        position: relative;
        flex: none;
      }
      .mt-top {
        position: absolute;
        inset: 22%;
        background: var(--overlay);
        border: 2px solid var(--border);
        border-radius: 50%;
      }
      .mt-seat {
        position: absolute;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .mt-seat.hl {
        z-index: 1;
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
      .mt-seat.dim {
        opacity: 0.3;
      }
      .sectionHead {
        display: flex;
        gap: 8px;
        align-items: baseline;
        justify-content: space-between;
      }

      /* ---------- L1 Spielkarten ---------- */
      .cardGrid {
        display: grid;
        gap: 12px;
      }
      .pCard {
        gap: 3px;
        align-content: start;
        padding: 14px 8px 24px;
      }
      .pCard .ini {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        margin-top: 6px;
        font-size: 1rem;
        font-weight: 800;
        color: var(--accent-text);
        border: 2px solid var(--accent-text);
        border-radius: 50%;
      }
      .pCard.none .ini {
        color: var(--muted);
        border-style: dashed;
        border-color: var(--muted);
      }
      .pCard .nm {
        font-size: 0.85rem;
        font-weight: 700;
        line-height: 1.2;
      }
      .newCard {
        color: var(--accent-text);
        background: none;
        border: 1px dashed var(--accent-text);
        box-shadow: none;
      }

      /* ---------- L2 Spielfiguren ---------- */
      .board {
        display: grid;
        gap: 18px 6px;
        padding: 18px 10px;
        background:
          repeating-linear-gradient(0deg, transparent 0 39px, #ffffff08 39px 40px),
          repeating-linear-gradient(90deg, transparent 0 39px, #ffffff08 39px 40px),
          var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .fig {
        display: grid;
        gap: 2px;
        justify-items: center;
        min-width: 0;
      }
      .fig .meeple {
        color: var(--overlay);
        filter: drop-shadow(0 4px 4px var(--shadow));
      }
      .fig .meeple path {
        fill: var(--overlay);
        stroke: var(--accent-text);
        stroke-width: 1.2;
      }
      .fig.none .meeple path {
        fill: none;
        stroke: var(--muted);
        stroke-dasharray: 2 2;
      }
      .fig .base {
        display: flex;
        align-items: center;
        max-width: 100%;
        gap: 2px;
        min-height: 8px;
        margin-top: -4px;
      }
      .fig .base .dot {
        width: 8px;
        height: 8px;
      }
      .fig .nm {
        max-width: 100%;
        overflow: hidden;
        font-size: 0.8rem;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .figIni {
        position: relative;
        display: grid;
        place-items: center;
      }
      .figIni span {
        position: absolute;
        top: 46%;
        font-size: 0.8rem;
        font-weight: 800;
        color: var(--accent-text);
        transform: translateY(-50%);
      }
      .fig.none .figIni span {
        color: var(--muted);
      }

      /* ---------- L3 Karteikasten ---------- */
      .register {
        position: relative;
        display: grid;
        gap: 14px;
        padding-right: 30px;
      }
      .letter {
        display: grid;
        place-items: center;
        width: 34px;
        height: 30px;
        font-weight: 800;
        color: var(--bg);
        background: var(--accent-text);
        border-radius: 8px 8px 0 0;
      }
      .regBox {
        display: grid;
      }
      .regBox .listCard {
        border-top-left-radius: 0;
      }
      .rail {
        position: absolute;
        top: 0;
        right: 0;
        display: grid;
        gap: 0;
        font-size: 0.7rem;
        font-weight: 700;
        text-align: center;
      }
      .rail button {
        display: grid;
        place-items: center;
        width: 24px;
        height: 22px;
        color: var(--accent-text);
      }
      .rail button[disabled] {
        color: var(--border);
        cursor: default;
      }

      /* ---------- L4 Spielsteine ---------- */
      .tokens {
        display: grid;
        gap: 16px 8px;
      }
      .token {
        display: grid;
        gap: 4px;
        justify-items: center;
        min-width: 0;
      }
      .tokenDisc {
        display: grid;
        place-items: center;
        width: 60px;
        height: 60px;
        padding: 5px;
        border-radius: 50%;
      }
      .tokenDisc span {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        font-size: 1.2rem;
        font-weight: 800;
        background: radial-gradient(circle at 35% 30%, var(--overlay), var(--raised));
        border-radius: 50%;
        box-shadow: inset 0 -3px 6px var(--shadow);
      }
      .token.none .tokenDisc {
        border: 2px dashed var(--border);
      }
      .token .nm {
        font-size: 0.8rem;
        font-weight: 600;
      }

      /* ---------- L5 Spielblock ---------- */
      .pad5 {
        overflow: hidden;
        color: #2b2219;
        background: #f3e9d2;
        border-radius: 6px;
        box-shadow: 0 8px 20px var(--shadow);
      }
      .pad5Head {
        padding: 8px 12px;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-align: center;
        text-transform: uppercase;
        color: #f3e9d2;
        background: #8a3b12;
      }
      .pad5Scroll {
        overflow-x: auto;
        scrollbar-width: none;
        mask-image: linear-gradient(90deg, #000 88%, transparent);
      }
      .pad5Scroll::-webkit-scrollbar {
        display: none;
      }
      .pad5 table {
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      .pad5 th,
      .pad5 td {
        height: 40px;
        padding: 0 6px;
        text-align: center;
        border-right: 1px solid #c9b48c;
        border-bottom: 1px solid #c9b48c;
      }
      .pad5 th.nameCol,
      .pad5 td.nameCol {
        position: sticky;
        left: 0;
        z-index: 1;
        min-width: 110px;
        max-width: 130px;
        padding: 0 10px;
        overflow: hidden;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
        background: #f3e9d2;
        border-right: 2px solid #8a3b12;
      }
      .pad5 td.nameCol button {
        width: 100%;
        min-height: 40px;
        font-weight: 700;
        text-align: left;
      }
      .pad5 th.tbl {
        height: 112px;
        min-width: 38px;
        vertical-align: bottom;
        padding-bottom: 6px;
      }
      .pad5 th.tbl span {
        display: inline-block;
        font-size: 0.75rem;
        white-space: nowrap;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
      }
      .pad5 .cellDot {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #2b2219;
        border-radius: 50%;
      }
      .pad5 .sum {
        font-weight: 800;
        color: #8a3b12;
      }

      /* ---------- L6 Namenschips ---------- */
      .chipCloud {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .nChip {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        min-height: 44px;
        padding: 4px 14px 4px 6px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .nChip .initial {
        width: 32px;
        height: 32px;
        font-size: 0.85rem;
      }
      .nChip.none {
        padding-left: 14px;
        background: none;
        border-style: dashed;
      }

      /* ---------- D1 Spielerpass ---------- */
      .pass {
        position: relative;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 14px;
        align-items: center;
        width: min(100%, 420px);
        aspect-ratio: 85.6 / 54;
        margin: 0 auto;
        padding: 18px;
        overflow: hidden;
        background:
          repeating-linear-gradient(135deg, #ffffff06 0 8px, transparent 8px 16px),
          linear-gradient(160deg, var(--overlay), var(--raised));
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 24px var(--shadow);
      }
      .passTop {
        position: absolute;
        top: 12px;
        right: 16px;
        left: 16px;
        display: flex;
        justify-content: space-between;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent-text);
      }
      .passPhoto {
        display: grid;
        place-items: center;
        width: 84px;
        height: 104px;
        margin-top: 14px;
        font-size: 2.4rem;
        font-weight: 800;
        color: var(--accent-text);
        background: var(--bg);
        border: 2px solid var(--border);
        border-radius: 10px;
      }
      .passName {
        font-size: 1.35rem;
        font-weight: 800;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }
      .stamps {
        display: grid;
        gap: 14px;
      }
      .stamp {
        display: grid;
        gap: 2px;
        justify-items: center;
        padding: 12px 6px;
        text-align: center;
        border: 2px dashed var(--accent-text);
        border-radius: 14px;
      }
      .stamp strong {
        color: var(--accent-text);
      }

      /* ---------- D2 Netz ---------- */
      .net {
        position: relative;
        margin: 0 auto;
      }
      .net svg.lines {
        position: absolute;
        inset: 0;
      }
      .netHub {
        position: absolute;
        top: 50%;
        left: 50%;
        display: grid;
        place-items: center;
        width: 96px;
        height: 96px;
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--accent-text);
        background: radial-gradient(circle at 35% 30%, var(--overlay), var(--raised));
        border: 3px solid var(--accent-text);
        border-radius: 50%;
        box-shadow: 0 8px 20px var(--shadow);
        transform: translate(-50%, -50%);
      }
      .netNode {
        position: absolute;
        display: grid;
        gap: 2px;
        justify-items: center;
        width: 110px;
        text-align: center;
        transform: translate(-50%, -50%);
      }
      .netNode strong {
        max-width: 100%;
        overflow: hidden;
        font-size: 0.8rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ---------- D3 Blatt ---------- */
      .sheetBackdrop {
        position: absolute;
        inset: 0;
        z-index: 4;
        background: var(--backdrop);
      }
      .sheet {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 5;
        display: grid;
        gap: 16px;
        align-content: start;
        max-height: 78%;
        padding: 10px 16px 24px;
        overflow-y: auto;
        background: var(--raised);
        border: 1px solid var(--border);
        border-bottom: 0;
        border-radius: 22px 22px 0 0;
        box-shadow: 0 -10px 30px var(--shadow);
        scrollbar-width: none;
      }
      .sheet.side {
        top: 0;
        bottom: 0;
        left: auto;
        width: 420px;
        max-height: none;
        padding-top: 20px;
        border-bottom: 1px solid var(--border);
        border-radius: 22px 0 0 22px;
      }
      .grip {
        justify-self: center;
        width: 44px;
        height: 5px;
        background: var(--border);
        border-radius: 999px;
      }

      /* ---------- D4 Steckbrief ---------- */
      .hero {
        display: grid;
        gap: 8px;
        justify-items: center;
        padding: 24px 16px 18px;
        text-align: center;
        background:
          radial-gradient(circle at 50% 0%, #f5be5b22, transparent 70%),
          var(--raised);
        border: 1px solid var(--border);
        border-radius: 20px;
      }
      .hero .big {
        display: grid;
        place-items: center;
        width: 88px;
        height: 88px;
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--accent-text);
        background: var(--bg);
        border: 3px solid var(--accent-text);
        border-radius: 50%;
      }
      .statRow {
        display: grid;
        grid-auto-columns: 1fr;
        grid-auto-flow: column;
        gap: 8px;
        width: 100%;
        max-width: 360px;
      }
      .stat {
        display: grid;
        padding: 8px 4px;
        background: var(--bg);
        border-radius: 12px;
      }
      .stat b {
        font-size: 1.2rem;
        color: var(--accent-text);
      }
      .tabs {
        display: flex;
        gap: 4px;
        padding: 4px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .tab {
        flex: 1;
        min-height: 40px;
        font-size: 0.9rem;
        text-align: center;
        border-radius: 999px;
      }
      .tab[aria-selected='true'] {
        font-weight: 700;
        color: var(--on-accent);
        background: var(--accent);
      }
      .tab.ghost {
        color: var(--muted);
        opacity: 0.6;
      }

      /* ---------- D5 Kartenrückseite ---------- */
      .flipWrap {
        width: min(78%, 300px);
        margin: 0 auto;
        perspective: 1200px;
      }
      .flipInner {
        position: relative;
        aspect-ratio: 5 / 7;
        transition: transform 700ms cubic-bezier(0.2, 0, 0, 1);
        transform-style: preserve-3d;
      }
      .flipInner.flipped {
        transform: rotateY(180deg);
      }
      /* Both faces keep the size of the card; content never makes the card longer. */
      .face {
        position: absolute;
        inset: 0;
        height: 100%;
        min-height: 0;
        aspect-ratio: auto;
        overflow: hidden;
        backface-visibility: hidden;
      }
      .backList {
        display: grid;
        gap: 6px;
        align-content: start;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: none;
        padding-bottom: 14px;
      }
      /* Only while more entries follow below: a soft edge and a hint; at the end both vanish. */
      .backList.moreBelow {
        mask-image: linear-gradient(180deg, #000 calc(100% - 40px), transparent);
      }
      .moreHint {
        position: absolute;
        bottom: 8px;
        left: 50%;
        z-index: 2;
        display: inline-flex;
        gap: 4px;
        align-items: center;
        min-height: 28px;
        padding: 2px 12px;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--accent-text);
        white-space: nowrap;
        background: var(--overlay);
        border: 1px solid var(--accent-text);
        border-radius: 999px;
        transform: translateX(-50%);
      }
      .moreHint[hidden] {
        display: none;
      }
      .backList::-webkit-scrollbar {
        display: none;
      }
      .backChips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-content: start;
      }
      .backChip {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        max-width: 100%;
        min-height: 36px;
        padding: 2px 10px;
        font-size: 0.8rem;
        font-weight: 600;
        background: var(--bg);
        border-radius: 999px;
      }
      .face.backFace {
        display: grid;
        gap: 8px;
        align-content: start;
        grid-template-rows: auto minmax(0, 1fr);
        padding: 30px 16px 32px;
        text-align: left;
        place-items: stretch;
        transform: rotateY(180deg);
      }
      .backRow {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        min-height: 48px;
        padding: 4px 8px;
        background: var(--bg);
        border-radius: 10px;
      }

      /* ---------- D6 Mitspieler ---------- */
      .withRow {
        display: grid;
        gap: 10px;
        padding: 14px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .withHead {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
      }
      .mates {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .mate {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        min-height: 40px;
        padding: 3px 12px 3px 3px;
        font-size: 0.85rem;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .mate .c {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        font-size: 0.8rem;
        font-weight: 800;
        color: var(--bg);
        border-radius: 50%;
      }
      .mate.me {
        font-weight: 700;
        border-color: var(--accent-text);
      }

      /* ---------- D7 Sammelkarte ---------- */
      .tcg {
        display: grid;
        gap: 10px;
        width: min(100%, 340px);
        margin: 0 auto;
        padding: 12px;
        background: linear-gradient(160deg, var(--accent-text), var(--accent));
        border-radius: 18px;
        box-shadow: 0 10px 24px var(--shadow);
      }
      .tcg > * {
        background: var(--raised);
      }
      .tcgHead {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        min-width: 0;
        padding: 6px 12px;
        font-size: 1.2rem;
        border-radius: 10px;
      }
      .tcgHp {
        display: grid;
        flex: none;
        place-items: center;
        align-content: center;
        width: 52px;
        height: 52px;
        font-size: 1.15rem;
        font-weight: 800;
        line-height: 1;
        color: var(--accent-text);
        border: 2px solid var(--accent-text);
        border-radius: 50%;
      }
      .tcgHp small {
        font-size: 0.55rem;
        font-weight: 600;
        color: var(--muted);
      }
      .tcgArt {
        display: grid;
        place-items: center;
        aspect-ratio: 4 / 3;
        background: repeating-conic-gradient(var(--overlay) 0 25%, var(--raised) 0 50%) 0 0 / 28px 28px;
        border: 3px solid var(--border);
        border-radius: 8px;
      }
      .tcgArt span {
        display: grid;
        place-items: center;
        width: 110px;
        height: 110px;
        font-size: 3.4rem;
        font-weight: 800;
        color: var(--accent-text);
        background: var(--bg);
        border: 3px solid var(--accent-text);
        border-radius: 50%;
        box-shadow: 0 8px 18px var(--shadow);
      }
      .tcgType {
        padding: 4px 12px;
        font-size: 0.8rem;
        font-style: italic;
        color: var(--muted);
        border-radius: 6px;
      }
      .tcgStats {
        display: grid;
        grid-auto-columns: 1fr;
        grid-auto-flow: column;
        gap: 6px;
        padding: 6px;
        border-radius: 10px;
      }
      .tcgStat {
        display: grid;
        justify-items: center;
        padding: 6px 2px;
        font-size: 0.72rem;
        color: var(--muted);
        background: var(--bg);
        border-radius: 8px;
      }
      .tcgStat b {
        font-size: 1.2rem;
        color: var(--accent-text);
      }
      .laterStat {
        opacity: 0.55;
        outline: 1px dashed var(--muted);
      }
      .tcgFlavor {
        position: relative;
        padding: 8px 12px;
        font-size: 0.85rem;
        font-style: italic;
        border-radius: 8px;
      }
      .linkBtn {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--accent-text);
      }

      /* ---------- D8 Quartett ---------- */
      .quartet {
        width: min(100%, 340px);
        margin: 0 auto;
        overflow: hidden;
        background: var(--raised);
        border: 2px solid var(--accent-text);
        border-radius: 16px;
        box-shadow: 0 10px 24px var(--shadow);
      }
      .qTop {
        position: relative;
        display: grid;
        gap: 6px;
        justify-items: center;
        padding: 18px 12px 12px;
        background: radial-gradient(circle at 50% 30%, #f5be5b33, transparent 70%), var(--overlay);
        border-bottom: 2px solid var(--accent-text);
      }
      .qCode {
        position: absolute;
        top: 8px;
        left: 10px;
        padding: 0 8px;
        font-size: 0.8rem;
        font-weight: 800;
        color: var(--bg);
        background: var(--accent-text);
        border-radius: 6px;
      }
      .qBig {
        display: grid;
        place-items: center;
        width: 84px;
        height: 84px;
        font-size: 2.4rem;
        font-weight: 800;
        color: var(--accent-text);
        background: var(--bg);
        border-radius: 50%;
      }
      .qName {
        font-size: 1.3rem;
      }
      .qRow {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
      }
      .qRow:nth-child(odd) {
        background: #ffffff06;
      }
      .qRow:last-child {
        border-bottom: 0;
      }
      .qRow strong {
        color: var(--accent-text);
      }
      .qRow.later {
        opacity: 0.55;
      }

      /* ---------- D9 Karte und Steckbrief ---------- */
      .factGrid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .factLine {
        display: inline-flex;
        gap: 6px;
        align-items: baseline;
        padding: 4px 10px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .factLine b {
        color: var(--accent-text);
      }

      /* ---------- D10 Kartenreihe ---------- */
      .cardRow {
        display: flex;
        gap: 10px;
        margin: 0 -16px;
        padding: 4px 16px 12px;
        overflow-x: auto;
        scrollbar-width: none;
        mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
      }
      .cardRow::-webkit-scrollbar {
        display: none;
      }
      .tCard {
        flex: none;
        width: 112px;
        gap: 4px;
        padding: 12px 6px;
      }
      .tCard strong {
        max-width: 100%;
        overflow-wrap: anywhere;
      }

      /* ---------- D11 Spielerbogen ---------- */
      .sheet5 {
        overflow: hidden;
        color: #2b2219;
        background: #f3e9d2;
        border-radius: 6px;
        box-shadow: 0 8px 20px var(--shadow);
      }
      .sheet5Body {
        display: grid;
        gap: 4px;
        padding: 12px 16px 16px;
      }
      .sheet5Label {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8a3b12;
      }
      .sheet5Name {
        display: grid;
        padding-bottom: 6px;
        border-bottom: 2px solid #8a3b12;
      }
      .sheet5Name strong {
        font-size: 1.6rem;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }
      .sheet5Fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(4rem, 1fr));
        gap: 8px;
        padding: 6px 0;
      }
      .field5 {
        display: grid;
        min-width: 0;
        padding: 6px;
        border: 1.5px solid #8a3b12;
        border-radius: 6px;
      }
      .field5 .sheet5Label {
        font-size: 0.62rem;
        letter-spacing: 0.03em;
      }
      .field5.later {
        border-style: dashed;
        opacity: 0.6;
      }
      .field5 strong {
        font-size: 1rem;
        white-space: nowrap;
      }
      .sheet5Row {
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 44px;
        color: #2b2219;
        border-bottom: 1px solid #c9b48c;
      }
      .sheet5Row .cellDot {
        display: inline-block;
        flex: none;
        width: 16px;
        height: 16px;
        border: 2px solid #2b2219;
        border-radius: 50%;
      }
      .sheet5Small {
        flex: none;
        font-size: 0.75rem;
        color: #6b5640;
      }
      .sheet5More {
        justify-self: center;
        min-height: 44px;
        font-weight: 700;
        color: #8a3b12;
      }

      /* ---------- round 3: table pages ---------- */
      .seatToken {
        display: inline-grid;
        flex: none;
        place-items: center;
        font-weight: 800;
        color: var(--bg);
        border-radius: 50%;
      }
      .bt {
        position: relative;
        flex: none;
        margin: 0 auto;
      }
      .bt-top {
        position: absolute;
        inset: 17%;
        display: grid;
        align-content: center;
        justify-items: center;
        padding: 8px;
        text-align: center;
        background: radial-gradient(circle at 40% 35%, var(--overlay), var(--raised));
        border: 6px solid var(--border);
        border-radius: 50%;
        box-shadow: inset 0 0.75rem 2.5rem -0.75rem var(--shadow);
      }
      .bt-seat {
        position: absolute;
        display: grid;
        place-items: center;
        font-weight: 800;
        color: var(--bg);
        border: 3px solid var(--bg);
        border-radius: 50%;
        box-shadow: 0 4px 12px var(--shadow);
        transform: translate(-50%, -50%);
      }
      .bt-name {
        position: absolute;
        max-width: 76px;
        padding: 0 6px;
        overflow: hidden;
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1.6;
        text-overflow: ellipsis;
        white-space: nowrap;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .twoCol {
        display: grid;
        gap: 24px;
        align-items: start;
      }
      .roomGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr));
        gap: 12px;
      }
      .tableCard {
        display: grid;
        gap: 4px;
        justify-items: center;
        align-content: start;
        padding: 16px 8px;
        text-align: center;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .tableCard.new {
        color: var(--accent-text);
        border: 1px dashed var(--accent-text);
      }
      .plusTable {
        display: grid;
        place-items: center;
        width: 96px;
        height: 96px;
        border: 2px dashed var(--accent-text);
        border-radius: 50%;
      }

      .winRow {
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 36px;
        padding: 0 14px;
      }
      .winTrack {
        flex: 1;
        height: 10px;
        overflow: hidden;
        background: var(--bg);
        border-radius: 999px;
      }
      .winBar {
        display: block;
        height: 100%;
        border-radius: 999px;
      }

      .cardTables {
        display: -webkit-box;
        max-width: 100%;
        overflow: hidden;
        font-size: 0.68rem;
        line-height: 1.25;
        color: var(--muted);
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow-wrap: anywhere;
      }

      /* Very narrow phones: one line of table names, so the corner number stays free. */
      @media (width < 370px) {
        .frame.device .cardTables {
          -webkit-line-clamp: 1;
          line-clamp: 1;
        }
      }

      /* later features */
      .ph {
        position: relative;
        opacity: 0.55;
        outline: 2px dashed var(--muted);
        outline-offset: 3px;
        border-radius: 14px;
      }
      .ph-tag {
        position: absolute;
        top: -10px;
        right: 8px;
        z-index: 2;
        padding: 0 7px;
        font-size: 0.68rem;
        font-weight: 600;
        line-height: 18px;
        color: var(--bg);
        background: var(--muted);
        border-radius: 999px;
        white-space: nowrap;
      }
      .ghostBtn {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        min-height: 44px;
        padding: 6px 14px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .spec {
        display: grid;
        gap: 6px;
        align-content: start;
      }
      .spec ul {
        display: grid;
        gap: 4px;
        margin: 0;
        padding-left: 18px;
      }

      /* ================= I1-F additions ================= */
      :root {
        --status-error: #fc8585;
        --status-warning: #fbbf24;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      .primary.block,
      .ghostBtn.block {
        justify-content: center;
        width: 100%;
      }
      .ghostBtn.danger {
        color: var(--status-error);
      }
      .btnRow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .btnRow > * {
        flex: 1 1 8rem;
        justify-content: center;
      }
      .lbl {
        font-weight: 700;
      }
      .notice {
        display: grid;
        gap: 8px;
        padding: 10px 14px;
        font-size: 0.9rem;
        background: var(--raised);
        border: 1px solid var(--border);
        border-left: 4px solid var(--status-error);
        border-radius: 8px;
      }
      .notice.warn {
        border-left-color: var(--status-warning);
      }
      .nameRow {
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      .iconBtn.sm {
        width: 36px;
        height: 36px;
        color: var(--accent-text);
      }
      .renCard {
        display: grid;
        gap: 10px;
      }
      .marked {
        outline: 2px solid var(--accent-text);
        outline-offset: 3px;
        border-radius: 10px;
      }
      .modalWrap {
        position: absolute;
        inset: 0;
        z-index: 8;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--backdrop);
      }
      .modal {
        display: grid;
        gap: 14px;
        width: min(100%, 400px);
        padding: 20px;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 30px var(--shadow);
      }
      .sheet .sheetHead {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }

      /* ---------- group editor as in the app (GroupEditor, GroupsView dialog) ---------- */
      .edBackdrop {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: flex;
        justify-content: center;
        overflow-y: auto;
        background: var(--bg);
        scrollbar-width: none;
      }
      .edDialog {
        width: 100%;
        max-width: 62rem;
        padding: 16px;
        background: var(--bg);
      }
      .edBackdrop.wideEd {
        align-items: flex-start;
        padding: 24px;
        background: var(--backdrop);
      }
      .wideEd .edDialog {
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .edHead {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
      }
      .wideEd .edHead {
        justify-content: space-between;
      }
      .wideEd .edHead .squareBtn {
        order: 2;
      }
      .edHead h2 {
        font-size: 1.5rem;
      }
      .wideEd .edHead h2 {
        font-size: 1.25rem;
      }
      .squareBtn {
        display: grid;
        flex: none;
        place-items: center;
        width: 44px;
        height: 44px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .edForm {
        display: grid;
        gap: 16px;
      }
      .edSection {
        display: grid;
        gap: 12px;
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      .edHeadRow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: baseline;
        justify-content: space-between;
      }
      .edColumns {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-start;
      }
      .edColumns > * {
        flex: 1 1 17.5rem;
        min-width: 0;
      }
      .edCard {
        display: grid;
        gap: 8px;
        padding: 12px 16px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .lockNote {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        font-size: 0.85rem;
        color: var(--muted);
        background: var(--raised);
        border: 1px dashed var(--border);
        border-radius: 8px;
      }
      .edTable {
        position: relative;
        width: 100%;
        max-width: 18rem;
        aspect-ratio: 1;
        margin: 8px auto;
      }
      .wideEd .edTable {
        max-width: 23.75rem;
      }
      .edTable .bt-top {
        inset: 17%;
      }
      .edSeat {
        position: absolute;
        display: grid;
        place-items: center;
        min-width: 44px;
        aspect-ratio: 1;
        font-weight: 800;
        color: var(--bg);
        border: 3px solid var(--bg);
        border-radius: 50%;
        box-shadow: 0 4px 12px var(--shadow);
        transform: translate(-50%, -50%);
      }
      .edSeat[aria-pressed='true'] {
        outline: 3px solid var(--text);
        outline-offset: 3px;
      }
      .edSeat .cMark {
        position: absolute;
        right: -6px;
        bottom: -6px;
        width: 42%;
        height: 42%;
        border: 3px solid var(--bg);
        border-radius: 6px;
      }
      .swRow {
        display: flex;
        gap: 8px;
        padding: 4px 2px 8px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .wideEd .swRow {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
        gap: 12px 8px;
        padding: 0;
      }
      .swItem {
        display: grid;
        flex: none;
        gap: 4px;
        justify-items: center;
      }
      .sw {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        font-size: 0.85rem;
        font-weight: 800;
        color: var(--bg);
        border: 2px solid var(--border);
        border-radius: 50%;
      }
      .sw.square {
        border-radius: 10px;
      }
      .sw[aria-pressed='true'] {
        outline: 3px solid var(--text);
        outline-offset: 2px;
      }
      .segment {
        display: grid;
        grid-auto-columns: minmax(0, 1fr);
        grid-auto-flow: column;
        gap: 4px;
        padding: 4px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .segment button {
        min-height: 44px;
        padding: 4px 8px;
        text-align: center;
        border-radius: 8px;
      }
      .segment .on {
        font-weight: 600;
        color: var(--on-accent);
        background: var(--accent);
      }
      .segment .more {
        font-weight: 600;
        color: var(--accent-text);
      }
      .gameList {
        display: grid;
        max-height: calc(4.75 * 3rem);
        overflow-y: auto;
        scrollbar-width: none;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .gameList button {
        min-height: 3rem;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
      }
      .gameList button:last-child {
        border-bottom: 0;
      }
      .gameList button[aria-pressed='true'] {
        font-weight: 600;
        color: var(--accent-text);
        background: var(--overlay);
      }
      .switchRow {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: 44px;
        padding: 8px 16px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .switch {
        position: relative;
        flex: none;
        width: 3.25rem;
        height: 1.875rem;
        background: var(--border);
        border-radius: 1rem;
      }
      .switch.on {
        background: var(--accent);
      }
      .switch::after {
        position: absolute;
        top: 0.1875rem;
        left: 0.1875rem;
        width: 1.5rem;
        height: 1.5rem;
        content: '';
        background: var(--text);
        border-radius: 50%;
      }
      .switch.on::after {
        left: 1.5625rem;
      }
      .saveBar {
        position: sticky;
        bottom: 0;
        padding: 12px 0 4px;
        background: linear-gradient(to bottom, transparent, var(--bg) 35%);
      }
      .wideEd .saveBar {
        position: static;
        padding: 0;
        background: none;
      }
      .saveBar .primary {
        width: 100%;
        min-height: 3.25rem;
        font-size: 1.05rem;
        font-weight: 700;
      }

      /* ---------- games ---------- */
      .gameIcon {
        display: grid;
        place-items: center;
        width: 50px;
        height: 50px;
        color: var(--accent-text);
        border: 2px solid var(--accent-text);
        border-radius: 12px;
      }
      .builtIn {
        flex: none;
        padding: 2px 8px;
        font-size: 0.75rem;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      /* ---------- round 2 ---------- */
      .btnRow.tight {
        flex-wrap: nowrap;
      }
      .btnRow.tight > * {
        flex: 1 1 0;
        min-width: 0;
        padding: 6px 8px;
      }
      .pillRow {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .pillBtn,
      .roundPill {
        position: relative;
        display: inline-flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        padding: 4px 12px;
        font-size: 0.85rem;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .roundPill {
        width: 34px;
        padding: 0;
      }
      .accentPill {
        color: var(--accent-text);
      }
      /* Visible 34 px, touch area 44 px. */
      .pillBtn::after,
      .roundPill::after {
        position: absolute;
        inset: -5px;
        content: '';
      }
      .menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 5;
        display: grid;
        min-width: 11rem;
        overflow: hidden;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 10px 30px var(--shadow);
      }
      .menu button {
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 44px;
        padding: 0 14px;
        border-bottom: 1px solid var(--border);
      }
      .menu button:last-child {
        border-bottom: 0;
      }
      .dangerText {
        color: var(--status-error);
      }
      .tablePen {
        position: absolute;
        top: 89%;
        left: 89%;
        z-index: 2;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        color: var(--accent-text);
        background: var(--overlay);
        border: 1px solid var(--accent-text);
        border-radius: 50%;
        box-shadow: 0 4px 12px var(--shadow);
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div class="picker">

    <div class="intro" id="intro"></div>

    <script>
      // Mockups only, not app code. Colour values mirror src/ui/styles/tokens.css (design Holz).
      const GROUP = {

        teal: '#5fbfb2', magenta: '#d46bc4', brown: '#94643f', pink: '#eba3bf', gray: '#9aa1ab', white: '#f1f1f4',

      };
      const FRAMES = { phoneP: 'Handy hoch', tabletP: 'Tablet hoch', wide: 'Tablet quer / PC', device: '⛶ Vollbild auf diesem Gerät' };

      // ---------- data ----------
      const NAMES = [
        'Anna', 'Ben', 'Clara', 'David', 'Eva', 'Finn', 'Greta', 'Hanna', 'Ilias', 'Jonas', 'Katharina', 'Leo',

      ];

        ['Freitagsrunde', { kind: 'game', game: 'Catan' }, ['Anna', 'Ben', 'Clara', 'David'], 0],
        ['Familie', { kind: 'global' }, ['Mama', 'Papa', 'Anna', 'Eva', 'Finn', 'Greta'], 0],
        ['Studienfreunde', { kind: 'global' }, ['Clara', 'Jonas', 'Katharina', 'Leo'], 2],
        ['Uno-Abend', { kind: 'game', game: 'Uno' }, ['Ben', 'Hanna', 'Ilias'], 4],
        ['Büro-Mittagspause', { kind: 'global', noCatan: true }, ['David', 'Mia', 'Noah'], 6],

      ];
      const DATA_SETS = {
        full: { names: NAMES, groups: GROUP_DEFS },
        many: {
          names: NAMES,
          groups: [
            ...GROUP_DEFS,

            ['Nachbarn', { kind: 'global', noCatan: true }, ['Anna', 'Eva', 'Mama', 'Papa'], 7],
            // Ben plays everywhere: 14 more tables, so he sits at 20.
            ...[
              ['Skat-Treff', { kind: 'game', game: 'Skat' }, ['Ben', 'Oskar', 'Noah']],
              ['Schach-Club', { kind: 'game', game: 'Schach' }, ['Ben', 'Leo']],
              ['Kniffel-Abend', { kind: 'game', game: 'Kniffel' }, ['Ben', 'Mia', 'Paula', 'Eva']],
              ['Catan-Liga', { kind: 'game', game: 'Catan' }, ['Ben', 'Jonas', 'Katharina', 'Hanna']],

              ['Wichteln 2026', { kind: 'global' }, ['Ben', 'Clara', 'Greta']],
              ['Sonntagsfrühstück', { kind: 'global', noCatan: true }, ['Ben', 'Mama', 'Papa']],
              ['Azul-Runde', { kind: 'game', game: 'Azul' }, ['Ben', 'Clara', 'Hanna', 'Mia']],
              ['Hüttenwochenende', { kind: 'global' }, ['Ben', 'Eva', 'Finn', 'Jonas', 'Katharina', 'Oskar', 'Paula']],
              ['Mau-Mau mit Opa', { kind: 'game', game: 'Mau-Mau' }, ['Ben', 'Opa']],
              ['Brettspielcafé', { kind: 'global' }, ['Ben', 'Ilias', 'Mia', 'Noah']],
              ['Silvester', { kind: 'global' }, ['Ben', 'Greta', 'Clara', 'David', 'Eva']],
              ['Werwolf-Nacht', { kind: 'global', noCatan: true }, ['Ben', 'Greta', 'Hanna', 'Leo', 'Paula', 'Oskar', 'Jonas', 'Mia']],

            ].map(([n, b, m], i) => [n, b, m, i]),
          ],
        },
        few: { names: ['Anna', 'Ben', 'Clara'], groups: [['Freitagsrunde', { kind: 'game', game: 'Catan' }, ['Anna', 'Ben'], 0]] },
        empty: { names: [], groups: [] },
      };
      function hasCatanColors(b, n) {
        return b.kind === 'game' ? b.game === 'Catan' : !b.noCatan && n <= 4;
      }
      function buildData(key) {
        const set = DATA_SETS[key];
        const persons = set.names.map((name, i) => ({ id: 'p' + i, name }));
        const byName = Object.fromEntries(persons.map((p) => [p.name, p]));
        const groups = set.groups.map(([name, binding, members, offset], gi) => {
          const catan = hasCatanColors(binding, members.length);
          const catanOnly = binding.kind === 'game' && binding.game === 'Catan';
          return {
            id: 'g' + gi, name, binding, catan,
            members: members.map((m, i) => {
              const cc = catan ? CATAN_ORDER[(i + offset) % 4] : null;
              return { pid: byName[m].id, gc: catanOnly ? cc : ORDER[(i + offset) % 12], cc };
            }),
          };
        });
        return { persons, groups };
      }
      function bindingShort(g) {
        if (g.binding.kind === 'game') return g.binding.game;
        return g.binding.noCatan ? 'Alle Spiele ohne Catan' : 'Alle Spiele';
      }
      function colorText(g, m) {
        return COLOR_NAME[m.gc];
      }

      // ---------- state ----------
      const state = {
        list: 'L1',
        detail: 'D9',
        table: 'T7',
        tableTab: 'members',
        frame: 'phoneP',
        lastFrame: 'phoneP',
        data: 'full',
        later: false,
        screen: 'personen',
        stack: ['verwaltung'],
        search: false,
        q: '',
        adding: false,
        flipped: false,
        expanded: null,
      };
      let DB = buildData('full');
      const person = (id) => DB.persons.find((p) => p.id === id);
      const group = (id) => DB.groups.find((g) => g.id === id);
      const groupsOf = (pid) => DB.groups.filter((g) => g.members.some((m) => m.pid === pid));
      const memberOf = (g, pid) => g.members.find((m) => m.pid === pid);
      const countText = (n) => (n === 0 ? 'an keinem Tisch' : n === 1 ? 'an 1 Tisch' : 'an ' + n + ' Tischen');

      function kind() {
        if (state.frame !== 'device') return state.frame;
        const w = window.innerWidth;
        if (w < 600) return 'phoneP';
        if (w < 1000 && window.innerHeight > w) return 'tabletP';
        return 'wide';
      }
      const cols = (o) => o[kind()];

      // ---------- helpers ----------
      function h(tag, attrs, ...kids) {
        const el = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs || {})) {
          if (v == null || v === false) continue;
          if (k === 'class') el.className = v;
          else if (k === 'style') {
            for (const [p, val] of Object.entries(v)) {
              if (p.startsWith('--')) el.style.setProperty(p, val);
              else el.style[p] = val;
            }
          } else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
          else el.setAttribute(k, v === true ? '' : v);
        }
        for (const c of kids.flat(Infinity)) {
          if (c == null || c === false) continue;
          el.append(c instanceof Node ? c : String(c));
        }
        return el;
      }
      const ICONS = {
        home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
        people: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 12 0v1M16 3.5a4 4 0 0 1 0 7.5M22 21v-1a6 6 0 0 0-4-5.6',
        table: 'M12 16.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM12 4.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM12 22.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM3 13.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM21 13.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z',
        dice: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01',
        folder: 'M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
        back: 'M15 5l-7 7 7 7',
        next: 'M9 5l7 7-7 7',
        search: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-4.5-4.5',
        close: 'M6 6l12 12M18 6L6 18',
        plus: 'M12 5v14M5 12h14',
        pen: 'M4 20h4L19 9l-4-4L4 16zM14 6l4 4',
        trash: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6',
        more: 'M4.5 12a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0M10.5 12a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0M16.5 12a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0',
        box: 'M3 7h18v4H3zM5 11v9h14v-9M10 15h4',
        flip: 'M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5',
      };
      function icon(name, size = 22) {
        const ns = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(ns, 'svg');
        for (const [k, v] of Object.entries({ width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '2', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' }))
          svg.setAttribute(k, v);
        const p = document.createElementNS(ns, 'path');
        p.setAttribute('d', ICONS[name]);
        svg.append(p);
        return svg;
      }
      const MEEPLE = 'M12 1.5a3.4 3.4 0 0 1 3.4 3.4c0 1-.4 1.9-1.1 2.6l5.7 2.3c1.8.7 2 3.1.4 4.1l-3.2 1.8 3.1 6.1c.5 1-.2 2.2-1.3 2.2h-4.6L12 18.3 9.6 24H5c-1.1 0-1.8-1.2-1.3-2.2l3.1-6.1-3.2-1.8c-1.6-1-1.4-3.4.4-4.1l5.7-2.3c-.7-.7-1.1-1.6-1.1-2.6A3.4 3.4 0 0 1 12 1.5z';
      function meeple(size) {
        const ns = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('class', 'meeple');
        svg.setAttribute('width', size);
        svg.setAttribute('height', size);
        svg.setAttribute('viewBox', '0 0 24 25');
        svg.setAttribute('aria-hidden', 'true');
        const p = document.createElementNS(ns, 'path');
        p.setAttribute('d', MEEPLE);
        svg.append(p);
        return svg;
      }
      function logoMark(size) {
        const ns = 'http://www.w3.org/2000/svg';
        const OUTLINE =
          'M24 8.5C21 5 14 5.5 12 10 7 10 5 15 7 18 3 20 3 27 7 29 5 33 8 38 12 37 13 41 18 42.5 22 40.5 23 41 23.5 41 24 40.5 24.5 41 25 41 26 40.5 30 42.5 35 41 36 37 40 38 43 33 41 29 45 27 45 20 41 18 43 15 41 10 36 10 34 5.5 27 5 24 8.5Z';
        let squares = '';
        for (let c = 0; c < 5; c++)
          for (let r = -5; r < 5; r++)
            if ((((c + r) % 2) + 2) % 2 === 0)
              squares += `<rect x="${(24 - 5.4 * (c + 1)).toFixed(2)}" y="${(24 + 5.4 * r).toFixed(2)}" width="5.4" height="5.4" fill="currentColor" opacity="0.85"/>`;
        const svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('width', size);
        svg.setAttribute('height', size);
        svg.setAttribute('viewBox', '0 0 48 48');
        svg.setAttribute('aria-hidden', 'true');
        svg.innerHTML = `<clipPath id="lgo"><path d="${OUTLINE}"/></clipPath><clipPath id="lgl"><rect x="0" y="0" width="24" height="48"/></clipPath><g clip-path="url(#lgo)"><g clip-path="url(#lgl)">${squares}</g></g><path d="M36 10c-2 3-6 3-7 6M41 18c-4 0-6 3-5 6M41 29c-4-1-7 1-8 4M30.5 22c2 3 0 6-3 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="${OUTLINE}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M24 8.5V40.5" fill="none" stroke="currentColor" stroke-width="2.6"/>`;
        return svg;
      }
      function ph(el, tag) {
        if (!state.later) return null;
        return h('div', { class: 'ph' }, el, h('span', { class: 'ph-tag' }, 'später · ' + tag));
      }
      // At most `max` dots; the rest as "+n" so many tables never break the layout.
      function myDots(pid, max = 8) {
        const gs = groupsOf(pid);
        const shown = gs.length > max ? gs.slice(0, max - 1) : gs;
        return [
          shown.map((g) => h('span', { class: 'dot', title: g.name, style: { background: GROUP[memberOf(g, pid).gc] } })),
          gs.length > shown.length && h('span', { class: 'moreDots' }, '+' + (gs.length - shown.length)),
        ];
      }
      // Ring around a token, split into the person's colours at her tables.
      function ringOf(pid) {
        const gs = groupsOf(pid);
        if (gs.length === 0) return null;
        const step = 360 / gs.length;
        const parts = gs.map((g, i) => `${GROUP[memberOf(g, pid).gc]} ${i * step + 4}deg ${(i + 1) * step - 4}deg, transparent ${(i + 1) * step - 4}deg ${(i + 1) * step + 4}deg`);
        return `conic-gradient(transparent 0deg 4deg, ${parts.join(', ')})`;
      }
      function miniTable(g, size = 64, hlPid = null) {
        const wrap = h('div', { class: 'mt', style: { width: size + 'px', height: size + 'px' } }, h('div', { class: 'mt-top' }));
        const n = g.members.length;
        const seat = size * (n >= 7 ? 0.2 : 0.24);
        g.members.forEach((m, i) => {
          const a = (i / n) * 2 * Math.PI - Math.PI / 2;
          wrap.append(h('span', { class: 'mt-seat' + (hlPid ? (m.pid === hlPid ? ' hl' : ' dim') : ''), style: { width: seat + 'px', height: seat + 'px', left: 50 + 40 * Math.cos(a) + '%', top: 50 + 40 * Math.sin(a) + '%', background: GROUP[m.gc] } }));
        });
        return wrap;
      }
      // Only the group colour; the Catan colour is not shown on the person pages (PO decision).
      function colorMark(g, m, size = 12) {
        return h('span', { class: 'dot', style: { width: size + 'px', height: size + 'px', background: GROUP[m.gc] } });
      }

      // ---------- navigation ----------
      function go(screen) {
        state.stack.push(state.screen);
        state.screen = screen;
        state.flipped = false;
        state.expanded = null;
        render();
        document.querySelectorAll('.scroll').forEach((el) => (el.scrollTop = 0));
        if (state.detail === 'D5' && screen.startsWith('p:')) setTimeout(() => { state.flipped = true; document.querySelector('.flipInner')?.classList.add('flipped'); }, 450);
      }
      function back() {
        state.screen = state.stack.pop() || 'verwaltung';
        render();
      }
      function goArea(s) {
        state.stack = [];
        state.screen = s;
        render();
      }
      function hand() {
        const all = [['start', 'home', 'Start'], ['verwaltung', 'folder', 'Verwaltung']];
        return h(
          'nav',
          { class: 'e-hand', 'aria-label': 'Hauptnavigation' },
          all.map(([s, ic, l], i) => {
            const active = (state.screen === 'start' ? 'start' : 'verwaltung') === s;
            return h('button', { class: 'e-navCard', 'aria-current': active ? 'page' : null, style: { transform: `rotate(${(i - 0.5) * 9}deg) translateY(${active ? 4 : 16}px)` }, onclick: () => goArea(s) }, icon(ic, 22), l);
          }),
        );
      }
      function pageHead(title, actions) {
        return h('div', { class: 'pageHead' }, h('button', { class: 'iconBtn', 'aria-label': 'Zurück', onclick: back }, icon('back')), h('h1', {}, title), actions);
      }
      function headActions(withAdd) {
        return h(
          'div',
          { style: { display: 'flex', gap: '8px' } },
          h('button', { class: 'iconBtn', 'aria-label': 'Suchen', onclick: () => { state.search = !state.search; state.q = ''; render(); } }, icon('search')),
          withAdd && h('button', { class: 'iconBtn', 'aria-label': 'Neue Person', style: { color: 'var(--accent-text)', borderColor: 'var(--accent-text)' }, onclick: () => { state.adding = !state.adding; render(); } }, icon('plus')),
        );
      }
      function searchRow() {
        if (!state.search) return null;
        const input = h('input', {
          class: 'field', type: 'search', placeholder: 'Person suchen', value: state.q,
          oninput: (e) => {
            state.q = e.target.value;
            const pos = e.target.selectionStart;
            render();
            const again = document.querySelector('.field[type=search]');
            again.focus();
            again.setSelectionRange(pos, pos);
          },
        });
