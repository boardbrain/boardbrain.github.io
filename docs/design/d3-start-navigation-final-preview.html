<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BoardBrain – D-3 final: Start und Navigation</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          var(--bg-image) fixed,
          var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          roboto,
          sans-serif;
        line-height: 1.5;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: none;
        border: 0;
        padding: 0;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.25;
      }
      h2 {
        font-size: 1rem;
      }

      /* ---------- picker ---------- */
      .picker {
        position: sticky;
        top: 0;
        z-index: 5;
        display: grid;
        gap: 8px;
        padding: 10px 16px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }
      @media (width < 800px) {
        .picker {
          position: static;
        }
      }
      .picker .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .picker .label {
        min-width: 80px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .chip {
        min-height: 36px;
        padding: 6px 12px;
        font-size: 0.9rem;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .chip[aria-pressed='true'] {
        font-weight: 600;
        color: var(--accent-text);
        background: var(--overlay);
        border-color: var(--accent-text);
      }
      .intro {
        max-width: 1220px;
        margin: 0 auto;
        padding: 12px 16px 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .intro b {
        color: var(--text);
      }
      .stage {
        padding: 16px;
      }

      /* ---------- device frames ---------- */
      .frame {
        position: relative;
        display: flex;
        flex-direction: column;
        margin: 0 auto;
        overflow: hidden;
        background:
          var(--bg-image),
          var(--bg);
        border: 1px dashed var(--border);
        border-radius: 24px;
      }
      .frame.phoneP {
        width: min(100%, 390px);
        height: 780px;
      }
      .frame.phoneL {
        width: min(100%, 780px);
        height: 370px;
      }
      .frame.tabletP {
        width: min(100%, 780px);
        height: 1020px;
      }
      .frame.wide {
        width: min(100%, 1180px);
        height: 760px;
      }
      .frame.device {
        position: fixed;
        inset: 0;
        z-index: 50;
        width: auto;
        height: auto;
        border: 0;
        border-radius: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      .exit {
        position: absolute;
        top: 50%;
        left: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        width: 28px;
        height: 56px;
        color: var(--muted);
        background: var(--overlay);
        border: 1px solid var(--border);
        border-left: 0;
        border-radius: 0 12px 12px 0;
        opacity: 0.8;
      }

      /* ---------- shared app pieces ---------- */
      .app {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .app.row {
        flex-direction: row;
      }
      .scroll {
        flex: 1;
        min-height: 0;
        min-width: 0;
        overflow-y: auto;
        scrollbar-width: none;
      }
      .scroll::-webkit-scrollbar {
        display: none;
      }
      .pad {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
        align-content: start;
        padding: 20px 16px 28px;
      }
      .wideContent {
        width: 100%;
        max-width: 1040px;
        margin: 0 auto;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 0.85rem;
      }
      .tiny {
        font-size: 0.75rem;
      }
      .logo {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .logo svg {
        color: var(--accent-text);
      }
      .iconBtn {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        color: var(--text);
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 50%;
      }
      .primary {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 10px 20px;
        font-weight: 600;
        color: var(--on-accent);
        background: var(--accent);
        border-radius: 14px;
      }
      .secondary {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 8px 18px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .linkBtn {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: var(--accent-text);
        font-size: 0.9rem;
      }
      .sectionHead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .card {
        padding: 14px;
        background: var(--raised);
        backdrop-filter: blur(var(--blur));
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .avatar {
        display: inline-grid;
        place-items: center;
        flex: none;
        width: 32px;
        height: 32px;
        font-size: 0.8rem;
        font-weight: 700;
        color: #1b1b1b;
        border-radius: 50%;
      }
      .avatarRow {
        display: flex;
      }
      .avatarRow .avatar {
        margin-right: -8px;
        border: 2px solid var(--raised);
      }
      .fadeRow {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        scrollbar-width: none;
        mask-image: linear-gradient(90deg, #000 85%, transparent);
      }
      .fadeRow::-webkit-scrollbar {
        display: none;
      }

      /* future placeholder */
      .ph {
        position: relative;
        opacity: 0.55;
        outline: 2px dashed var(--muted);
        outline-offset: 3px;
        border-radius: 14px;
      }
      .ph-tag {
        position: absolute;
        top: -10px;
        right: 8px;
        z-index: 2;
        padding: 0 7px;
        font-size: 0.68rem;
        font-weight: 600;
        line-height: 18px;
        color: var(--bg);
        background: var(--muted);
        border-radius: 999px;
        white-space: nowrap;
      }
      .banner {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        font-size: 0.9rem;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .banner b {
        color: var(--accent-text);
      }

      /* mini table (as in the Spielraum) */
      .mt {
        position: relative;
        flex: none;
      }
      .mt-top {
        position: absolute;
        inset: 22%;
        background: var(--overlay);
        border: 2px solid var(--border);
        border-radius: 50%;
      }
      .mt-seat {
        position: absolute;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .mt-seat.sq {
        border-radius: 22%;
      }

      /* generic sub pages */
      .roomGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr));
        gap: 12px;
      }
      .tableCard {
        display: grid;
        gap: 4px;
        justify-items: center;
        padding: 16px 8px;
        text-align: center;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .tableCard.new {
        color: var(--accent-text);
        border: 1px dashed var(--accent-text);
      }
      .plusTable {
        display: grid;
        place-items: center;
        width: 96px;
        height: 96px;
        border: 2px dashed var(--accent-text);
        border-radius: 50%;
      }
      .listRow {
        display: flex;
        gap: 12px;
        align-items: center;
        min-height: 52px;
        padding: 6px 14px;
        border-bottom: 1px solid var(--border);
      }
      .listRow:last-child {
        border-bottom: 0;
      }
      .fieldRow {
        display: flex;
        gap: 8px;
      }
      .field {
        flex: 1;
        min-width: 0;
        min-height: 48px;
        padding: 0 14px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .pageHead {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      /* ---------- A Tischmitte ---------- */
      .a-head {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
      }
      .a-seg {
        display: flex;
        padding: 4px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .a-seg button {
        min-height: 40px;
        padding: 0 12px;
        color: var(--muted);
        border-radius: 999px;
      }
      .a-seg button[aria-current='page'] {
        color: var(--text);
        font-weight: 600;
        background: var(--overlay);
        box-shadow: 0 1px 0 var(--border);
      }
      .a-table {
        position: relative;
        flex: none;
        margin: 0 auto;
      }
      .a-top {
        position: absolute;
        inset: 17%;
        display: grid;
        gap: 8px;
        place-content: center;
        justify-items: center;
        padding: 12px;
        text-align: center;
        background: radial-gradient(circle at 40% 35%, var(--overlay), var(--raised));
        border: 6px solid var(--border);
        border-radius: 50%;
        box-shadow: inset 0 0.75rem 2.5rem -0.75rem var(--shadow);
      }
      .a-seat {
        position: absolute;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 0;
        color: var(--text);
        background: var(--raised);
        border: 2px solid var(--border);
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .a-seat .lbl {
        font-size: 0.7rem;
        line-height: 1.2;
      }
      .a-seat .cnt {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 24px;
        padding: 0 6px;
        font-size: 0.75rem;
        font-weight: 700;
        line-height: 22px;
        color: var(--on-accent);
        background: var(--accent);
        border-radius: 999px;
      }
      .a-seat.ghost {
        opacity: 0.5;
        border-style: dashed;
      }
      .a-seat.hint {
        border-color: var(--accent-text);
        box-shadow: 0 0 0 4px var(--overlay);
      }
      .a-split {
        display: grid;
        gap: 20px;
        align-items: center;
      }
      .a-cards {
        display: grid;
        gap: 12px;
      }
      .a-card {
        display: grid;
        gap: 12px;
        padding: 16px;
        text-align: left;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 20px;
      }
      .a-card .top {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .a-card .count {
        margin-left: auto;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--accent-text);
      }

      /* ---------- B App-Leiste ---------- */
      .b-top {
        display: flex;
        gap: 12px;
        align-items: center;
        min-height: 56px;
        padding: 6px 16px;
      }
      .b-tabs {
        display: flex;
        justify-content: space-around;
        padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
        background: var(--raised);
        border-top: 1px solid var(--border);
      }
      .b-tab {
        position: relative;
        display: grid;
        flex: 1;
        justify-items: center;
        gap: 2px;
        min-height: 56px;
        padding: 6px 4px;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .b-tab .pill {
        display: grid;
        place-items: center;
        width: 56px;
        height: 30px;
        border-radius: 999px;
      }
      .b-tab[aria-current='page'] {
        color: var(--text);
        font-weight: 600;
      }
      .b-tab[aria-current='page'] .pill {
        color: var(--accent-text);
        background: var(--overlay);
      }
      .b-tab.ghost {
        opacity: 0.45;
      }
      .b-rail {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        width: 96px;
        padding: 14px 6px;
        background: var(--raised);
        border-right: 1px solid var(--border);
      }
      .b-rail.slim {
        width: 72px;
      }
      .b-rail .b-tab {
        flex: none;
        width: 100%;
      }
      .b-hero {
        display: grid;
        gap: 6px;
        padding: 18px;
        text-align: left;
        color: var(--on-accent);
        background: var(--accent);
        border-radius: 20px;
      }
      .b-hero .big {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 1.25rem;
        font-weight: 700;
      }
      .b-tiles {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .b-tile {
        display: grid;
        gap: 4px;
        padding: 14px;
        text-align: left;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .b-tile .n {
        font-size: 1.5rem;
        font-weight: 700;
      }
      .b-mini {
        display: grid;
        flex: none;
        justify-items: center;
        gap: 4px;
        width: 112px;
        padding: 12px 6px;
        text-align: center;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .b-list {
        overflow: hidden;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .b-list button {
        width: 100%;
        text-align: left;
      }
      .b-ico {
        display: grid;
        place-items: center;
        flex: none;
        width: 38px;
        height: 38px;
        color: var(--on-accent);
        background: var(--accent);
        border-radius: 10px;
      }

      /* ---------- C Spielraum ---------- */
      .c-head {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 14px;
      }
      .c-head .logo {
        margin-right: auto;
      }
      .c-pillBtn {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        min-height: 44px;
        padding: 0 14px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      .c-bench {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 12px;
        background: linear-gradient(180deg, var(--overlay), var(--raised));
        border: 1px solid var(--border);
        border-bottom-width: 6px;
        border-radius: 16px;
      }
      .c-shelf {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        min-height: 92px;
        padding: 10px 12px 0;
        border-bottom: 6px solid var(--border);
      }
      .c-box {
        display: grid;
        place-items: center;
        flex: none;
        padding: 6px;
        font-size: 0.75rem;
        font-weight: 600;
        text-align: center;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 6px 6px 2px 2px;
      }
      .c-sheetBack {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: #000000b3;
      }
      .c-sheet {
        display: grid;
        gap: 14px;
        width: 100%;
        max-height: 92%;
        padding: 18px 16px 24px;
        overflow-y: auto;
        background: var(--overlay);
        border-radius: 22px 22px 0 0;
      }
      .c-sheetBack.center {
        align-items: center;
      }
      .c-sheetBack.center .c-sheet {
        width: min(440px, 90%);
        border-radius: 22px;
      }
      .c-actions {
        display: grid;
        gap: 12px;
      }

      /* ---------- D Schachtel ---------- */
      .d-tabs {
        display: flex;
        gap: 4px;
        align-items: flex-end;
        padding: 0 14px;
      }
      .d-tab {
        min-height: 44px;
        padding: 8px 18px;
        color: var(--muted);
        background: var(--bg);
        border: 1px solid var(--border);
        border-bottom: 0;
        border-radius: 12px 12px 0 0;
      }
      .d-tab[aria-current='page'] {
        position: relative;
        top: 1px;
        color: var(--text);
        font-weight: 600;
        background: var(--raised);
      }
      .d-tab.ghost {
        opacity: 0.45;
        border-style: dashed;
      }
      .d-box {
        flex: 1;
        min-height: 0;
        display: flex;
        margin: 0 10px 10px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 0 16px 16px;
      }
      .d-grid {
        display: grid;
        gap: 10px;
        padding: 12px;
      }
      .d-cell {
        position: relative;
        display: grid;
        gap: 8px;
        align-content: space-between;
        min-height: 120px;
        padding: 14px;
        text-align: left;
        background: var(--bg);
        border-radius: 14px;
        box-shadow:
          inset 0 4px 14px var(--shadow),
          inset 0 -1px 0 var(--border);
      }
      .d-cell .n {
        font-size: 2rem;
        font-weight: 700;
        line-height: 1;
        color: var(--accent-text);
      }
      .d-shelf {
        display: grid;
        gap: 0;
        padding: 16px 16px 24px;
      }
      .d-spine {
        display: flex;
        gap: 12px;
        align-items: center;
        min-height: 64px;
        padding: 10px 16px;
        font-weight: 700;
        text-align: left;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-left: 10px solid var(--spine);
        border-radius: 6px;
      }
      .d-spine .n {
        margin-left: auto;
        font-size: 1.25rem;
        letter-spacing: 0;
        color: var(--accent-text);
      }
      .d-board {
        height: 10px;
        margin: 2px -8px 18px;
        background: var(--border);
        border-radius: 3px;
        box-shadow: 0 6px 10px -4px var(--shadow);
      }

      /* ---------- E Kartenhand ---------- */
      .e-hand {
        position: relative;
        display: flex;
        justify-content: center;
        height: 104px;
        padding-bottom: env(safe-area-inset-bottom);
        background: linear-gradient(180deg, transparent, var(--raised));
      }
      .e-navCard {
        position: relative;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2px;
        width: 86px;
        height: 104px;
        margin: 0 -8px;
        font-size: 0.7rem;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 -4px 12px var(--shadow);
        transform-origin: 50% 140%;
      }
      .e-navCard[aria-current='page'] {
        z-index: 2;
        color: var(--accent-text);
        font-weight: 700;
        border-color: var(--accent-text);
      }
      .e-navCard.ghost {
        opacity: 0.5;
        border-style: dashed;
      }
      .e-card {
        position: relative;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 6px;
        aspect-ratio: 5 / 7;
        padding: 18px 10px;
        text-align: center;
        background: linear-gradient(160deg, var(--overlay), var(--raised));
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 6px 18px var(--shadow);
      }
      .e-card .corner {
        position: absolute;
        top: 8px;
        left: 10px;
        font-weight: 800;
        line-height: 1;
        color: var(--accent-text);
      }
      .e-card .corner.br {
        top: auto;
        right: 10px;
        bottom: 8px;
        left: auto;
        transform: rotate(180deg);
      }
      .e-card .ttl {
        font-weight: 700;
      }
      .e-fan {
        display: flex;
        justify-content: center;
      }
      .e-fan .e-card {
        width: 31%;
        max-width: 170px;
        margin: 0 -2%;
      }
      .e-hero {
        width: min(100%, 260px);
        margin: 0 auto;
        aspect-ratio: 5 / 7;
      }

      /* ---------- F Hausplan ---------- */
      .f-plan {
        display: grid;
        gap: 6px;
        padding: 6px;
        background: var(--border);
        border-radius: 10px;
      }
      .f-room {
        position: relative;
        display: grid;
        gap: 8px;
        align-content: start;
        min-height: 130px;
        padding: 14px;
        text-align: left;
        background: var(--raised);
        border-radius: 4px;
      }
      .f-room .kind {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .f-room .ttl {
        display: flex;
        gap: 8px;
        align-items: baseline;
        font-size: 1.1rem;
        font-weight: 700;
      }
      .f-room .ttl span {
        color: var(--accent-text);
      }
      .f-room.ghost {
        background: var(--bg);
        opacity: 0.6;
      }
      .f-door {
        position: absolute;
        width: 28px;
        height: 28px;
        border: 2px solid var(--border);
        border-color: var(--border) transparent transparent var(--border);
        border-radius: 100% 0 0 0;
        opacity: 0.8;
      }
      .f-note {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        font-size: 0.9rem;
        background: var(--overlay);
        border-left: 4px solid var(--accent-text);
        border-radius: 4px;
        transform: rotate(-0.6deg);
      }

      /* ---------- G Spielanleitung ---------- */
      .g-head {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
      }
      .g-word {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      .g-side {
        display: grid;
        gap: 2px;
        align-content: start;
        width: 260px;
        padding: 20px 14px;
        overflow-y: auto;
        background: var(--raised);
        border-right: 1px solid var(--border);
      }
      .g-side .sec {
        margin: 14px 10px 4px;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .g-side button {
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 44px;
        padding: 0 10px;
        text-align: left;
        border-radius: 10px;
      }
      .g-side button[aria-current='page'] {
        font-weight: 600;
        color: var(--accent-text);
        background: var(--overlay);
      }
      .g-side .ghost {
        opacity: 0.45;
      }
      .g-drawerBack {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        background: #000000b3;
      }
      .g-drawerBack .g-side {
        width: min(300px, 82%);
        box-shadow: 8px 0 24px var(--shadow);
      }
      .g-cover {
        display: grid;
        gap: 14px;
        justify-items: start;
        padding: 28px 4px 8px;
      }
      .g-title {
        font-size: 2.4rem;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }
      .g-rule {
        width: 64px;
        height: 4px;
        background: var(--accent-text);
        border-radius: 2px;
      }
      .g-toc {
        display: grid;
      }
      .g-toc button {
        display: flex;
        gap: 10px;
        align-items: baseline;
        min-height: 52px;
        padding: 10px 2px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      .g-toc .no {
        width: 1.6em;
        font-weight: 700;
        color: var(--accent-text);
      }
      .g-toc .dots {
        flex: 1;
        border-bottom: 2px dotted var(--border);
        transform: translateY(-4px);
      }
      .g-toc .n {
        font-weight: 700;
      }

      /* ---------- round 2 ---------- */
      .h-land {
        aspect-ratio: auto;
        min-height: 96px;
        justify-items: start;
        padding: 18px 20px;
        text-align: left;
      }
      .h-bar {
        display: flex;
        gap: 6px;
        justify-content: center;
        height: 80px;
        padding: 0 8px;
        overflow: hidden;
        background: linear-gradient(180deg, transparent, var(--raised));
        border-top: 1px solid var(--border);
      }
      .h-card {
        display: grid;
        flex: 1;
        gap: 2px;
        align-content: start;
        justify-items: center;
        max-width: 92px;
        height: 104px;
        padding-top: 10px;
        font-size: 0.72rem;
        color: var(--muted);
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 -2px 8px var(--shadow);
        transform: rotate(var(--rot)) translateY(16px);
      }
      .h-card.on {
        font-weight: 700;
        color: var(--accent-text);
        border-color: var(--accent-text);
        transform: rotate(var(--rot)) translateY(4px);
      }
      .h-card.ghost {
        opacity: 0.45;
        border-style: dashed;
      }
      .h-sideWrap {
        display: flex;
        flex-direction: column;
        width: 136px;
        overflow: hidden;
        background: var(--raised);
        border-right: 1px solid var(--border);
      }
      .h-side {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 0;
      }
      .h-side .h-card {
        flex: none;
        grid-template-columns: auto 1fr;
        align-content: center;
        align-items: center;
        justify-items: start;
        gap: 8px;
        width: 160px;
        max-width: none;
        height: 56px;
        padding: 0 10px 0 40px;
        transform: translateX(-34px);
      }
      .h-side .h-card.on {
        transform: translateX(-22px);
      }
      .j-deck {
        display: flex;
        gap: 14px;
        margin: 0 -16px;
        padding: 14px 16px 18px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }
      .j-deck::-webkit-scrollbar {
        display: none;
      }
      .j-deck > * {
        flex: none;
        scroll-snap-align: center;
      }
      .j-dots {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      .j-dots span {
        width: 8px;
        height: 8px;
        background: var(--border);
        border-radius: 50%;
      }
      .j-dots span.on {
        background: var(--accent-text);
      }
      .k-slot {
        overflow: visible;
      }
      .k-center {
        display: grid;
        place-items: center;
        width: 60px;
        height: 60px;
        margin-top: -26px;
        color: var(--on-accent);
        background: var(--accent);
        border-radius: 50%;
        outline: 2px dashed var(--muted);
        outline-offset: 3px;
        box-shadow: 0 4px 14px var(--shadow);
      }
      .b-rail .k-center {
        margin: 0 0 4px;
      }
      .k-fanBack {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 120px;
        background: #000000a6;
      }
      .k-fanBack.rail {
        align-items: flex-start;
        justify-content: flex-start;
        padding: 40px 0 0 120px;
      }
      .k-fan {
        display: flex;
      }
      .m-back {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: #000000b3;
      }
      .m-fan {
        position: absolute;
        bottom: 84px;
        left: 50%;
        width: 0;
        height: 0;
      }
      .m-card {
        position: absolute;
        bottom: 0;
        bottom: -43px;
        left: -33px;
        display: grid;
        gap: 2px;
        align-content: center;
        justify-items: center;
        width: 66px;
        height: 86px;
        font-size: 0.68rem;
        background: var(--overlay);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 4px 12px var(--shadow);
      }
      .m-card.on {
        font-weight: 700;
        color: var(--accent-text);
        border-color: var(--accent-text);
      }
      .m-card.ghost {
        color: var(--muted);
        border-style: dashed;
      }
      .m-deck {
        position: absolute;
        bottom: calc(18px + env(safe-area-inset-bottom));
        left: 50%;
        z-index: 21;
        display: grid;
        place-items: center;
        width: 60px;
        height: 76px;
        color: var(--on-accent);
        background: var(--accent);
        border-radius: 12px;
        box-shadow:
          5px -4px 0 var(--overlay),
          10px -8px 0 var(--border),
          0 6px 16px var(--shadow);
        transform: translateX(-50%) rotate(-4deg);
      }

      /* ---------- E: variants for "Neue Partie" ---------- */
      .e-pile {
        display: flex;
        gap: 22px;
        align-items: center;
        width: 100%;
        padding: 14px 18px 14px 22px;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .e-pileStack {
        position: relative;
        flex: none;
        width: 54px;
        height: 74px;
      }
      .e-back {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: repeating-linear-gradient(45deg, var(--accent) 0 5px, var(--raised) 5px 10px);
        border: 3px solid var(--overlay);
        border-radius: 8px;
        box-shadow: 0 2px 6px var(--shadow);
      }
      .e-back:nth-child(1) {
        transform: rotate(-9deg) translate(-5px, 2px);
      }
      .e-back:nth-child(2) {
        transform: rotate(6deg) translate(4px, 1px);
      }
      .e-backBadge {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        color: var(--on-accent);
        background: var(--accent);
        border: 2px solid var(--overlay);
        border-radius: 50%;
      }
      .e-hexRow {
        display: flex;
        gap: 18px;
        align-items: center;
        width: 100%;
        padding: 4px 0;
      }
      .e-hex {
        display: grid;
        flex: none;
        place-items: center;
        align-content: center;
        width: 92px;
        height: 106px;
        font-size: 0.78rem;
        font-weight: 700;
        line-height: 1.15;
        color: var(--on-accent);
        background: var(--accent);
        clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
      }
      .e-strip {
        position: relative;
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        min-height: 60px;
        padding: 0 18px 0 36px;
        color: var(--on-accent);
        background: var(--accent);
        border-radius: 12px;
        box-shadow: 0 4px 12px var(--shadow);
        transform: rotate(-1.2deg);
      }
      .e-strip .corner {
        position: absolute;
        top: 6px;
        left: 12px;
        font-weight: 800;
      }
      .e-fan.four .e-card {
        width: 25%;
        max-width: 150px;
      }
      .e-backCard {
        background: repeating-linear-gradient(45deg, var(--accent) 0 6px, var(--raised) 6px 12px);
      }
      .e-q {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--accent-text);
        background: var(--bg);
        border-radius: 50%;
      }
      .e-backLabel {
        padding: 2px 8px;
        font-size: 0.72rem;
        font-weight: 700;
        background: var(--bg);
        border-radius: 999px;
      }
      .e-hand.six .e-navCard {
        width: 70px;
        margin: 0 -6px;
      }
      .e-trumpNav {
        z-index: 3;
        font-weight: 700;
        color: var(--on-accent);
        background: var(--accent);
        border: 2px dashed var(--muted);
      }

      /* ---------- draw pile designs ---------- */
      .e-pile.compact {
        padding: 10px 14px 10px 18px;
      }
      .ps-all {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
        gap: 12px;
      }
      .ps-corner {
        position: absolute;
        top: 3px;
        left: 5px;
        font-size: 0.6rem;
        font-weight: 800;
        line-height: 1;
        color: var(--accent-text);
      }
      .ps-corner.br {
        top: auto;
        right: 5px;
        bottom: 3px;
        left: auto;
        transform: rotate(180deg);
      }

      /* classic: diamond lattice with an inner frame */
      .ps-classic .e-back {
        background:
          repeating-linear-gradient(45deg, transparent 0 5px, var(--border) 5px 6px),
          repeating-linear-gradient(-45deg, transparent 0 5px, var(--border) 5px 6px),
          var(--raised);
        border: 2px solid var(--overlay);
        box-shadow:
          inset 0 0 0 3px var(--raised),
          inset 0 0 0 4px var(--accent-text),
          0 2px 6px var(--shadow);
      }

      /* hex: dotted honeycomb feel with a hex mark */
      .ps-hex .e-back {
        color: var(--on-accent);
        background:
          radial-gradient(circle, #ffffff2e 0 1.5px, transparent 2px) 0 0 / 8px 8px,
          var(--accent);
        border: 2px solid var(--overlay);
        box-shadow:
          inset 0 0 0 3px var(--accent),
          inset 0 0 0 4px #ffffff59,
          0 2px 6px var(--shadow);
      }
      .ps-hexMark {
        position: relative;
        display: grid;
        place-items: center;
      }
      .ps-hexPlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }

      /* neat: one tidy deck, the edges of the cards below show */
      .ps-neat .e-back:nth-child(1),
      .ps-neat .e-back:nth-child(2) {
        display: none;
      }
      .ps-neat .e-back {
        inset: 0 0 12px;
        color: var(--on-accent);
        background: var(--accent);
        border: 2px solid var(--overlay);
        box-shadow:
          0 3px 0 -1px var(--raised),
          0 4px 0 -1px var(--border),
          0 7px 0 -2px var(--raised),
          0 8px 0 -2px var(--border),
          0 11px 0 -3px var(--raised),
          0 12px 0 -3px var(--border),
          0 14px 10px -4px var(--shadow);
      }

      /* joker: face-up card with a question mark on top of two backs */
      .ps-joker .e-back {
        background: repeating-linear-gradient(45deg, var(--overlay) 0 5px, var(--raised) 5px 10px);
      }
      .ps-joker .e-back:nth-child(3) {
        background: var(--overlay);
        border: 2px solid var(--accent-text);
        transform: rotate(3deg) translate(2px, -2px);
      }
      .ps-q {
        font-size: 1.8rem;
        font-weight: 800;
        line-height: 1;
        color: var(--accent-text);
      }

      /* fan: three cards spread like a hand, the front one shows the play sign */
      .ps-fan {
        width: 80px;
      }
      .ps-fan .e-back {
        inset: 0 auto 0 16px;
        width: 48px;
        transform-origin: 50% 100%;
        background:
          repeating-linear-gradient(45deg, transparent 0 5px, var(--border) 5px 6px),
          repeating-linear-gradient(-45deg, transparent 0 5px, var(--border) 5px 6px),
          var(--raised);
      }
      .ps-fan .e-back:nth-child(1) {
        transform: rotate(-22deg);
      }
      .ps-fan .e-back:nth-child(2) {
        transform: rotate(22deg);
      }
      .ps-fan .e-back:nth-child(3) {
        color: var(--accent-text);
        background: var(--overlay);
        border-color: var(--accent-text);
        transform: none;
      }

      /* coin: plain dark backs, a round play token lies on top like a game piece */
      .ps-coin .e-back {
        background: var(--overlay);
        border: 2px solid var(--border);
      }
      .ps-coin .e-back:nth-child(1) {
        transform: rotate(-6deg) translate(-3px, 1px);
      }
      .ps-coin .e-back:nth-child(2) {
        transform: rotate(4deg) translate(3px, 0);
      }
      .ps-coin {
        overflow: visible;
      }
      .ps-coin .e-back:nth-child(3) {
        overflow: visible;
        box-shadow:
          inset 0 0 0 3px var(--overlay),
          inset 0 0 0 4px var(--border),
          0 2px 6px var(--shadow);
      }
      .ps-token {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding-left: 2px;
        color: var(--on-accent);
        background: radial-gradient(circle at 35% 30%, var(--accent-text), var(--accent) 60%);
        border: 3px solid var(--bg);
        border-radius: 50%;
        box-shadow: 0 3px 8px var(--shadow);
        transform: translate(14px, 18px);
      }

      /* "Wie fertig": later features without grey, dashes or labels */
      .real .ghost {
        opacity: 1 !important;
        color: var(--text) !important;
      }
      .real .e-navCard.ghost,
      .real .h-card.ghost,
      .real .m-card.ghost,
      .real .a-seat.ghost,
      .real .d-tab.ghost {
        border-style: solid !important;
      }
      .real .ghost .pill {
        outline: none !important;
      }
      .real .ghost .tiny,
      .real .a-seat.ghost .cnt {
        display: none;
      }
      .real .f-room.ghost {
        background: var(--raised);
      }
      .real .k-center {
        outline: none;
      }
      .real .a-seat.ghost,
      .real .b-tab.ghost {
        color: var(--muted) !important;
      }

      /* ---------- logo concepts ---------- */
      .logoWord {
        gap: 0;
        font-weight: 400;
      }
      .logoWord b {
        font-weight: 800;
        color: var(--accent-text);
      }
      .lg-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
        gap: 14px;
        max-width: 1220px;
        margin: 0 auto;
      }
      .lg-card {
        display: grid;
        gap: 10px;
        padding: 16px;
        text-align: left;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 18px;
      }
      .lg-card.on {
        border-color: var(--accent-text);
      }
      .lg-row {
        display: flex;
        gap: 18px;
        align-items: center;
      }
      .lg-icon {
        display: grid;
        place-items: center;
        width: 84px;
        height: 84px;
        background:
          var(--bg-image),
          var(--bg);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 4px 12px var(--shadow);
      }
      .lg-bar {
        padding: 10px 12px;
        background: var(--bg);
        border-radius: 10px;
      }

      /* ---------- final start: bottom aligned, never scrolls ---------- */
      .e-startFull {
        container-type: size;
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 620px;
        height: 100%;
        margin: 0 auto;
        padding: 14px 16px 30px;
      }
      .e-notes {
        display: grid;
        gap: 10px;
      }
      .land .e-notes {
        grid-template-columns: 1fr 1fr;
      }
      .land .banner {
        min-height: 0;
        padding: 6px 12px;
        overflow: hidden;
        font-size: 0.8rem;
        white-space: nowrap;
      }
      .land .e-startFull,
      .e-startFull.land {
        gap: 8px;
        padding: 8px 16px 22px;
      }
      .land .e-pile {
        padding: 8px 14px;
      }
      .land .e-pileStack {
        width: 44px;
        height: 60px;
      }
      .land .e-cardsBlock h2 {
        display: none;
      }
      .e-spacer {
        flex: 1;
        min-height: 0;
      }
      /* Gap below the cards depends on the screen height only, so notes at the top do not push the
         content down; it shrinks only when the space is not sufficient. */
      .e-spacer.low {
        flex: 0 1 9cqh;
      }
      .e-bottomCol {
        display: grid;
        gap: 14px;
      }
      .e-bottomRow {
        display: flex;
        gap: 16px;
        align-items: flex-end;
      }
      .e-cardsBlock {
        display: grid;
        gap: 4px;
      }
      /* Card width follows the free space: at most a third of the width and about a quarter of the height. */
      .e-fanBottom .e-card {
        width: min(31cqw, 170px, 23cqh);
        padding: 8% 6%;
      }
      .land .e-fanBottom .e-card {
        width: min(13cqw, 38cqh);
      }

      /* ---------- I3: choice after tapping "Neue Partie" (variant D3d) ---------- */
      .r-dim {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: #000000b3;
      }
      .r-fanOut {
        display: flex;
        justify-content: center;
      }
      .e-card.r-playCard {
        width: 150px;
        gap: 14px;
        aspect-ratio: 5 / 7;
      }
      .r-playCard strong {
        font-size: 0.95rem;
        line-height: 1.25;
      }
      .r-playCard .corner {
        font-size: 1rem;
      }
      .r-left {
        z-index: 1;
        margin-right: -12px;
        transform: rotate(-8deg) translateY(6px);
      }
      .r-right {
        transform: rotate(8deg) translateY(6px);
      }
      .r-halfIcon {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        color: var(--on-accent);
        background: var(--accent);
        border-radius: 50%;
      }

      /* ---------- K2: result entry first; setting "Ich hasse Catan!" ---------- */
      .e-card.r-filled {
        color: var(--on-accent);
        background: var(--accent);
        border-color: var(--accent);
      }
      .r-filled .corner {
        color: var(--on-accent);
      }
      .r-filled .r-halfIcon {
        color: var(--accent);
        background: var(--on-accent);
      }
      .r-discard .e-back {
        background: var(--overlay);
        border: 2px solid var(--border);
      }
      .r-discard .e-back:nth-child(1) {
        transform: rotate(8deg) translate(4px, 2px);
      }
      .r-discard .e-back:nth-child(2) {
        transform: rotate(-5deg) translate(-3px, 1px);
      }
      .r-discard .e-back:nth-child(3) {
        border-color: var(--accent-text);
      }
      .r-lines {
        position: absolute;
        inset: 10px 8px;
        background: repeating-linear-gradient(180deg, transparent 0 7px, var(--border) 7px 8px);
      }
      .r-pen {
        position: relative;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        color: var(--on-accent);
        background: var(--accent);
        border: 2px solid var(--overlay);
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="picker">
      <div class="row" id="concept-row"></div>
      <div class="row" id="frame-row"></div>

              'Ergebnis eintragen (I3, US-ER-01 AK-1, Variante K2): ab I3 dunkelt Antippen von „Partie“ den Start ab (Schwarz 70 %) und zeigt mittig zwei Spielkarten – zum Ausprobieren „Mit späteren Funktionen“ wählen und auf „Partie“ tippen. Karten 150 px breit, 5 : 7, ✎ bzw. ▶ in den Ecken, in der Mitte ein Kreis 56 px mit Symbol, darunter der Titel. Links vorne „Ergebnis eintragen“ (Hauptaktion, weil viele ohne Catan spielen): Fläche in Akzent, Schrift und Ecken in der Schrift auf Akzent, Kreis umgekehrt; rechts „Neue Partie“ wie alle Karten. −8° und +8°, beide 6 px tiefer, 12 px Überlappung. Tippen daneben schließt.',
              'Einstellung „Ich hasse Catan!“ (I6): der Start zeigt statt „Partie“ nur die Zeile „Ergebnis eintragen“ (offener Stapel mit Linien und Stift, sonst wie die Zeile „Partie“); Catan zählt nicht mehr bei den Spielen. Zum Ausprobieren unter „Einstellung“ einschalten.',
