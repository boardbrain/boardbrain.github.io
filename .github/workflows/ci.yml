# Prüfungen bei jedem Pull Request nach develop oder main (Architektur 16.3).
# Die Jobnamen check, e2e, pr-title, stat und guard-main verwenden die Schutzregeln.
name: CI

on:
  pull_request:
    branches: [develop, main]
    # edited: ein geänderter Titel wird erneut geprüft
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Sicherheitslücken in Produktivabhängigkeiten
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright-Version ermitteln
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Playwright-Browser aus dem Cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Playwright-Browser installieren
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Systempakete für die Browser installieren
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
      - name: Bericht bei Fehlschlag sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Titel des Pull Requests mit commitlint prüfen
        # Titel über eine Umgebungsvariable, nie direkt im Skript (Schutz vor Einschleusung)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

  stat:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:stat

  guard-main:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Pull Requests nach main nur aus develop oder hotfix/… (EP-04)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "develop" ] || [[ "$HEAD_REF" == hotfix/* ]]; then
            echo "Herkunft $HEAD_REF ist erlaubt."
          else
            echo "::error::Pull Requests nach main sind nur aus develop oder hotfix/… erlaubt, nicht aus $HEAD_REF."
            exit 1
          fi
