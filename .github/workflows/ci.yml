# Checks for every pull request into develop or main (Architecture 16.3).
# The rulesets refer to the job names check, e2e, pr-title, stat and guard-main.
name: CI

on:
  pull_request:
    branches: [develop, main]
    # edited: a changed title is checked again
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Time limits per job: a hanging step (e.g. apt-get) fails quickly instead of after 6 hours.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Reads the installed Playwright version from the lock file, so the container image below
  # always matches it exactly and cannot drift after a dependency update.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - name: Read Playwright version from package-lock.json
        id: read
        run: |
          version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected Playwright version in package-lock.json: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Runs in the official Playwright image: browsers and their system packages are preinstalled,
  # so no download and no apt-get (which has hung on the runners before).
  e2e:
    needs: playwright-version
    # Run even if playwright-version failed: a skipped required check would count as passed,
    # whereas a missing version yields an invalid image and makes this job fail.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # Run as the runner user, as recommended by Playwright for GitHub Actions
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      # The image ships its own Node.js; the project needs the version from .nvmrc
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
      - name: Keep report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check pull request title with commitlint
        # Title via an environment variable, never inline in the script (prevents injection)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

  stat:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:stat

  guard-main:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pull requests into main only from develop or hotfix/… (EP-04)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "develop" ] || [[ "$HEAD_REF" == hotfix/* ]]; then
            echo "Source branch $HEAD_REF is allowed."
          else
            echo "::error::Pull requests into main are only allowed from develop or hotfix/…, not from $HEAD_REF."
            exit 1
          fi
