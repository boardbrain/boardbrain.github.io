# Checks for every pull request into develop or main (Architecture 16.3), only for new commits
# (opened, synchronize, reopened): editing a pull request runs only pr-title.yml.
# The rulesets refer to the job names check, e2e, stat and guard-main; pr-title is in pr-title.yml.
# K-8: a pull request that only changes documentation (docs/, README.md, CLAUDE.md) passes quickly:
# check and stat skip their steps, the end-to-end runners do not start, e2e passes. No paths-ignore,
# because required checks would then never report and the merge would wait forever.
name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # K-8: decides whether the pull request only changes documentation. Compares with the merge base
  # of the target branch, so new commits on develop do not count. --no-renames lists both paths of a
  # moved file, so moving code into docs/ still counts as a code change. An empty list counts as code.
  # Fail-safe: if this job fails, its output is empty and every other job runs in full.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: List changed files
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")
          echo "Changed files:"
          echo "$changed"
          if [ -n "$changed" ] && ! grep -qvE '^(docs/.+|README\.md|CLAUDE\.md)$' <<< "$changed"; then
            docs_only=true
          else
            docs_only=false
          fi
          echo "Only documentation: $docs_only"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  # Time limits per job: a hanging step (e.g. apt-get) fails quickly instead of after 6 hours.
  # K-8: the job always runs (also if changes failed) and skips its steps for documentation only;
  # a skipped required job would count as passed even when changes failed.
  check:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
    steps:
      - name: Only documentation changed, nothing to check
        if: env.DOCS_ONLY == 'true'
        run: echo "Only docs/, README.md or CLAUDE.md changed (K-8)."
      - if: env.DOCS_ONLY != 'true'
        uses: actions/checkout@v7
      - if: env.DOCS_ONLY != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.DOCS_ONLY != 'true'
        run: npm ci
      - if: env.DOCS_ONLY != 'true'
        run: npm run check
      - name: Vulnerabilities in production dependencies
        if: env.DOCS_ONLY != 'true'
        run: npm audit --omit=dev --audit-level=high

  # Reads the installed Playwright version from the lock file, so the container image below
  # always matches it exactly and cannot drift after a dependency update.
  # K-8: not needed for documentation only.
  playwright-version:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - name: Read Playwright version from package-lock.json
        id: read
        run: |
          version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected Playwright version in package-lock.json: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Runs in the official Playwright image: browsers and their system packages are preinstalled,
  # so no download and no apt-get (which has hung on the runners before).
  # K-7: the tests are split across three runners that work at the same time, one per device form,
  # each with Chromium and WebKit. Playwright's --shard splits by test count in project order, which
  # put all Chromium projects in one half and all slower WebKit projects in the other (3.7 vs 7.9
  # minutes). Every test still runs on every device.
  e2e-form:
    name: e2e ${{ matrix.form }}
    needs: [changes, playwright-version]
    # Run even if playwright-version failed: the job e2e below then fails as well, because a
    # missing version yields an invalid image. K-8: do not start for documentation only; the
    # container would be pulled before any step could be skipped.
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # All runners always finish, so a failure shows all failing tests at once.
      fail-fast: false
      matrix:
        # Each form must match the project names chromium-<form> and webkit-<form> in
        # playwright.config.ts; a project missing here would not run on GitHub.
        form: [phone, tablet, tablet-landscape]
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # Run as the runner user, as recommended by Playwright for GitHub Actions
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      # The image ships its own Node.js; the project needs the version from .nvmrc
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e -- --project=chromium-${{ matrix.form }} --project=webkit-${{ matrix.form }}
      - name: Keep report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.form }}
          path: playwright-report/
          retention-days: 7

  # The required check e2e: passes only if all runners passed. A skipped or failed runner fails it,
  # because a skipped required check would count as passed. K-8: for documentation only it passes
  # without runners.
  e2e:
    needs: [changes, e2e-form]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: End-to-end tests passed on all device forms
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          RESULT: ${{ needs.e2e-form.result }}
        run: |
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "Only docs/, README.md or CLAUDE.md changed (K-8), no end-to-end tests needed."
          elif [ "$RESULT" != "success" ]; then
            echo "::error::End-to-end tests: $RESULT"
            exit 1
          fi

  # K-8: like check, runs always and skips its steps for documentation only.
  stat:
    needs: changes
    if: ${{ !cancelled() && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
    steps:
      - name: Only documentation changed, nothing to check
        if: env.DOCS_ONLY == 'true'
        run: echo "Only docs/, README.md or CLAUDE.md changed (K-8)."
      - if: env.DOCS_ONLY != 'true'
        uses: actions/checkout@v7
      - if: env.DOCS_ONLY != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.DOCS_ONLY != 'true'
        run: npm ci
      - if: env.DOCS_ONLY != 'true'
        run: npm run test:stat

  guard-main:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pull requests into main only from develop or hotfix/… (EP-04)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "develop" ] || [[ "$HEAD_REF" == hotfix/* ]]; then
            echo "Source branch $HEAD_REF is allowed."
          else
            echo "::error::Pull requests into main are only allowed from develop or hotfix/…, not from $HEAD_REF."
            exit 1
          fi
