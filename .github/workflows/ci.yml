# Checks for every pull request into develop or main (Architecture 16.3), only for new commits
# (opened, synchronize, reopened): editing a pull request runs only pr-title.yml.
# The rulesets refer to the job names check, e2e, stat and guard-main; pr-title is in pr-title.yml.
name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Time limits per job: a hanging step (e.g. apt-get) fails quickly instead of after 6 hours.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Reads the installed Playwright version from the lock file, so the container image below
  # always matches it exactly and cannot drift after a dependency update.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - name: Read Playwright version from package-lock.json
        id: read
        run: |
          version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected Playwright version in package-lock.json: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Runs in the official Playwright image: browsers and their system packages are preinstalled,
  # so no download and no apt-get (which has hung on the runners before).
  # K-7: the tests are split across three runners that work at the same time, one per device form,
  # each with Chromium and WebKit. Playwright's --shard splits by test count in project order, which
  # put all Chromium projects in one half and all slower WebKit projects in the other (3.7 vs 7.9
  # minutes). Every test still runs on every device.
  e2e-form:
    name: e2e ${{ matrix.form }}
    needs: playwright-version
    # Run even if playwright-version failed: the job e2e below then fails as well, because a
    # missing version yields an invalid image.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # All runners always finish, so a failure shows all failing tests at once.
      fail-fast: false
      matrix:
        # Each form must match the project names chromium-<form> and webkit-<form> in
        # playwright.config.ts; a project missing here would not run on GitHub.
        form: [phone, tablet, tablet-landscape]
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # Run as the runner user, as recommended by Playwright for GitHub Actions
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      # The image ships its own Node.js; the project needs the version from .nvmrc
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e -- --project=chromium-${{ matrix.form }} --project=webkit-${{ matrix.form }}
      - name: Keep report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.form }}
          path: playwright-report/
          retention-days: 7

  # The required check e2e: passes only if all runners passed. A skipped or failed runner fails it,
  # because a skipped required check would count as passed.
  e2e:
    needs: e2e-form
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: End-to-end tests passed on all device forms
        env:
          RESULT: ${{ needs.e2e-form.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::End-to-end tests: $RESULT"
            exit 1
          fi

  stat:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:stat

  guard-main:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pull requests into main only from develop or hotfix/… (EP-04)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "develop" ] || [[ "$HEAD_REF" == hotfix/* ]]; then
            echo "Source branch $HEAD_REF is allowed."
          else
            echo "::error::Pull requests into main are only allowed from develop or hotfix/…, not from $HEAD_REF."
            exit 1
          fi
